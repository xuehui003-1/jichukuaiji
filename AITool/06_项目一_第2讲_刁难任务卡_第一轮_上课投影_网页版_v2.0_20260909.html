<script>
const SLIDES = [
{n:1, kind:"cover", title:"第2讲　刁难任务卡·第一轮", body:["今天不讲提示词课。\n三张刁难卡，一张比一张刁——你卡壳的那一刻，老师才发工具。"], now:"现在你：打开豆包。今天的分，全靠验收挣。"},
{n:2, kind:"text", title:"今天的规矩", body:["① 卡片全是老师给的：原文、步骤、话术、验收标准——你只管照着做。\n② 验收过了才举手报分：卡① +2、卡② +3、卡③ +3，三张全过额外 +2。\n③ 卡壳了别慌——卡壳的地方，正是要发工具的地方。"], now:"现在你：听清楚：验收过了才举手，虚报的不算。"},
{n:3, kind:"task", title:"热身 3 分钟：按你平时的方式问", body:["给豆包发这一句：「帮我写一个请假条。」一个字都不要多加。\n它答完，看一眼结果，记在心里：能用吗？差在哪？"], now:"现在你：发出去。这个结果先留着，一会儿要用。"},
{n:4, kind:"task", title:"刁难卡①　辅导员的乱通知：先自己试", body:["辅导员在群里甩了这么一段（原文已发群里，长按复制）：", "任务：让豆包把这段乱通知整理成要点清单。\n怎么问，用你自己的方式。\n验收预告：时间 / 地点 / 带什么 / 请假制度 / 截止——五条，一条都不能漏。"], now:"现在你：先用自己的问法试。数一数：五条你能问出几条？"},
{n:5, kind:"text", title:"卡壳了？现在发工具：四要素模板", body:["刚才漏了项、问出一堆废话的——多半是这四样里少说了哪样：\n「你是【角色】。请【任务】。要求：【要求】。请用【格式】输出。」\n① 角色——让它当谁；② 任务——让它干什么；③ 要求——干到什么程度；④ 格式——怎么交给你。\n你不说的那一样，它就替你编一样。"], now:"现在你：对着四个空想一想——刚才你漏的是哪一样？"},
{n:6, kind:"text", title:"追问六句：模板一遍不行，就接着问", body:["① 漏了项：「你漏了【缺的内容】，补上重来，其他别动」\n② 太长了：「压缩成 3 句话」\n③ 太笼统：「给具体步骤，至少 5 步」\n④ 格式不对：「改成表格 / 改成清单」\n⑤ 猜错了：「我没说要 XX，按我说的重新来」\n⑥ 不放心：「你这个说法，依据是什么？」\n两条规矩：不换话题；只说要改的。"], now:"现在你：读一遍。下一页，用它把乱通知修到过。"},
{n:7, kind:"task", title:"卡①修到过（验收过 +2 分）", body:["第一步：把乱通知粘进四要素模板——角色填「辅导员助理」，要求里写明「时间、地点、带什么、请假制度、截止，一条都不能漏」——重新发。\n第二步：对着五条验收。漏了哪条，用追问六句修到齐。\n第三步：再发一句变形——「把上面的要点，改写成一条家长能看懂的短信，80 字以内。」"], now:"现在你：填模板、重问、验收。全过举手报 +2。"},
{n:8, kind:"pause", title:"暂停点⑤　请写 60 秒", body:["比一比两种问法：你原来的问法，和填了模板的问法，差在哪？\n刚才修漏项，你用的是哪一句？"], now:"现在你：写在记录册「暂停点⑤」。"},
{n:9, kind:"task", title:"刁难卡②　带限制的 50 元一日游（验收过 +3 分）", body:["任务：石邮院出发，石家庄一日游，预算 50 元。限制三条：\n① 不许打车，只准公交 / 地铁 / 共享单车；② 午饭总共不超过 15 元；③ 下午 6 点前必须回到学校。\n第一步：四要素模板问——角色：石家庄本地向导；任务：一日游方案；要求：预算 50 元＋三条限制原样粘进去；格式：表格（时间 / 地点 / 花费 / 交通方式）。\n第二步：AI 出方案后，原样粘这句自查话术——「对照上面三条限制，逐条检查这个方案：每一条回答『满足』还是『违反』，违反了指出在方案哪一站。」\n第三步：有违反，追问修，再让它自查，直到三条全过。"], now:"现在你：三步做完举手。报分时说清楚：AI 第一次在哪条上翻了车。"},
{n:10, kind:"task", title:"刁难卡③　自相矛盾的需求（验收过 +3 分）", body:["第一步：把这句原样发给豆包——「给我写一张社团招新海报的文案。要求：醒目，但要克制；内容尽量丰富，但要短小；有趣，但要严肃。」看它怎么和稀泥。\n第二步：取舍二选一（老师给定，你只选）：\nA——优先醒目、有趣，内容可以精简；B——优先内容丰富，设计可以普通。\n第三步：追问加一句——「取舍：优先【你选的】，可以牺牲【另一头】，重新写。」"], now:"现在你：三步做完，把结果再读一遍——自己不打架了，才算过。"},
{n:11, kind:"pause", title:"暂停点⑥　请写 60 秒", body:["今天，你是用哪一步让 AI 听话的？一句话写下来。"], now:"现在你：写在记录册「暂停点⑥」。"},
{n:12, kind:"task", title:"收个尾：《提示词小抄》（5 分钟）", body:["老师发半成品模板，你只填四个空：\n「问 AI 办事，要说四件事：①＿＿＿＿，告诉它当谁；②＿＿＿＿，告诉它干什么；③＿＿＿＿，告诉它干到什么程度；④＿＿＿＿，告诉它怎么交给你。」\n填完，把今天你修好的那条命令粘在最下面，截图保存。\n这是这门课唯一的提示词讲义——往后，全靠任务里练。"], now:"现在你：填空、贴命令、截图。忘了空里填什么，回翻第 5 页。"},
{n:13, kind:"key", title:"不用刻意学提示词，<br>任务会教你。", body:["卡壳填模板，漏了就追问，多了列限制，矛盾就取舍——全用上了。"], now:"现在你：这四招记在心里。"},
{n:14, kind:"end", title:"下课。", body:["记住一句：AI 听得懂人话——只要你说清楚要什么、怎么算完。", "课后任务（必做）：写下一件「你想让 AI 查得准、答得准的事」，发企业微信群——第 4 次课，我们给 AI 发一本参考书。"], now:"现在你：记录册合上带走。下次课：刁难卡第二轮，任务更复杂。"},
{n:15, kind:"spare", title:"时间够再用：刁难卡④　长话压三句", body:["老师发一段 300 字的乱长文。发给豆包：「压缩成 3 句话＋1 张表格。」\n验收：数字、时间、截止事项一个没丢。+2 分。"], now:"现在你：老师没说用，就不用看这页。"},
{n:16, kind:"spare", title:"时间够再用：刁难卡⑤　社团自我介绍", body:["把你的自我介绍原样发给豆包，再发：「润色这段自我介绍：真诚、不夸张、150 字以内。」\n验收：读一遍，像人话、没吹牛。+2 分。"], now:"现在你：老师没说用，就不用看这页。"}
];

function esc(s){return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function mark(s){
  let out=esc(s);
  out=out.replace(/&lt;br\s*\/?&gt;/gi,"<br>");
  out=out.replace(/&lt;(\/?)b&gt;/gi,"<$1b>").replace(/&lt;(\/?)strong&gt;/gi,"<$1strong>");
  KEYS.forEach(k=>{ out=out.split(esc(k)).join('<mark class="kw">'+esc(k)+'</mark>'); });
  return out;
}
function bodyHtml(blocks){
  let n=0;
  return (blocks||[]).map(b=>{
    const lines=b.split("\n").filter(x=>x.length);
    return lines.map(x=>{ n++; return `<p style="--d:${(0.08+n*0.07).toFixed(2)}s">${mark(x)}</p>`; }).join("");
  }).join("");
}
let fontScale=1.0;
const FMIN=0.6, FMAX=2.0, FSTEP=0.1;
function setFontScale(s){
  fontScale=Math.min(FMAX,Math.max(FMIN,Math.round(s*100)/100));
  document.documentElement.style.setProperty("--title",(3*fontScale).toFixed(2)+"rem");
  document.documentElement.style.setProperty("--body",(2*fontScale).toFixed(2)+"rem");
  document.documentElement.style.setProperty("--now",(1.55*fontScale).toFixed(2)+"rem");
  const pct=$("fontPct"); if(pct) pct.textContent=Math.round(fontScale*100)+"%";
  $("fontUp").disabled=fontScale>=FMAX;
  $("fontDown").disabled=fontScale<=FMIN;
}
function renderNav(){
  const q=$("q").value.trim();
  $("nav").innerHTML=SLIDES.map((s,idx)=>{
    const t=s.title||("第"+s.n+"页");
    if(q && !t.includes(q) && !String(s.n).includes(q)) return "";
    const short=t.length>16?t.slice(0,15)+"…":t;
    return `<button class="nav-item ${idx===i?"on":""}" data-i="${idx}"><span class="k">${s.n}</span>${esc(short)}</button>`;
  }).join("");
}
function fitCard(){
  const card=$("card"), main=$("main");
  if(!card||!main) return;
  main.style.zoom="";
  const cs=getComputedStyle(main);
  const pad=parseFloat(cs.paddingTop||0)+parseFloat(cs.paddingBottom||0);
  const avail=main.clientHeight-pad;
  const h=card.getBoundingClientRect().height;
  if(h>avail && avail>60){ main.style.zoom=Math.max(0.55, avail/h); }
}
window.addEventListener("resize", ()=>setTimeout(fitCard,60));
function render(dir){
  const s=SLIDES[i];
  const card=$("card");
  card.className="card kind-"+s.kind+" "+(dir==="prev"?"enter-prev":"enter-next");
  let widget="";
  if(s.n===4){
    widget=`<div class="raw">${esc(RAW_NOTICE)}</div>`;
  }
  card.innerHTML=`
    <div class="stamp st-${esc(s.kind)}">${STAMP[s.kind]||""}</div>
    <div class="head"><span class="badge k-${esc(s.kind)}">${KIND[s.kind]||s.kind}</span><h2>${mark(s.title||"")}</h2></div>
    <div class="body">${bodyHtml(s.body||[])}</div>
    ${widget}`;
  const nb=$("nowbar");
  nb.style.animation="none"; void nb.offsetWidth; nb.style.animation="";
  nb.innerHTML=s.now?mark(s.now):"";
  nb.style.display=s.now?"block":"none";
  $("pg").textContent=(i+1)+" / "+SLIDES.length;
  const prog=$("prog"); if(prog) prog.style.width=((i+1)/SLIDES.length*100).toFixed(2)+"%";
  const fl=$("flash"); if(fl && dir){ fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go"); }
  renderNav(); history.replaceState(null,"","#"+s.n); $("main").scrollTop=0;
  setTimeout(fitCard,30); setTimeout(fitCard,420);
}
function go(n){ const next=Math.max(0,Math.min(SLIDES.length-1,n)); const dir=next>i?"next":next<i?"prev":"next"; i=next; render(dir); }
function zoomText(html){ $("lb").innerHTML=`<div class="zoom-text">${html}</div>`; $("lb").classList.add("show"); }
$("prev").onclick=()=>go(i-1);
$("next").onclick=()=>go(i+1);
$("nav").onclick=e=>{ const b=e.target.closest("[data-i]"); if(b) go(+b.dataset.i); };
$("q").oninput=renderNav;
$("menuBtn").onclick=()=>{ if(window.innerWidth<=860) $("side").classList.toggle("open"); else document.body.classList.toggle("wide"); };
$("fontUp").onclick=()=>setFontScale(fontScale+FSTEP);
$("fontDown").onclick=()=>setFontScale(fontScale-FSTEP);
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); go(i+1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(i-1); }
  if(e.key==="Escape") $("lb").classList.remove("show");
});
$("card").addEventListener("click", e=>{
  const p=e.target.closest("p,h2"); if(p) zoomText(p.innerHTML);
});
$("nowbar").addEventListener("click", e=>{ if(e.currentTarget.innerHTML) zoomText(e.currentTarget.innerHTML); });
$("lb").onclick=()=>$("lb").classList.remove("show");
document.body.classList.add("wide"); setFontScale(1.0);
const hash=parseInt(location.hash.replace("#",""),10);
if(hash>=1 && hash<=SLIDES.length) i=hash-1;
render();
</script>
</body>
</html>
