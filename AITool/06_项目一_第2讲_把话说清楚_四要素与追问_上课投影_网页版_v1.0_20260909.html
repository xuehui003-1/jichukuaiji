.ambient .b2{width:44vw;height:44vw;right:-14vw;bottom:-12vh;background:#00c853;animation-delay:-4s}
.ambient .b3{width:32vw;height:32vw;left:38vw;top:38vh;background:#ff1744;opacity:.45;animation-delay:-7s}

.layout,.dock,.top{position:relative;z-index:2}

.card.kind-key,.card.kind-end{background:linear-gradient(160deg,#2d1b12,#3e2723 55%,#4e342e);border:0!important;box-shadow:0 24px 70px rgba(0,0,0,.45)}

.recap .r.on span{max-height:120px;opacity:1;margin-top:6px}
@media (prefers-reduced-motion: reduce){.ambient .blob,.card,.card .head h2,.card .body p,.now,.progress i,.page-flash,.card.kind-pause::before{animation:none!important;transition:none!important}}

<script>
const SLIDES = [
{n:1, kind:"cover", title:"第2讲　把话说清楚", body:["今天不讲理论，就干一件事：同一个问题，问两遍。\n第一遍按你原来的习惯问，第二遍换新问法。\n看看 AI 对你，会不会两副面孔。"], now:"现在你：打开手机豆包，准备开工。"},
{n:2, kind:"text", title:"今天怎么跟", body:["① 热身：按老习惯问一遍，把结果记下来。\n② 学一套模板：四要素，照着填。\n③ 填好再问一遍，自己对比。\n④ 学追问：结果不好，不重问，改到好为止。"], now:"现在你：听。下一页就开始热身。"},
{n:3, kind:"task", title:"热身：按你平时的方式问（3 分钟）", body:["给豆包发这一句：「帮我写一个请假条。」\n一个字都不要多加——你平时怎么问，就怎么问。\n它答完，你记两件事：出来多少字？哪让你不满意？"], now:"现在你：发出去，看结果。两个答案先记在心里。"},
{n:4, kind:"pause", title:"暂停点⑤　请写 60 秒", body:["把你刚才发的那句话，原样抄进记录册。\n再写一句：这次的结果，你最不满意哪里？"], now:"现在你：写在记录册「暂停点⑤」。写完合上，先别讨论。"},
{n:5, kind:"setup", title:"先听一句", body:["你托人办事，是不是有四件事要说？少说一件，对方就得猜一件。\nAI 一模一样——只不过它猜得又快又自信，还不告诉你它在猜。"], now:"现在你：听这四件事是什么。"},
{n:6, kind:"text", title:"四要素：一人一句", body:["① 角色——让它当谁：「你是班主任…」\n② 任务——让它干什么：「写一张请假条…」\n③ 要求——干到什么程度：「150 字以内，语气礼貌…」\n④ 格式——怎么交给你：「分三段：原因、时间、署名」"], now:"现在你：四条读一遍。下一页，全班跟着拼一条。"},
{n:7, kind:"task", title:"跟着拼一条：老师带着填", body:["模板（原样抄）：「你是【角色】。请【任务】。要求：【要求】。请用【格式】输出。」", "老师在大屏上填：「你是有经验的班主任。请帮我写一张病假请假条。要求：150 字以内，语气礼貌，原因是感冒发烧。请输出三段：原因、请假时间、署名。」\n发出去——看这张请假条，是不是能直接交？"], now:"现在你：看大屏，小声跟读。"},
{n:8, kind:"task", title:"现在你填：三张场景卡，挑一张", body:["场景卡老师发，内容全给好了——你只做一件事：把四个空填进模板，原样发出去。"], now:"现在你：挑一张卡，填四个空，原样发给豆包。"},
{n:9, kind:"task", title:"对比：两个结果摆一起", body:["看这个新结果，再回想热身那一个。\n问自己三个问题：还用来回改吗？它瞎猜的地方少了吗？格式是你想要的吗？"], now:"现在你：看自己的结果，三个问题在心里过一遍。"},
{n:10, kind:"pause", title:"暂停点⑥　请写 60 秒", body:["把你填好的新命令，完整抄进记录册。\n再写一句：跟热身那次比，具体好在哪？"], now:"现在你：写在记录册「暂停点⑥」。"},
{n:11, kind:"reveal", title:"对照：三张卡的命令样板", body:["点开看。跟你填的对一对——空填的位置对，就算过。"], now:"现在你：一条一条点开，对一对你填的。"},
{n:12, kind:"key", title:"四要素，少一样，<br>它就猜一样。", body:["角色、任务、要求、格式——你不说，它就编。"], now:"现在你：这一句写在记录册。"},
{n:13, kind:"setup", title:"先听一句", body:["一遍就问对的，很少。结果不好，大多数人的办法是：重问一遍。\n正确办法：就着往下问。追问，是改稿，不是重写。"], now:"现在你：听六句固定话术。"},
{n:14, kind:"text", title:"追问话术卡：六句话，原样粘贴", body:["① 太长了：「压缩成 3 句话」\n② 太笼统：「给具体步骤，至少 5 步」\n③ 格式不对：「改成表格 / 改成清单」\n④ 猜错了：「我没说要 XX，按我说的重新来」\n⑤ 想深挖：「把第 N 条展开讲」\n⑥ 不放心：「你这个说法，依据是什么？」"], now:"现在你：六句读一遍。下一页亲手用一句。"},
{n:15, kind:"task", title:"亲手追一句（3 分钟）", body:["对着你刚才的结果，挑一句最合适的话术，原样粘贴发出去。\n看前后变了什么：改好了？还是改坏了？\n🙋 举手分享：一句话改变了什么——+2 分。"], now:"现在你：追一句。挑哪句，看你结果差在哪。"},
{n:16, kind:"text", title:"追问两条规矩", body:["① 不换话题：问请假条就追请假条，一换话题，前面的全忘。\n② 只说要改的：别把话重说一遍，说「把 XX 改成 XX」就够了。"], now:"现在你：这两条，写在记录册。"},
{n:17, kind:"recap", title:"回看：今天三句", body:["点一下每一条，先自己背出来，再翻开对。"], now:"现在你：三条都看完，再看下一页。"},
{n:18, kind:"end", title:"下课。", body:["记住一句：你说得清，它才办得对。", "课后任务（必做）：用四要素模板，问豆包一个跟你专业有关的问题，截图发企业微信群。\n选做：把六句追问话术都用一遍，看哪句你以后最常使。"], now:"现在你：记录册合上带走。下次课：格式控制＋AI 找茬。"},
{n:19, kind:"spare", title:"时间够再用：刁难卡", body:["老师报一个刁难场景：「给快递小哥写一条感谢短信」。\n四要素填空，原样发出去。谁的结果最接近「能直接发」，举手展示，+2 分。"], now:"现在你：老师没说用，就不用看这页。"},
{n:20, kind:"spare", title:"时间够再用：追问接力", body:["同一个开头问题，只许追问三句，看谁的结果最先能用。\n规矩：只能追问，不许重发。老师投屏对比。"], now:"现在你：老师没说用，就不用看这页。"}
];

const REVEAL=[
 ["卡A · 命令样板","「你是有经验的班主任。请帮我写一张病假请假条。要求：150 字以内，语气礼貌，原因是感冒发烧。请输出三段：原因、请假时间、署名。」"],
 ["卡B · 命令样板","「你是干过三年兼职的学长。请讲石家庄奶茶店兼职有哪些坑，以及开工前该问什么。要求：列 5 条，每条配一个真实例子。请用表格输出：坑 / 应对办法。」"],
 ["卡C · 命令样板","「你是石家庄本地向导。请给我安排从石邮院出发的一日游，预算 50 元。要求：省钱但不无聊，不安排购物点。请用表格输出：时间 / 地点 / 花费 / 避坑提醒。」"]
];
const RECAP=[
 ["一遍问对很少见，会问才关键","四要素：角色、任务、要求、格式——少一样，它猜一样"],
 ["结果不好不重问，就着往下追","六句话术原样粘贴；不换话题，只说要改的"],
 ["AI 不笨，是你没说清","你说得清，它才办得对"]
];
const TPL='你是【角色】。请【任务】。要求：【要求】。请用【格式】输出。';
const KIND={cover:"封面",text:"讲义",setup:"先听一句",task:"动手",pause:"暂停点",key:"金句",reveal:"对答案",recap:"回看",end:"下课",spare:"备用"};
const STAMP={cover:"开讲",text:"记",setup:"听",task:"动手",pause:"写！",key:"记住",reveal:"对答案",recap:"回看",end:"下课",spare:"备用"};
const KEYS=["四要素","角色","任务","要求","格式","追问","模板","场景卡","暂停点"];
let i=0;
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function mark(s){
  let out=esc(s);
  out=out.replace(/&lt;br\s*\/?&gt;/gi,"<br>");
  KEYS.forEach(k=>{ out=out.split(esc(k)).join('<mark class="kw">'+esc(k)+'</mark>'); });
  return out;
}
function bodyHtml(blocks){
  let n=0;
  return (blocks||[]).map(b=>{
    const lines=b.split("\n").filter(x=>x.length);
    return lines.map(x=>{ n++; return `<p style="--d:${(0.08+n*0.07).toFixed(2)}s">${mark(x)}</p>`; }).join("");
  }).join("");
}
let fontScale=1.0;
const FMIN=0.6, FMAX=2.0, FSTEP=0.1;
function setFontScale(s){
  fontScale=Math.min(FMAX,Math.max(FMIN,Math.round(s*100)/100));
  document.documentElement.style.setProperty("--title",(3*fontScale).toFixed(2)+"rem");
  document.documentElement.style.setProperty("--body",(2*fontScale).toFixed(2)+"rem");
  document.documentElement.style.setProperty("--now",(1.55*fontScale).toFixed(2)+"rem");
  const pct=$("fontPct"); if(pct) pct.textContent=Math.round(fontScale*100)+"%";
  $("fontUp").disabled=fontScale>=FMAX;
  $("fontDown").disabled=fontScale<=FMIN;
}
function renderNav(){
  const q=$("q").value.trim();
  $("nav").innerHTML=SLIDES.map((s,idx)=>{
    const t=s.title||("第"+s.n+"页");
    if(q && !t.includes(q) && !String(s.n).includes(q)) return "";
    const short=t.length>16?t.slice(0,15)+"…":t;
    return `<button class="nav-item ${idx===i?"on":""}" data-i="${idx}"><span class="k">${s.n}</span>${esc(short)}</button>`;
  }).join("");
}
function fitCard(){
  const card=$("card"), main=$("main");
  if(!card||!main) return;
  main.style.zoom="";
  const cs=getComputedStyle(main);
  const pad=parseFloat(cs.paddingTop||0)+parseFloat(cs.paddingBottom||0);
  const avail=main.clientHeight-pad;
  const h=card.getBoundingClientRect().height;
  if(h>avail && avail>60){ main.style.zoom=Math.max(0.55, avail/h); }
}
window.addEventListener("resize", ()=>setTimeout(fitCard,60));
function render(dir){
  const s=SLIDES[i];
  const card=$("card");
  card.className="card kind-"+s.kind+" "+(dir==="prev"?"enter-prev":"enter-next");
  let widget="";
  if(s.kind==="reveal"){
    widget=`<div class="reveal">`+REVEAL.map((r,k)=>`<div class="r" data-r="${k}"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join("")+`</div>`;
  }else if(s.kind==="recap"){
    widget=`<div class="recap">`+RECAP.map((r,k)=>`<div class="r" data-r="${k}"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join("")+`</div>`;
  }else if(s.n===7){
    const cmdHtml=esc(TPL).replace(/【(角色|任务|要求|格式)】/g,'<span class="slot">【$1】</span>');
    widget=`<div class="cmd">${cmdHtml}</div>`;
  }else if(s.n===8){
    widget=`<div class="opts">`+SCENES.map(o=>`<div class="optc"><h4>${esc(o[0])}</h4>`+o.slice(1).map(x=>`<span>${esc(x)}</span>`).join("")+`</div>`).join("")+`</div>`;
  }
  card.innerHTML=`
    <div class="stamp st-${esc(s.kind)}">${STAMP[s.kind]||""}</div>
    <div class="head"><span class="badge k-${esc(s.kind)}">${KIND[s.kind]||s.kind}</span><h2>${mark(s.title||"")}</h2></div>
    <div class="body">${bodyHtml(s.body||[])}</div>
    ${widget}`;
  const nb=$("nowbar");
  nb.style.animation="none"; void nb.offsetWidth; nb.style.animation="";
  nb.innerHTML=s.now?mark(s.now):"";
  nb.style.display=s.now?"block":"none";
  $("pg").textContent=(i+1)+" / "+SLIDES.length;
  const prog=$("prog"); if(prog) prog.style.width=((i+1)/SLIDES.length*100).toFixed(2)+"%";
  const fl=$("flash"); if(fl && dir){ fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go"); }
  card.querySelectorAll(".reveal .r,.recap .r").forEach(el=>el.onclick=()=>el.classList.toggle("on"));
  renderNav(); history.replaceState(null,"","#"+s.n); $("main").scrollTop=0;
  setTimeout(fitCard,30); setTimeout(fitCard,420);
}
function go(n){ const next=Math.max(0,Math.min(SLIDES.length-1,n)); const dir=next>i?"next":next<i?"prev":"next"; i=next; render(dir); }
function zoomText(html){ $("lb").innerHTML=`<div class="zoom-text">${html}</div>`; $("lb").classList.add("show"); }
$("prev").onclick=()=>go(i-1);
$("next").onclick=()=>go(i+1);
$("nav").onclick=e=>{ const b=e.target.closest("[data-i]"); if(b) go(+b.dataset.i); };
$("q").oninput=renderNav;
$("menuBtn").onclick=()=>{ if(window.innerWidth<=860) $("side").classList.toggle("open"); else document.body.classList.toggle("wide"); };
$("fontUp").onclick=()=>setFontScale(fontScale+FSTEP);
$("fontDown").onclick=()=>setFontScale(fontScale-FSTEP);
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); go(i+1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(i-1); }
  if(e.key==="Escape") $("lb").classList.remove("show");
});
$("card").addEventListener("click", e=>{
  const p=e.target.closest("p,h2"); if(p) zoomText(p.innerHTML);
});
$("nowbar").addEventListener("click", e=>{ if(e.currentTarget.innerHTML) zoomText(e.currentTarget.innerHTML); });
$("lb").onclick=()=>$("lb").classList.remove("show");
document.body.classList.add("wide"); setFontScale(1.0);
const hash=parseInt(location.hash.replace("#",""),10);
if(hash>=1 && hash<=SLIDES.length) i=hash-1;
render();
</script>
</body>
</html>
