<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目一　上课投影（网页阅读版）v1.0</title>
<style>
:root{
  --orange:#bf360c; --green:#2e7d32; --cream:#fff6eb; --ink:#2a1f18;
  --gold:#f9a825; --brown:#3e2723; --paper:#fffdf8; --line:#f0e4d4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f4eee6;color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;}
body{display:flex;flex-direction:column;min-height:100vh}
.top{
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:var(--brown);color:#fff;flex-shrink:0;
}
.top h1{font-size:16px;font-weight:700;letter-spacing:.04em}
.top small{opacity:.75;font-size:12px;font-weight:400;margin-left:8px}
.top .hint{margin-left:auto;font-size:12px;opacity:.8}
.layout{display:grid;grid-template-columns:280px 1fr;flex:1;min-height:0}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side{display:none}.side.open{display:block;position:fixed;inset:52px 0 64px 0;z-index:5;background:#fff8f0}}
.side{background:#fff8f0;border-right:1px solid var(--line);overflow:auto;padding:10px 0}
.side input{width:calc(100% - 20px);margin:6px 10px 10px;padding:8px 10px;border:1px solid #e6d5c3;border-radius:8px;font:inherit;font-size:13px}
.nav-item{display:block;width:100%;text-align:left;padding:8px 14px;border:0;background:transparent;font:inherit;cursor:pointer;color:#5a4638;font-size:13px;line-height:1.4}
.nav-item:hover{background:#f8e8d8}
.nav-item.on{background:#bf360c;color:#fff}
.nav-item .k{display:inline-block;min-width:28px;opacity:.65;font-variant-numeric:tabular-nums}
.main{overflow:auto;padding:18px 18px 90px;display:flex;justify-content:center}
.card{width:min(980px,100%);background:var(--paper);border-radius:16px;box-shadow:0 8px 28px rgba(62,39,35,.08);border:1px solid var(--line);overflow:hidden}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.k-cover{background:#3e2723;color:#ffcc80}
.k-pause{background:#fff3e0;color:#bf360c;border:1px solid #ffcc80}
.k-pic{background:#e8f5e9;color:#2e7d32}
.k-setup{background:#eceff1;color:#455a64}
.k-homework{background:#fff8e1;color:#f57f17;border:1px solid #ffe082}
.k-teacher{background:#efebe9;color:#5d4037}
.k-game{background:#e3f2fd;color:#1565c0}
.k-thumbs{background:#fce4ec;color:#ad1457}
.k-text{background:#f5f5f5;color:#616161}
.k-spare{background:#eeeeee;color:#757575}
.head{padding:22px 28px 8px}
.head h2{font-size:26px;line-height:1.35;color:var(--brown)}
.body{padding:8px 28px 20px;font-size:18px;line-height:1.75}
.body p{margin:0 0 10px}
.body .why{background:#fff8e1;border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0}
.pics{padding:0 28px 16px;display:grid;gap:12px}
.pics.one{grid-template-columns:1fr}
.pics.many{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pics img{width:100%;border-radius:10px;border:1px solid var(--line);background:#faf6f0;cursor:zoom-in;display:block}
.cap{font-size:13px;color:#7a6456;text-align:center;margin-top:4px}
.now{background:var(--green);color:#fff;padding:14px 28px;font-size:16px;font-weight:700;line-height:1.55}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-top:1px solid var(--line);z-index:4}
.bar button{border:0;background:var(--orange);color:#fff;font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer}
.bar button.ghost{background:#efebe9;color:var(--brown)}
.bar .pg{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;color:#6d5648}
.lb{position:fixed;inset:0;background:rgba(30,18,12,.88);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
.lb.show{display:flex}
.lb img{max-width:96vw;max-height:92vh;border-radius:8px}
.menu{display:none;border:0;background:#efebe9;color:var(--brown);font:inherit;font-weight:700;padding:8px 12px;border-radius:8px;cursor:pointer}
@media(max-width:860px){.menu{display:inline-block}.head h2{font-size:22px}.body{font-size:16px}}
</style>
</head>
<body>
<header class="top">
  <button class="menu" id="menuBtn" type="button">目录</button>
  <h1>项目一　认识会计工作 <small>上课投影 · 网页阅读版 v1.0　2026-08-28</small></h1>
  <div class="hint">← → 翻页　点击图片可放大　上课投影仍可用 PPT</div>
</header>
<div class="layout">
  <aside class="side" id="side">
    <input id="q" placeholder="搜标题，比如 暂停点、外卖、天平" />
    <div id="nav"></div>
  </aside>
  <main class="main">
    <article class="card" id="card"></article>
  </main>
</div>
<div class="bar">
  <button class="ghost" type="button" id="prev">上一页</button>
  <div class="pg" id="pg"></div>
  <button type="button" id="next">下一页</button>
</div>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>
<script>
const SLIDES = [{"n": 1, "kind": "cover", "title": "项目一　认识会计工作", "body": ["小新每个月两千五，花哪了自己说不清。"], "now": "现在你：拿出记录册，翻到项目一。这本册子这堂课带着，下课带走，不用交。", "pics": []}, {"n": 2, "kind": "text", "title": "这堂课你怎么跟", "body": ["图放完，老师会抽三个人。抽到你：把册子举起来就行，不用说一个字。\n\n写了：2 分。写得好或愿意念：这题算 5 分。没写：老师跳过，不批评。\n\n册子不用交。不用举手抢答。不用提醒老师给自己加分。\n没抽到你，字也要留下——这本册子你一直带着。"], "now": "现在你：听老师。先别写。不用交。不用举手。", "pics": []}, {"n": 3, "kind": "text", "title": "今天先搞懂什么", "body": ["1. 会计在做哪三件事：记下来、看出不对劲、决定怎么改。\n\n2. 你有的、你欠的、真正属于你的——三边要平。\n\n3. 六个词：资产、负债、所有者权益、收入、费用、利润。\n\n先不用背定义。先把小新那两千五算明白。"], "now": "现在你：听老师。先别写。下面开始算你自己的账。", "pics": []}, {"n": 4, "kind": "setup", "title": "先听一句　再看图", "body": ["先别看书。先算你自己这个月。", "看图时请盯住：\n你猜的数字，等会儿要跟真实账单比。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 5, "kind": "pause", "title": "项目一第1暂停点　请写 15 秒", "body": ["写在册子上：\n\n我猜自己这个月花了 ______ 元\n花得最多的是 ______", "对不对没关系。写了就行。"], "now": "现在你：拿出记录册，写在「项目一第1暂停点」。写完不用交、不用举手、不用喊老师加分。老师会抽三个人看册子；抽到你就把册子举起来。没抽到也把字留下。", "pics": []}, {"n": 6, "kind": "setup", "title": "先听一句　再看图", "body": ["你刚也可能答不上来。小新每个月零花钱两千五，同样说不清花哪了。", "看图时请盯住：\n小新怎么跟他妈要钱；妈问的那一句。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 7, "kind": "pic", "title": "小新答不上来", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/52097ef17025.jpg"}]}, {"n": 8, "kind": "setup", "title": "先听一句　再看图", "body": ["他后来开始记。花一笔，记一笔。合计那一栏是空的，留给你加。", "看图时请盯住：\n八行数字。合计是空的。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 9, "kind": "pic", "title": "一个月的账单", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/bfa139fdd621.jpg"}]}, {"n": 10, "kind": "pause", "title": "项目一第2暂停点　请写 25 秒", "body": ["这八笔加起来是多少？在册子上算出来。\n\n算完接着写：如果是你，你会问哪一句？", "合计图上没有。算完老师口头说。"], "now": "现在你：拿出记录册，写在「项目一第2暂停点」。写完不用交、不用举手、不用喊老师加分。老师会抽三个人看册子；抽到你就把册子举起来。没抽到也把字留下。", "pics": []}, {"n": 11, "kind": "setup", "title": "先听一句　再看图", "body": ["总数有了。风间只问了一句，小新就愣了。看他问的是哪一句。", "看图时请盯住：\n风间手指的那一行；图上写着的那句话。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 12, "kind": "pic", "title": "风间问的那一句", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/e9388db2b2da.jpg"}]}, {"n": 13, "kind": "setup", "title": "先听一句　再看图", "body": ["外卖单独记一栏，买的到底是饭，还是别的？看中午和晚上差在哪。", "看图时请盯住：\n左边食堂 12 元，右边外卖 25 元。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 14, "kind": "pic", "title": "十二块和二十五块", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/0527ca1890b5.jpg"}]}, {"n": 15, "kind": "thumbs", "title": "四张图连起来，会计在干什么", "body": ["1 说不清花哪了　→　所以要记下来\n2 花一笔记一笔　→　才有一张能加总的账单\n3 外卖单独记一栏　→　才能问出这一栏到底是什么\n4 十二块和二十五块　→　看清多花的钱买的是懒得下楼", "1 说不清花哪了", "2 花一笔记一笔", "3 外卖为什么单独记", "4 买的是懒得下楼"], "now": "现在你：这四张先记住。下一张打开你自己的外卖账单。", "pics": [{"src": "01-00_上课投影_网页素材/52097ef17025.jpg"}, {"src": "01-00_上课投影_网页素材/bfa139fdd621.jpg"}, {"src": "01-00_上课投影_网页素材/e9388db2b2da.jpg"}, {"src": "01-00_上课投影_网页素材/0527ca1890b5.jpg"}]}, {"n": 16, "kind": "pause", "title": "项目一第3暂停点　请写 30 秒", "body": ["打开你的外卖软件，看这个月账单。\n\n把真实数字写在册子上，再写：\n我猜的和实际差了 ______ 元。", "不用把手机屏幕给老师看。不用交。数字只有你自己和抽到时老师看得到。"], "now": "现在你：拿出记录册，写在「项目一第3暂停点」。写完不用交、不用举手、不用喊老师加分。老师会抽三个人看册子；抽到你就把册子举起来。没抽到也把字留下。", "pics": []}, {"n": 17, "kind": "setup", "title": "先听一句　再看图", "body": ["你刚才翻了自己的账单。一家公司一个月可能是几百万。需要有人做哪几件事？名字我最后才说。", "看图时请盯住：\n黑板上那三行：记下来、看出不对劲、决定怎么改。右边先空着。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 18, "kind": "pic", "title": "那三件事", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/1c8cd7a566e6.jpg"}]}, {"n": 19, "kind": "text", "title": "这三个名字，现在才给", "body": ["记下来　　→　核算\n看出不对劲　→　监督\n决定怎么改　→　预测决策\n\n名字不重要。重要的是：你刚才在自己身上，已经把前两件做了一遍。"], "now": "现在你：听老师。这三个词先不用背、不用抄。", "pics": []}, {"n": 20, "kind": "setup", "title": "先听一句　再看图", "body": ["花钱会记了。赚钱呢？小新觉得自己赚了四百。这个数靠得住吗？", "看图时请盯住：\n他报出来的「四百」；有没有漏的。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 21, "kind": "pic", "title": "我赚了四百", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/6d922d38f484.jpg"}]}, {"n": 22, "kind": "setup", "title": "先听一句　再看图", "body": ["四百这个数，有东西没算进去。下一张图，你来找他漏了什么。", "看图时请盯住：\n图上多出来的、他没算的那些。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 23, "kind": "pic", "title": "被漏算的东西", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/60e403740b7f.jpg"}]}, {"n": 24, "kind": "pause", "title": "项目一第4暂停点　请写 30 秒", "body": ["看图，小新漏算了什么？一样样找出来写在册子上。\n\n然后重算：他实际赚了多少？", "找出来自然就要加起来。"], "now": "现在你：拿出记录册，写在「项目一第4暂停点」。写完不用交、不用举手、不用喊老师加分。老师会抽三个人看册子；抽到你就把册子举起来。没抽到也把字留下。", "pics": []}, {"n": 25, "kind": "setup", "title": "先听一句　再看图", "body": ["漏的加回去。四百还是不是四百？", "看图时请盯住：\n重算之后的那个数。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 26, "kind": "pic", "title": "重算一遍", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/e178f00d3187.jpg"}]}, {"n": 27, "kind": "setup", "title": "先听一句　再看图", "body": ["钱的数算完了。还有一件事跟钱的数字无关——这单做了多久。没有这张日历，下一题你会无从想起。", "看图时请盯住：\n十九天。钱被压着的这十九天。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 28, "kind": "pic", "title": "这单做了多久", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/8dce6a13e198.jpg"}]}, {"n": 29, "kind": "pause", "title": "加分题　项目一第5暂停点　请写 20 秒", "body": ["这十九天里，小新那八百块钱在干什么？\n\n如果十九天能转两次，他能赚多少？", "写出「钱被压着，不能拿去收第二台」或算出「转两次能赚 360」，抽到你算 5 分。"], "now": "现在你：拿出记录册，写在「项目一第5暂停点」。这题难一点，写对了抽到你算 5 分。不用自己提醒老师加分。不用交。不用举手（抽到再举册子）。", "pics": []}, {"n": 30, "kind": "setup", "title": "先听一句　再看图", "body": ["同样十九天。转一次，和转两次，赚的不一样。", "看图时请盯住：\n两边对比。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 31, "kind": "pic", "title": "转一次 vs 转两次", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/17235a2aa942.jpg"}]}, {"n": 32, "kind": "setup", "title": "先听一句　再看图", "body": ["钱不是躺着的，钱在转。会计到底管什么、不管什么？", "看图时请盯住：\n钱怎么转圈。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 33, "kind": "pic", "title": "钱在转圈", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-0 kind": "setup", "title": "先听一句　再看图", "body": ["他妈问得清「家里有什么」。后面两个问题，她不一定问得出。你来猜。", "看图时请盯住：\n三块牌子；后面两块空着。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 58, "kind": "pic", "title": "三块牌子", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/6f971b2d028c.jpg"}]}, {"n": 59, "kind": "pause", "title": "加分题　项目一第11暂停点　请写 30 秒", "body": ["他妈接下来要问的两个问题，会是什么？\n把你猜的写下来。", "猜到「赚了多少」「花了多少」这个方向，抽到你算 5 分。写出收入、支出、这个月变化都算。"], "now": "现在你：拿出记录册，写在「项目一第11暂停点」。这题难一点，写对了抽到你算 5 分。不用自己提醒老师加分。不用交。不用举手（抽到再举册子）。", "pics": []}, {"n": 60, "kind": "pause", "title": "项目一第12暂停点　请写 20 秒", "body": ["要说清「这一个月发生了什么」，\n需要几个新词？分别是什么？", "先猜。下一张图给答案。不要提前翻书。"], "now": "现在你：拿出记录册，写在「项目一第12暂停点」。写完不用交、不用举手、不用喊老师加分。老师会抽三个人看册子；抽到你就把册子举起来。没抽到也把字留下。", "pics": []}, {"n": 61, "kind": "setup", "title": "先听一句　再看图", "body": ["六个词。这是这一部分最重要的一张图。看就行，先不用抄。", "看图时请盯住：\n上面三个、下面三个。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 62, "kind": "pic", "title": "六个会计要素", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/4a677ed04afd.jpg"}]}, {"n": 63, "kind": "teacher", "title": "【活动日】今天做分组举牌？看这一页", "body": ["为什么：练的是听到科目立刻归到六个词。每题只有一个组举牌。\n今天做「六要素举牌」：打开 90-C14，从「活动日　怎么上」往下投。桌签用 90-C16。\n今天不做分组：直接翻下一页「打地鼠」。两件事不要同一天都做。\n这一页就是标记。不用猜哪几页是活动日。"], "now": "现在你：听老师说今天做不做。做就按桌签坐；不做就等打地鼠。", "pics": []}, {"n": 64, "kind": "game", "title": "打地鼠　要素档", "body": ["为什么：练的是——听到一个科目，马上说出它属于六个词里的哪一个。\n老师抽人上台。没抽到的看，可以小声喊。\n题目：这个科目属于六个词里的哪一个？敲对的那只地鼠。\n不用写册子。不用交。上台前告诉老师你的名字，方便记分。答错不扣人。"], "now": "现在你：抽到你就上台。没抽到就看、可以喊。不用写册子。", "pics": []}, {"n": 65, "kind": "text", "title": "接下来换一家店", "body": ["刚才是你自己的身家。\n接下来是一家奶茶店的五笔业务。\n天平还是那一台，一次都不能歪。"], "now": "现在你：听老师。先别写。记录册还拿着。", "pics": []}, {"n": 66, "kind": "setup", "title": "先听一句　再看图", "body": ["一家小店。左边右边，还是要平。", "看图时请盯住：\n店的天平两边写了什么。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 67, "kind": "pic", "title": "奶茶店的天平", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/a5738dfddcd6. 请盯住：\n哪个数算错了"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 80, "kind": "pic", "title": "找茬", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/e201a1b7af93.jpg"}]}, {"n": 81, "kind": "setup", "title": "先听一句　再看图", "body": ["备用。先做什么后做什么。", "看图时请盯住：\n先做什么后做什么"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 82, "kind": "pic", "title": "开店五件事排序", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/bf6655d6017d.jpg"}]}, {"n": 83, "kind": "setup", "title": "先听一句　再看图", "body": ["备用。同一套东西，换个规模。", "看图时请盯住：\n同一套东西，换个规模"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": []}, {"n": 84, "kind": "pic", "title": "一个学生 vs 一家店", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "01-00_上课投影_网页素材/3afa09604a59.jpg"}]}, {"n": 85, "kind": "text", "title": "如果老师说填表", "body": ["打开企业微信，填开学点单。\n\n学号一定要填对。不是考试，没有标准答案。\n当堂提交。不用写在册子上。不用交纸。"], "now": "现在你：打开企业微信填表。学号填完整。填完提交。不用写册子。", "pics": []}, {"n": 86, "kind": "text", "title": "离开教室之前记住三句", "body": ["1. 记下来、看出不对劲、决定怎么改。\n\n2. 有的 = 欠的 + 真正属于你的。天平不能歪。\n\n3. 六个词。名字是后来才有的，事先你已经算过一遍。\n\n册子带走。不用交。"], "now": "现在你：合上册子带走。不用交。不用举手。", "pics": []}, {"n": 87, "kind": "homework", "title": "下课前看这一页", "body": ["做什么：对着下面四张图，按 1→2→3→4 讲大约 40 秒，发班级群。\n为什么：这四张图连起来，就是会计在干的事。自己讲一遍，才知道为什么要一笔记一笔、还要分栏记。\n怎么讲：①说不清两千五花哪了  ②开始一笔记一笔  ③风间问外卖为什么单独记  ④那笔钱买的是懒得下楼。最后补一句：记下来、看出不对劲、决定怎么改。\n做完：发班级群。不用交本子。下节课抽几个人，愿意放给大家听的加分。\n另外：教材判断题前 3 道，为的是把课堂上的说法对上书上的说法。写在册子或教材上。不用交。下节课抽人对一下。", "1 说不清花哪了", "2 花一笔记一笔", "3 外卖为什么单独记", "4 买的是懒得下楼"], "now": "现在你：课后按上面四张图录音，发班级群。不用交本子。", "pics": [{"src": "01-00_上课投影_网页素材/52097ef17025.jpg"}, {"src": "01-00_上课投影_网页素材/bfa139fdd621.jpg"}, {"src": "01-00_上课投影_网页素材/e9388db2b2da.jpg"}, {"src": "01-00_上课投影_网页素材/0527ca1890b5.jpg"}]}];
const KIND = {
  cover:"封面", pause:"暂停点", pic:"看图", setup:"先听一句",
  homework:"课后任务", teacher:"老师看", game:"打地鼠",
  thumbs:"四张图", text:"讲义", spare:"备用"
};
let i = 0;
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function bodyHtml(blocks){
  return blocks.map(b=>{
    const lines = b.split("\n").filter(x=>x.length);
    const cls = lines.some(x=>x.startsWith("为什么：")) ? "why" : "";
    return `<div class="${cls}">` + lines.map(x=>`<p>${esc(x)}</p>`).join("") + `</div>`;
  }).join("");
}
function renderNav(){
  const q = $("q").value.trim();
  $("nav").innerHTML = SLIDES.map((s,idx)=>{
    const t = s.title || ("第"+s.n+"页");
    if(q && !t.includes(q) && !String(s.n).includes(q) && !(s.kind||"").includes(q)) return "";
    return `<button class="nav-item ${idx===i?"on":""}" data-i="${idx}"><span class="k">${s.n}</span>${esc(t)}</button>`;
  }).join("");
}
function render(){
  const s = SLIDES[i];
  const nPic = (s.pics||[]).length;
  const grid = nPic>=3 ? "many" : "one";
  const imgs = (s.pics||[]).map(p=>`<img src="${esc(p.src)}" alt="">`).join("");
  $("card").innerHTML = `
    <div class="head">
      <span class="badge k-${esc(s.kind)}">${KIND[s.kind]||s.kind}</span>
      <h2>${esc(s.title||"")}</h2>
    </div>
    <div class="body">${bodyHtml(s.body||[])}</div>
    ${nPic?`<div class="pics ${grid}">${imgs}</div>`:""}
    ${s.now?`<div class="now">${esc(s.now)}</div>`:""}
  `;
  $("pg").textContent = (i+1) + " / " + SLIDES.length;
  renderNav();
  history.replaceState(null,"","#"+s.n);
  $("card").parentElement.scrollTop = 0;
}
function go(n){ i = Math.max(0, Math.min(SLIDES.length-1, n)); render(); }
$("prev").onclick = ()=>go(i-1);
$("next").onclick = ()=>go(i+1);
$("nav").onclick = e=>{ const b=e.target.closest("[data-i]"); if(b) go(+b.dataset.i); };
$("q").oninput = renderNav;
$("menuBtn").onclick = ()=> $("side").classList.toggle("open");
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ") { e.preventDefault(); go(i+1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp") { e.preventDefault(); go(i-1); }
  if(e.key==="Escape") $("lb").classList.remove("show");
});
$("card").addEventListener("click", e=>{
  if(e.target.tagName==="IMG"){ $("lbimg").src=e.target.src; $("lb").classList.add("show"); }
});
$("lb").onclick = ()=> $("lb").classList.remove("show");
const hash = parseInt(location.hash.replace("#",""),10);
if(hash>=1 && hash<=SLIDES.length) i = hash-1;
render();
</script>
