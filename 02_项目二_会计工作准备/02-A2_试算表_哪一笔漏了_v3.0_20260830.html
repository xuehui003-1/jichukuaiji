<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>试算表　哪一笔漏了</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#1a1030;color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
.top{background:#2d1b4e;padding:8px 14px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top small{opacity:.8;font-weight:600}
.top a,.top button,.go{font:inherit;font-weight:800;border:0;border-radius:10px;padding:7px 12px;cursor:pointer;text-decoration:none;color:#3d2352;background:#ffd54f}
.top a.o{background:rgba(255,255,255,.15);color:#fff}
.who{background:#fff3e0;color:#bf360c;padding:4px 10px;border-radius:999px}
.now{background:#2e7d32;color:#fff;padding:10px 16px;font-size:20px;font-weight:800}
.wrap{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:12px 14px}
.scale{height:120px;position:relative;margin:8px auto 16px;max-width:640px}
.beam{position:absolute;left:8%;right:8%;top:38px;height:14px;background:#ffd54f;border-radius:8px;transform-origin:50% 50%;transition:transform .5s}
.beam:before{content:"";position:absolute;left:50%;top:-22px;width:16px;height:36px;margin-left:-8px;background:#ce93d8;border-radius:4px}
.pan{position:absolute;top:52px;width:120px;height:54px;background:rgba(255,255,255,.12);border:3px solid #ffd54f;border-radius:0 0 40px 40px;text-align:center;font-weight:900;padding-top:8px}
.pan.L{left:6%}.pan.R{right:6%}
.fulcrum{position:absolute;left:50%;top:54px;margin-left:-18px;border-left:18px solid transparent;border-right:18px solid transparent;border-top:28px solid #ce93d8}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:16px}
th{background:rgba(255,255,255,.1);color:#ffd54f;padding:8px;text-align:left}
td{border:1px solid rgba(255,255,255,.12);padding:4px}
input{width:100%;background:rgba(0,0,0,.28);border:1px solid transparent;color:#fff;padding:8px;border-radius:6px;font:inherit}
input:focus{border-color:#ffd54f;outline:0}
input.num{text-align:right;font-family:ui-monospace,monospace}
tfoot td{background:rgba(255,255,255,.08);font-weight:900;font-size:18px;padding:10px 8px;text-align:right}
.verdict{margin-top:12px;padding:16px;border-radius:12px;text-align:center;font-size:22px;font-weight:900}
.verdict.ok{background:rgba(102,187,106,.22);color:#a5d6a7;border:2px solid #66bb6a}
.verdict.no{background:rgba(239,83,80,.22);color:#ef9a9a;border:2px solid #ef5350}
.verdict.idle{background:rgba(255,255,255,.06);color:#b39ddb;border:2px dashed rgba(255,255,255,.2);font-size:16px}
.hud{display:flex;justify-content:center;gap:12px;align-items:center;margin:8px 0}
.timer{width:88px;height:88px;border-radius:50%;border:8px solid #ffd54f;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;background:#2d1b4e}
.timer.low{border-color:#ef5350;color:#ef5350;animation:pulse .45s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.gate,.cut{position:fixed;inset:0;background:rgba(15,8,28,.92);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.gate.on,.cut.on{display:flex}
.mbox{background:#fff;color:#2c2135;border-radius:18px;padding:28px;max-width:520px;text-align:center}
.mbox h2{color:#7b1fa2;font-size:26px;margin-bottom:10px}
button.go{font-size:20px;padding:12px 22px}
.hint{color:#ce93d8;font-weight:700;margin-top:8px;line-height:1.5}
.del{background:rgba(239,83,80,.3);border:0;color:#ef9a9a;width:32px;height:32px;border-radius:8px;cursor:pointer;font-weight:900}
</style>
</head>
<body>
<div class="top">
  试算表　哪一笔漏了
  <small>两边加起来要一样多。差多少，漏的就是那一笔。</small>
  <span class="who" id="whoBar" hidden></span>
  <span style="margin-left:auto"></span>
  <a class="o" id="backDraw" href="../90_通用工具_全学期复用/90-B3_抽人抽组_上场_v1.27_20260830.html?use=shisuan">换人再抽</a>
  <a class="o" id="backLecture" href="02-00_项目二_上课投影_网页版_v1.2_20260830.html#59">回课件</a>
</div>
<div class="now" id="now">现在你：看天平两边。差 8 万。猜漏了哪一笔，在表里补上。</div>
<div class="wrap">
  <div class="hud"><div class="timer" id="timer" hidden>45</div></div>
  <div class="scale">
    <div class="beam" id="beam"></div>
    <div class="fulcrum"></div>
    <div class="pan L" id="panL">借 0</div>
    <div class="pan R" id="panR">贷 0</div>
  </div>
  <div class="card">
    <table>
      <thead><tr><th style="width:42%">会计科目</th><th>借方</th><th>贷方</th><th style="width:40px"></th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot><tr><td style="text-align:left">合计</td><td id="sumD">0</td><td id="sumC">0</td><td></td></tr></tfoot>
    </table>
    <p style="margin-top:10px"><button class="go" type="button" onclick="addRow()">＋ 加一行</button></p>
    <div class="verdict idle" id="verdict">改数字或加一行。天平会跟着歪。</div>
    <div class="hint" id="hint"></div>
  </div>
</div>
<div class="gate" id="gate"><div class="mbox">
  <h2 id="gateWho">上场找漏账</h2>
  <p style="font-weight:700;margin:8px 0 16px;line-height:1.5">45 秒。这张表对不上。补上漏的那一笔，让天平平下来。</p>
  <button class="go" type="button" id="btnStart">开始</button>
</div></div>
<div class="cut" id="cut"><div class="mbox" id="cutBox"></div></div>
<script>
const DRAW="../90_通用工具_全学期复用/90-B3_抽人抽组_上场_v1.27_20260830.html?use=shisuan";
const LECTURE="02-00_项目二_上课投影_网页版_v1.2_20260830.html#59";
const qs=new URLSearchParams(location.search);
function currentPlayer(){
  if(qs.get("name")) return qs.get("name");
  try{ const h=JSON.parse(localStorage.getItem("draw-handoff")||"{}");
    if(h&&h.name&&Date.now()-(h.ts||0)<1000*60*40) return h.name; }catch(e){}
  return "";
}
function lectureHref(){
  try{ const h=JSON.parse(localStorage.getItem("draw-handoff")||"{}"); if(h&&h.back) return h.back; }catch(e){}
  return LECTURE;
}
const who=currentPlayer();
const $=id=>document.getElementById(id);
if(qs.get("back")) $("backDraw").href=qs.get("back");
$("backLecture").href=lectureHref();
if(who){ $("whoBar").hidden=false; $("whoBar").textContent=who+"　上场"; }

const START=[["银行存款",300000,0],["固定资产",80000,0],["短期借款",0,100000],["实收资本",0,200000]];
let rows=START.map(r=>[...r]);
let playing=false, done=false, tick=null, left=45, startedAt=0;

function fmt(n){ return Number(n||0).toLocaleString("zh-CN"); }
function render(){
  $("rows").innerHTML=rows.map((r,i)=>`
    <tr>
      <td><input value="${r[0]}" oninput="upd(${i},0,this.value)" placeholder="科目"></td>
      <td><input class="num" value="${r[1]||""}" oninput="upd(${i},1,this.value)"></td>
      <td><input class="num" value="${r[2]||""}" oninput="upd(${i},2,this.value)"></td>
      <td style="text-align:center"><button class="del" type="button" onclick="delRow(${i})">×</button></td>
    </tr>`).join("");
  calc();
}
function upd(i,f,v){
  if(f===0) rows[i][0]=v;
  else rows[i][f]=parseFloat(String(v).replace(/,/g,""))||0;
  calc();
}
function addRow(){ rows.push(["",0,0]); render(); }
function delRow(i){ rows.splice(i,1); if(!rows.length) rows=[["",0,0]]; render(); }
function sums(){
  let d=0,c=0; rows.forEach(r=>{ d+=Number(r[1]||0); c+=Number(r[2]||0); });
  return {d,c,diff:Math.round((d-c)*100)/100};
}
function calc(){
  const {d,c,diff}=sums();
  $("sumD").textContent=fmt(d); $("sumC").textContent=fmt(c);
  $("panL").textContent="借 "+fmt(d);
  $("panR").textContent="贷 "+fmt(c);
  const tilt=Math.max(-12, Math.min(12, diff/8000));
  $("beam").style.transform="rotate("+tilt+"deg)";
  const v=$("verdict");
  if(!d && !c){ v.className="verdict idle"; v.textContent="表是空的。"; $("hint").textContent=""; return; }
  if(diff===0){
    v.className="verdict ok";
    v.innerHTML="平了　借 "+fmt(d)+" ＝ 贷 "+fmt(c);
    $("hint").textContent=judgeFix()?"漏的那一笔补上了：贷方实收资本 8 万。":"平了。再看一眼是不是补在实收资本上。";
    if(playing && !done && judgeFix()) finish(false, true);
    return;
  }
  v.className="verdict no";
  v.innerHTML="不平　差 "+fmt(Math.abs(diff))+"　"+(diff>0?"借方多了":"贷方多了");
  $("hint").textContent="差额正好等于某一笔，多半是漏了对方那一条腿。";
}
function judgeFix(){
  const {diff}=sums(); if(diff!==0) return false;
  const qy=rows.filter(r=>String(r[0]||"").includes("实收资本"));
  const credit=qy.reduce((s,r)=>s+Number(r[2]||0),0);
  return credit>=280000;
}
function todayStr(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function saveScore(pts, extra){
  if(!who) return;
  let log=[];
  try{ log=JSON.parse(localStorage.getItem("draw-score-log")||"[]"); if(!Array.isArray(log)) log=[]; }catch(e){ log=[]; }
  const tm=new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  log.push({day:todayStr(), t:tm, name:who, pts, use:"上场·试算表", round:Date.now(), extra});
  localStorage.setItem("draw-score-log", JSON.stringify(log));
}
function finish(timeout, perfect){
  if(done) return; done=true; playing=false;
  if(tick){ clearInterval(tick); tick=null; }
  const {diff}=sums();
  const balanced = diff===0;
  const pts = (balanced && (perfect||judgeFix())) ? 5 : balanced ? 2 : 0;
  if(who) saveScore(pts, {balanced, fix:judgeFix()});
  const draw=qs.get("back")||DRAW;
  $("cut").classList.add("on");
  $("cutBox").innerHTML = (timeout?"时间到。<br>":"平了。<br>")
    + (pts===5?"漏的 8 万补在实收资本贷方了。": balanced?"表是平的，但漏的那一笔还没点名。":"还没平。")
    + "<br>这次 <b style='color:#7b1fa2'>"+pts+" 分</b>"+(who?"，已记到 "+who+"。":"。")
    + "<div style='margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap'>"
    + "<a class='go' href='"+draw+"'>换人再抽</a>"
    + "<button class='go' type='button' id='retry'>重做</button></div>"
    + "<div style='margin-top:8px;font-size:14px;color:#6d4c41'>补对漏账 5 分，只是凑平 2 分，没平 0 分。不要翻课件下一页。</div>";
  const rb=$("retry"); if(rb) rb.onclick=()=>{ location.href=location.pathname+location.search; };
}
function start(){
  $("gate").classList.remove("on");
  playing=true; done=false; left=45; startedAt=Date.now();
  rows=START.map(r=>[...r]); render();
  $("timer").hidden=false; $("timer").textContent=left; $("timer").className="timer";
  $("now").textContent="现在你：差 8 万。加一行或改数字，让天平平下来。";
  tick=setInterval(()=>{
    left--; $("timer").textContent=Math.max(0,left);
    if(left<=8) $("timer").classList.add("low");
    if(left<=0) finish(true, false);
  },1000);
}
$("btnStart").onclick=start;
render();
if(who){
  $("gate").classList.add("on");
  $("gateWho").textContent=who+"　上场找漏账";
  $("now").textContent="现在你：抽到的人点「开始」。";
}
</script>
</body>
</html>
