<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目一　上课投影（网页投影版）v1.17</title>
<style>
:root{
  --orange:#bf360c; --green:#2e7d32; --ink:#22170f;
  --gold:#f9a825; --brown:#3e2723; --paper:#fffdf8; --line:#ead9c6;
  --title:3rem; --body:2rem; --now:1.55rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#efe4d6;color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;}
body{display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--brown);color:#fff;flex-shrink:0}
.top h1{font-size:14px;font-weight:700}
.top small{opacity:.75;font-size:11px;margin-left:6px}
.top .hint{margin-left:auto;font-size:11px;opacity:.85}
.top button{border:0;background:#efebe9;color:var(--brown);font:inherit;font-weight:800;padding:6px 10px;border-radius:8px;cursor:pointer}
.top button.on{background:#ffcc80;color:var(--brown)}
.layout{display:grid;grid-template-columns:148px 1fr;flex:1;min-height:0}
body.wide .layout{grid-template-columns:1fr}
body.wide .side{display:none}
.side{background:#f7efe4;border-right:1px solid var(--line);overflow:auto;padding:6px 0}
.side input{width:calc(100% - 12px);margin:4px 6px 6px;padding:5px 7px;border:1px solid #e6d5c3;border-radius:6px;font:inherit;font-size:11px}
.nav-item{display:block;width:100%;text-align:left;padding:5px 8px;border:0;background:transparent;font:inherit;cursor:pointer;color:#5a4638;font-size:11px;line-height:1.25}
.nav-item:hover{background:#f8e8d8}
.nav-item.on{background:#bf360c;color:#fff}
.nav-item .k{display:inline-block;min-width:22px;opacity:.7;font-variant-numeric:tabular-nums}
.main{min-height:0;overflow-y:scroll;padding:8px 14px 8px;display:flex;justify-content:center;align-items:flex-start;scrollbar-gutter:stable}
.main::-webkit-scrollbar{width:14px}
.main::-webkit-scrollbar-track{background:#e8dccf;border-radius:8px}
.main::-webkit-scrollbar-thumb{background:#bf360c;border-radius:8px}
.card{width:min(1100px,100%);background:var(--paper);border-radius:14px;box-shadow:0 8px 28px rgba(62,39,35,.08);border:1px solid var(--line)}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.k-cover{background:#3e2723;color:#ffcc80}
.k-pause{background:#fff3e0;color:#bf360c;border:1px solid #ffcc80}
.k-pic{background:#e8f5e9;color:#2e7d32}
.k-setup{background:#eceff1;color:#455a64}
.k-homework{background:#fff8e1;color:#f57f17;border:1px solid #ffe082}
.k-teacher{background:#efebe9;color:#5d4037}
.k-game{background:#e3f2fd;color:#1565c0}
.k-thumbs{background:#fce4ec;color:#ad1457}
.k-text{background:#f5f5f5;color:#616161}
.k-spare{background:#eeeeee;color:#757575}
.k-drag{background:#e8f5e9;color:#1b5e20}
.go-draw{display:block;margin:10px 22px 14px;background:#bf360c;color:#fff;text-align:center;text-decoration:none;font-size:1.25rem;font-weight:800;padding:14px 16px;border-radius:12px}
.go-draw:hover{filter:brightness(1.08)}
.drag-board{padding:4px 22px 16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px;min-height:52px}
.chip{background:#bf360c;color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;cursor:grab;user-select:none;font-size:clamp(16px,2.2vw,22px);touch-action:none}
.chip.lock{background:#2e7d32;cursor:default}
.chip.hold{opacity:.35}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bin{min-height:110px;border:2px dashed #c4a882;border-radius:14px;padding:8px;background:#faf6f0}
.bin h4{font-size:clamp(16px,2vw,20px);margin:0 0 8px;color:#3e2723;text-align:center}
.bin.ok{border-color:#2e7d32;background:#e8f5e9;border-style:solid}
.bin.bad{border-color:#c62828;background:#ffebee}
.bin .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.drag-msg{text-align:center;font-weight:800;color:#2e7d32;font-size:1.1rem;min-height:1.4em;margin-top:8px}
.link-board{position:relative;margin:6px 12px 12px}
.link-who{text-align:center;font-weight:900;color:#bf360c;font-size:1.3rem;margin:4px 0 8px}
.lian-hud{display:flex;justify-content:center;align-items:center;gap:12px;margin:6px 0}
.lian-timer{width:96px;height:96px;border-radius:50%;border:8px solid #bf360c;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;background:#fff}
.lian-timer.low{border-color:#c62828;color:#c62828;background:#ffebee;animation:pulse .45s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.lian-cut{position:fixed;inset:0;background:rgba(28,8,6,.9);color:#fff;display:none;align-items:center;justify-content:center;z-index:40;font-size:clamp(32px,6vw,64px);font-weight:900;text-align:center}
.lian-cut.on{display:flex}
.link-grid{display:grid;grid-template-columns:minmax(120px,22%) 1fr minmax(120px,22%);gap:8px;align-items:stretch;min-height:300px}
.link-svg{width:100%;height:100%;min-height:300px}
.link-col{display:flex;flex-direction:column;gap:6px;justify-content:center}
.link-item{border:2px solid #d7c4b0;background:#fff;border-radius:10px;padding:6px 8px;font-weight:800;font-size:14px;text-align:center;cursor:pointer;color:#3e2723;line-height:1.25}
.link-item.on{border-color:#bf360c;background:#fff3e0;box-shadow:0 0 0 3px #ffcc80}
.link-item.lock{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;cursor:default}
.link-item.tied{border-color:#ef6c00;background:#fff8e1}
.link-item.bad{border-color:#c62828;background:#ffebee}
.link-col.right .link-item{background:#faf6f0}
.ghost-chip{position:fixed;z-index:40;pointer-events:none;background:#bf360c;color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.head{padding:12px 22px 4px}
.head h2{font-size:var(--title);line-height:1.25;color:var(--brown);cursor:zoom-in}
.body{padding:6px 22px 10px;font-size:var(--body);line-height:1.45;font-weight:650}
.body p{margin:0 0 10px;cursor:zoom-in}
.body .why{background:#fff8e1;border-left:6px solid var(--gold);padding:12px 14px;border-radius:0 8px 8px 0}
mark.kw{background:#fff176;color:#22170f;padding:0 .12em;border-radius:4px;font-weight:900}
.pics{padding:0 22px 4px;display:grid;gap:8px}
.pics.one{grid-template-columns:1fr}
.pics.many{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.pics img{width:auto;max-width:100%;max-height:34vh;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#faf6f0;cursor:zoom-in;display:block;margin:0 auto}
.pics.many img{max-height:18vh;width:100%}
.pic-hint{text-align:center;font-size:13px;color:#8d6e63;padding:0 22px 8px}
.lab{display:block;margin:8px 22px 12px;background:var(--orange);color:#fff;text-align:center;text-decoration:none;font-size:1.2rem;font-weight:800;padding:12px;border-radius:12px}
.dock{flex-shrink:0}
.now{background:var(--green);color:#fff;padding:8px 18px;font-size:var(--now);font-weight:800;line-height:1.35;cursor:zoom-in}
.bar{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#fff;border-top:1px solid var(--line)}
.bar button{border:0;background:var(--orange);color:#fff;font:inherit;font-weight:700;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.2}
.bar button.ghost{background:#efebe9;color:var(--brown)}
.bar .pg{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;color:#6d5648;font-size:13px}
.lb{position:fixed;inset:0;background:rgba(20,12,8,.9);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
.lb.show{display:flex}
.lb img{max-width:96vw;max-height:92vh;border-radius:8px}
.zoom-text{color:#fff;font-size:clamp(36px,6.5vw,84px);font-weight:900;line-height:1.35;text-align:center;max-width:92vw;text-shadow:0 2px 0 #000}
@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:block;position:fixed;inset:48px 0 100px 0;z-index:5;background:#fff8f0}
}


.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(1200px 600px at 10% -10%,#ffcc80 0%,transparent 55%),radial-gradient(900px 500px at 110% 110%,#81c784 0%,transparent 50%),#ead7c0}
.ambient .blob{position:absolute;border-radius:50%;filter:blur(28px);opacity:.7;animation:float 10s ease-in-out infinite}
.ambient .b1{width:50vw;height:50vw;left:-12vw;top:-18vh;background:#ff6d00}
.ambient .b2{width:44vw;height:44vw;right:-14vw;bottom:-12vh;background:#00c853;animation-delay:-4s}
.ambient .b3{width:32vw;height:32vw;left:38vw;top:38vh;background:#ff1744;opacity:.45;animation-delay:-7s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8%,-10%) scale(1.18)}}
.progress{position:fixed;top:0;left:0;right:0;height:10px;z-index:12;background:#3e2723}
.progress i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#ff1744 0 18px,#ffea00 18px 36px);box-shadow:0 0 16px #ff1744;transition:width .8s cubic-bezier(.16,1,.3,1)}
.page-flash{position:fixed;inset:0;z-index:11;pointer-events:none;background:#fff;opacity:0}
.page-flash.go{animation:flash .55s ease}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
.layout,.dock,.top{position:relative;z-index:2}
.card{overflow:visible;transform-origin:50% 50%;position:relative}
.card.enter-next{animation:inNext 1.05s cubic-bezier(.16,1,.3,1) both}
.card.enter-prev{animation:inPrev 1.05s cubic-bezier(.16,1,.3,1) both}
@keyframes inNext{0%{opacity:0;transform:translateX(22vw) rotate(2.5deg) scale(.9)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes inPrev{0%{opacity:0;transform:translateX(-22vw) rotate(-2.5deg) scale(.9)}60%{opacity:1}100%{opacity:1;transform:none}}
.card .head h2,.card .body p,.card .pics img,.card .go-draw,.card .why{
  animation:rise .85s cubic-bezier(.16,1,.3,1) both;
}
.card .head h2{animation-delay:.08s}
.card .body p{animation-delay:var(--d,.2s)}
.card .pics img{animation-delay:.28s}
.card .go-draw{animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(42px) scale(.96)}to{opacity:1;transform:none}}
.card.kind-cover{background:linear-gradient(165deg,#fff3e0,#fffdf8 40%,#ffe0b2);box-shadow:0 20px 60px rgba(191,54,12,.22)}
.card.kind-cover h2{letter-spacing:.06em;animation:coverSlam 1s cubic-bezier(.16,1,.3,1) both}
@keyframes coverSlam{0%{opacity:0;transform:scale(.6) rotate(-6deg)}70%{transform:scale(1.06) rotate(1deg)}100%{opacity:1;transform:none}}
.card.kind-cover .body p{font-size:1.08em}
.card.kind-pause{background:#fff8e1;border:8px solid #ff1744!important;box-shadow:0 0 0 8px #fffde7, 0 0 40px #ff1744}
.card.kind-pause::before{content:"";position:absolute;inset:-16px;border-radius:22px;border:8px solid #ff1744;animation:ring 1s ease-out infinite;pointer-events:none}
.card.kind-pause::after{content:"写！";position:absolute;right:18px;top:18px;background:#ff1744;color:#fff;font-weight:900;font-size:28px;padding:8px 16px;border-radius:12px;transform:rotate(12deg);box-shadow:4px 4px 0 #3e2723;animation:stamp 1.1s cubic-bezier(.16,1,.3,1) both}
@keyframes ring{0%{transform:scale(.96);opacity:1}100%{transform:scale(1.08);opacity:0}}
@keyframes stamp{0%{opacity:0;transform:scale(1.8) rotate(-20deg)}100%{opacity:1;transform:rotate(12deg)}}
.card.kind-pause .badge{background:#ff1744;color:#fff;font-size:16px;padding:6px 14px;animation:pulse .7s ease-in-out infinite}
.card.kind-pic .pics.one{overflow:hidden;border-radius:16px;margin:0 22px 8px;border:6px solid #3e2723;box-shadow:12px 12px 0 #bf360c}
.card.kind-pic .pics.one img{max-height:42vh;animation:rise .8s both, ken 8s ease-in-out .8s infinite alternate;border:0}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.12)}}
.card.kind-setup .body p:last-child{background:#fff176;border-left:10px solid #ff1744;padding:12px 14px;border-radius:0 12px 12px 0;font-size:1.05em}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);transform:translateX(-130%);animation:shine 1.6s ease .3s 1}
@keyframes shine{to{transform:translateX(130%)}}
.now{animation:nowIn .7s cubic-bezier(.16,1,.3,1) both;box-shadow:0 -8px 24px rgba(46,125,50,.35)}
@keyframes nowIn{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.step{position:relative;padding-left:.15em}
.go-draw{transition:transform .2s ease, filter .2s;box-shadow:0 8px 0 #7f0000}
.go-draw:hover{transform:translateY(-3px) scale(1.04)}
@media (prefers-reduced-motion: reduce){
  .ambient .blob,.card,.card .head h2,.card .body p,.card .pics img,.card .go-draw,.now,.progress i,.page-flash,.card.kind-pause::before,.card.kind-pause::after{animation:none!important;transition:none!important}
}

</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="progress" aria-hidden="true"><i id="prog"></i></div>
<div class="page-flash" id="flash"></div>
<header class="top">
  <button type="button" id="menuBtn">目录</button>
  <button type="button" id="fontBig" class="on">大字体</button>
  <button type="button" id="fontSmall">小字体</button>
  <h1>项目一　认识会计工作 <small>上课投影网页版 v1.17　2026-08-29</small></h1>
  <div class="hint">← → 翻页　点图或点字可放大</div>
</header>
<div class="layout">
  <aside class="side" id="side">
    <input id="q" placeholder="搜 科目 / 暂停" />
    <div id="nav"></div>
  </aside>
  <main class="main" id="main">
    <article class="card" id="card"></article>
  </main>
</div>
<div class="dock">
  <div class="now" id="nowbar"></div>
  <div class="bar">
    <button class="ghost" type="button" id="prev">上一页</button>
    <div class="pg" id="pg"></div>
    <button type="button" id="next">下一页</button>
  </div>
</div>
<div class="lb" id="lb"></div>
<script>
const SLIDES = [{"n": 1, "kind": "cover", "title": "项目二　会计工作准备", "body": ["记账之前，先把规矩定清楚。"], "now": "现在你：拿出记录册，翻到项目二。册子这堂课带着，下课带走，不用交。", "pics": [], "lab": false}, {"n": 2, "kind": "text", "title": "这堂课你怎么跟", "body": ["抽到你：把册子举起来，不用说一个字。\n\n写了 2 分，写好或愿意念 5 分，没写跳过。\n\n不用交。不用举手抢答。不用提醒老师加分。\n\n没抽到也把字留下。"], "now": "现在你：听老师。先别写。不用交。不用举手。", "pics": [], "lab": false}, {"n": 3, "kind": "text", "title": "今天先搞懂什么", "body": ["1. 记谁的账，不记谁的账。\n\n2. 钱没到手，这个月算不算。\n\n3. 纸条怎么分进抽屉——抽屉就是会计科目。\n\n4. 借和贷只是左边和右边，不是「我欠你」。\n\n5. 一笔业务动两个池子，两边要平。"], "now": "现在你：听老师。先别写。", "pics": [], "lab": false}, {"n": 4, "kind": "setup", "title": "先听一句　再看图", "body": ["宿舍有个公共钱罐。小新说「回头还」。缺的那笔，到底算谁的？", "看图时请盯住：\n钱罐是公共的；小新说的那句。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": [], "lab": false}, {"n": 5, "kind": "pic", "title": "宿舍的公共钱罐", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "02-00_上课投影_网页素材/01.jpg"}], "lab": false}, {"n": 6, "kind": "pause", "title": "项目二第1暂停点　请写 25 秒", "body": ["小新错在哪？\n\n他说「回头还」，那缺的三百二算谁的？\n\n写在自己册子上。"], "now": "现在你：拿出记录册，写在「项目二第1暂停点」。写完不用交、不用举手、不用喊老师加分。老师会抽三个人看册子；抽到你就把册子举起来。没抽到也把字留下。", "pics": [], "lab": false}, {"n": 7, "kind": "setup", "title": "先听一句　再看图", "body": ["店的钱和老板自己的钱，是两个罐子。混在一起，账就乱了。", "看图时请盯住：\n两个罐子分别写着什么。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": [], "lab": false}, {"n": 8, "kind": "pic", "title": "两个罐子", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "02-00_上课投影_网页素材/02.jpg"}], "lab": false}, {"n": 9, "kind": "pause", "title": "项目二第2暂停点　请写 20 秒", "body": ["如果王老板拿店里的钱给自己买了双鞋，\n\n这笔钱该记在店的账上吗？\n\n先表态，再写一句为什么。"], "now": "现在你：拿出记录册，写在「项目二第2暂停点」。写完不用交、不用举手、不用喊老师加分。老师会抽三个人看册子；抽到你就把册子举起来。没抽到也把字留下。", "pics": [], "lab": false}, {"n": 10, "kind": "setup", "title": "先听一句　再看图", "body": ["开店记账之前，先定四件事。下一张是四张小图，你来归纳。", "看图时请盯住：\n四件事分别是什么，用你自己的话。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": [], "lab": false}, {"n": 11, "kind": "pic", "title": "开店之前先定四件事", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "02-00_上课投影_网页素材/03.jpg"}], "lab": false}, {"n": 12, "kind": "pause", "title": "项目二第3暂停点　请写 30 秒", "body": ["看这四张图，开店记账之前要先定哪四件事？\n\n用你自己的话写。\n\n不要求术语。"], "now": "现在你：拿出记录册，写在「项目二第3暂停点」。写完不用交、不用举手、不用喊老师加分。老师会抽三个人看册子；抽到你就把册子举起来。没抽到也把字留下。", "pics": [], "lab": false}, {"n": 13, "kind": "pause", "title": "项目二第4暂停点　请写 20 秒", "body": ["如果一家店确定下个月就要关门，\n\n它的账要怎么变？举一个例子。\n\n想一个具体变化就行。"], "now": "现在你：拿出记录册，写在「项目二第4暂停点」。写完不用交、不用举手、不用喊老师加分。老师会抽三个人看册子；抽到你就把册子举起来。没抽到也把字留下。", "pics": [], "lab": false}, {"n": 14, "kind": "setup", "title": "先听一句　再看图", "body": ["货送了，钱还没收到。这个月算不算这笔收入？你先表态。", "看图时请盯住：\n货已经走了；钱还没进账。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": [], "lab": false}, {"n": 15, "kind": "pic", "title": "货送了，钱没收", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "02-00_上课投影_网页素材/04.jpg"}], "lab": false}, {"n": 16, "kind": "pause", "title": "项目二第5暂停点　请写 25 秒", "body": ["你觉得算不算？先表个态，再写一句理由。\n\n对错先不管，把态度写下。"], "now": "现在你：拿出记录册，写在「项目二第5暂停点」。写完不用交、不用举手、不用喊老师加分。老师会抽三个人看册子；抽到你就把册子举起来。没抽到也把字留下。", "pics": [], "lab": false}, {"n": 17, "kind": "setup", "title": "先听一句　再看图", "body": ["同一个月，两种算法，得数不一样。差在哪一笔？", "看图时请盯住：\n左右两种算法各算了什么。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": [], "lab": false}, {"n": 18, "kind": "pic", "title": "同一个月，两种算法", "body": [], "now": "现在你：看图，听老师配音。先别动笔。不用交。不用举手。", "pics": [{"src": "02-00_上课投影_网页素材/05.jpg"}], "lab": false}, {"n": 19, "kind": "pause", "title": "项目二第6暂停点　请写 25 秒", "body": ["这两种算法，差在哪一笔？为什么会差？"], "now": "现在你：拿出记录册，写在「项目二第6暂停点」。写完不用交、不用举手、不用喊老师加分。老师会抽三个人看册子；抽到你就把册子举起来。没抽到也把字留下。", "pics": [], "lab": false}, {"n": 20, "kind": "pause", "title": "加分题　项目二第7暂停点　请写 20 秒", "body": ["为什么企业不能用「收到钱才算」这种算法？\n\n想一个能被钻空子的例子。\n\n能想出「推迟收款让利润变小」「提前催款让利润变大」这类例子，抽到你算 5 分。"], "now": "现在你：拿出记录册，写在「项目二第7暂停点」。这题难一点，写对了抽到你算 5 分。不用自己提醒老师加分。不用交。不用举手（抽到再举册子）。", "pics": [], "lab": false}, {"n": 21, "kind": "setup", "title": "先听一句　再看图", "body": ["同一台机器，五个价。记账时用哪一个？", "看图时请盯住：\n五个价分别是什么意思。"], "now": "现在你：听老师把背景说完。先别写。下一张才是图。", "pics": [], "lab": false}, {"n": 22, "kind": "pic", " function currentPlayer(){

  }catch(e){}
  return new URLSearchParams(location.search).get("name")||"";

function todayStr(){

function saveLianScore(name, pts, ok, n){
  if(!name) return;
  let log=[];
  try{ log=JSON.parse(localStorage.getItem("draw-score-log")||"[]"); if(!Array.isArray(log)) log=[]; }catch(e){ log=[]; }
  const tm=new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  log.push({day:todayStr(), t:tm, name, pts, use:"上场·连线", round:Date.now(), ok, n});

let i = 0;
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function mark(s){
  let out = esc(s);
  KEYS.forEach(k=>{ out = out.split(esc(k)).join('<mark class="kw">'+esc(k)+'</mark>'); });
  return out;
}
function bodyHtml(blocks){
  let n=0;
  return blocks.map(b=>{
    const lines = b.split("\n").filter(x=>x.length);
    const cls = lines.some(x=>x.startsWith("为什么：")||x.startsWith("做什么：")) ? "why" : "";
    return `<div class="${cls}">` + lines.map(x=>{
      n++;
      const step=/^\d+[.、．]/.test(x)?" step":"";
      return `<p class="${step.trim()}" style="--d:${(0.08+n*0.07).toFixed(2)}s">${mark(x)}</p>`;
    }).join("") + `</div>`;
  }).join("");
}
function setFont(big){
  document.documentElement.style.setProperty("--title", big?"3rem":"2.2rem");
  document.documentElement.style.setProperty("--body", big?"2rem":"1.45rem");
  document.documentElement.style.setProperty("--now", big?"1.55rem":"1.25rem");
  $("fontBig").classList.toggle("on", big);
  $("fontSmall").classList.toggle("on", !big);
}

function bindLink(){
  const board=$("linkBoard"); if(!board) return;
  const startBtn=$("lianStart"); if(!startBtn) return;
  const who=currentPlayer();
  let pick=null, pairMap=new Map(), done=false, items=[], tick=null;
  function pt(el, svg){
    const br=svg.getBoundingClientRect(), r=el.getBoundingClientRect();
    return {x: r.left-br.left + (el.dataset.side==="L"?r.width:0), y: r.top-br.top + r.height/2};
  }
  function pairs(){ return [...pairMap.entries()].map(([L,R])=>({L,R})); }
  function paint(final){
    const svg=$("linkSvg"); if(!svg) return;
    const br=svg.getBoundingClientRect();
    svg.setAttribute("viewBox", "0 0 "+Math.max(1,br.width)+" "+Math.max(1,br.height));
    svg.innerHTML = pairs().map(p=>{
      const a=pt(p.L, svg), b=pt(p.R, svg);
      let color="#ef6c00";
      if(final){
        const item=items.find(x=>x.t===p.L.dataset.t);
        color=(item && item.a===p.R.dataset.bin)?"#2e7d32":"#c62828";
      }
      return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="4" stroke-linecap="round"/>`;
    }).join("");
  }
  function finish(timeout){
    if(done) return; done=true;
    if(tick){ clearInterval(tick); tick=null; }
    const doneBtn=$("lianDone"); if(doneBtn) doneBtn.style.display="none";
    board.querySelectorAll(".link-item").forEach(el=>{
      el.classList.remove("on","tied");
    });
    let ok=0;
    pairs().forEach(p=>{
      const item=items.find(x=>x.t===p.L.dataset.t);
      const good=item && item.a===p.R.dataset.bin;
      p.L.classList.add(good?"lock":"bad");
      p.R.classList.add(good?"lock":"bad");
      if(good) ok++;
    });
    paint(true);
    const n=items.length;
    const pts = ok===n ? 5 : ok>=Math.ceil(n*0.6) ? 2 : 0;
    if(who) saveLianScore(who, pts, ok, n);
    const cut=$("lianCut");
    if(timeout && cut){ cut.classList.add("on"); setTimeout(()=>cut.classList.remove("on"), 900); }
    const draw="../90_通用工具_全学期复用/90-B3_抽人抽组_上场_v1.26_20260829.html?use=lianxian";
    $("dragMsg").innerHTML = (timeout?"时间到。":"连完了。")
      + "对了 "+ok+" / "+n+" 条。"
      + "这次 <b style=\"color:#bf360c\">"+pts+" 分</b>"+(who?"，已记到 "+who+"。":"。")
      + "<div style=\"margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap\">"
      + "<a class=\"go-draw\" style=\"margin:0;display:inline-block;padding:10px 18px\" href=\""+draw+"\">换人再抽</a>"
      + "<button type=\"button\" class=\"go-draw\" id=\"lianRetry\" style=\"margin:0;display:inline-block;padding:10px 18px;border:0\">重做</button>"
      + "</div>"
      + "<div style=\"margin-top:8px;font-size:14px;color:#6d4c41\">全对 5 分，对六成以上 2 分，否则 0 分。不要翻下一页。</div>";
    const rb=$("lianRetry");
    if(rb) rb.onclick=e=>{ e.preventDefault(); e.stopPropagation(); location.hash="78"; location.reload(); };
  }
  startBtn.onclick=e=>{
    e.preventDefault(); e.stopPropagation();
    items=shuffle(POOL).slice(0,8);
    const left=shuffle(items).map(c=>`<button type="button" class="link-item" data-side="L" data-t="${esc(c.t)}">${esc(c.t)}</button>`).join("");
    const right=shuffle(BINS).map(b=>`<button type="button" class="link-item" data-side="R" data-bin="${esc(b)}">${esc(b)}</button>`).join("");
    $("lianPlay").style.display="block";
    $("lianPlay").innerHTML=`<div class="link-grid"><div class="link-col">${left}</div><svg class="link-svg" id="linkSvg"></svg><div class="link-col right">${right}</div></div>`;
    startBtn.style.display="none";
    const doneBtn=$("lianDone");
    if(doneBtn){ doneBtn.style.display="inline-block"; doneBtn.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation(); finish(false); }; }
    $("dragMsg").textContent="左边点一个科目，再点右边的词。每个科目只连一条。连错了再点一次可以改。";
    let leftSec=45;
    const timer=$("lianTimer");
    timer.textContent=leftSec; timer.className="lian-timer";
    tick=setInterval(()=>{
      leftSec--;
      timer.textContent=Math.max(0,leftSec);
      if(leftSec<=8) timer.classList.add("low");
      if(leftSec<=0) finish(true);
    },1000);
  };
  board.addEventListener("click", e=>{
    const it=e.target.closest(".link-item"); if(!it||done) return;
    e.stopPropagation();
    if(it.dataset.side==="L"){
      board.querySelectorAll('[data-side="L"]').forEach(x=>x.classList.remove("on"));
      it.classList.add("on"); pick=it; return;
    }
    if(!pick) return;
    pairMap.set(pick, it);
    pick.classList.remove("on");
    pick.classList.add("tied");
    pick=null;
    paint(false);
  });
  addEventListener("resize", ()=>paint(done));
}

  nb.style.display = nowTxt ? "block" : "none";
  $("pg").textContent = (i+1) + " / " + SLIDES.length;
  const prog=$("prog");
  if(prog) prog.style.width = ((i+1)/SLIDES.length*100).toFixed(2)+"%";
  const fl=$("flash");
  if(fl && dir){ fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go"); }
  renderNav();
  history.replaceState(null,"","#"+s.n);
  $("main").scrollTop = 0;
}
function go(n){
  const next=Math.max(0, Math.min(SLIDES.length-1, n));
  const dir = next>i ? "next" : next<i ? "prev" : "next";
  i = next;
  render(dir);
}
function zoomText(html){
  $("lb").innerHTML = `<div class="zoom-text">${html}</div>`;
  $("lb").classList.add("show");
}
$("prev").onclick = ()=>go(i-1);
$("next").onclick = ()=>go(i+1);
$("nav").onclick = e=>{ const b=e.target.closest("[data-i]"); if(b) go(+b.dataset.i); };
$("q").oninput = renderNav;
$("menuBtn").onclick = ()=>{
  if(window.innerWidth<=860) $("side").classList.toggle("open");
  else document.body.classList.toggle("wide");
};
$("fontBig").onclick = ()=>setFont(true);
$("fontSmall").onclick = ()=>setFont(false);
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ") { e.preventDefault(); go(i+1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp") { e.preventDefault(); go(i-1); }
  if(e.key==="Escape") $("lb").classList.remove("show");
});
$("card").addEventListener("click", e=>{
  if(e.target.closest(".link-board,.go-draw")) return;
  if(e.target.tagName==="IMG"){
    $("lb").innerHTML = `<img src="${e.target.src}" alt="">`;
    $("lb").classList.add("show");
    return;
  }
  const p = e.target.closest("p,h2");
  if(p) zoomText(p.innerHTML);
});
$("nowbar").addEventListener("click", e=>{ if(e.currentTarget.innerHTML) zoomText(e.currentTarget.innerHTML); });
$("lb").onclick = ()=> $("lb").classList.remove("show");
document.body.classList.add("wide");
setFont(true);
const hash = parseInt(location.hash.replace("#",""),10);
if(hash>=1 && hash<=SLIDES.length) i = hash-1;
render();
</script>
</body>
</html>
