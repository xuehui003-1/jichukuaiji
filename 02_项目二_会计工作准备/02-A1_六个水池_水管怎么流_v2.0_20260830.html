<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>六个水池　水管怎么流</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#cfd8dc;color:#263238;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
.top{background:#37474f;color:#fff;padding:8px 14px;font-weight:800}
.top small{opacity:.75;font-weight:600;margin-left:8px}
.wrap{flex:1;overflow:auto;padding:10px 14px 8px;max-width:1280px;width:100%;margin:0 auto}
.now{background:#2e7d32;color:#fff;padding:10px 16px;font-size:20px;font-weight:800;line-height:1.35}
.why{background:#fff8e1;border-top:4px solid #f9a825;padding:8px 16px;font-weight:700;color:#5d4037}
.biz{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0}
.bz{background:#fff;border:3px solid #90a4ae;border-radius:12px;padding:10px;cursor:pointer;font-weight:800}
.bz:hover{border-color:#0277bd}
.bz.on{border-color:#f9a825;background:#fff8e1;box-shadow:0 0 0 4px #ffe082}
.bz span{display:block;font-size:12px;color:#607d8b;font-weight:600;margin-top:4px}
.wall{background:#eceff1;border:8px solid #546e7a;border-radius:8px;padding:16px;box-shadow:inset 0 0 0 4px #90a4ae}
.rowlab{font-weight:900;color:#37474f;margin:8px 0}
.pools{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pool{text-align:center;position:relative}
.pname{font-weight:900;font-size:18px;margin-bottom:4px}
.psub{font-size:12px;color:#607d8b;min-height:16px}
.rack{display:flex;align-items:stretch;justify-content:center;gap:0;margin-top:6px}
.inlet,.outlet{width:28px;align-self:center;height:22px;border-radius:11px;position:relative}
.inlet{background:linear-gradient(#a5d6a7,#2e7d32);border:3px solid #1b5e20;margin-right:-2px}
.outlet{background:linear-gradient(#ffcc80,#ef6c00);border:3px solid #e65100;margin-left:-2px}
.inlet::before,.outlet::before{content:"";position:absolute;inset:4px;border-radius:8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.0) 0 8px,rgba(255,255,255,.35) 8px 12px);background-size:20px 100%}
.pool.hit .inlet.act,.pool.hit .inlet#dummy{ }
.pipe.L.act,.inlet.act{box-shadow:0 0 0 4px #fff,0 0 18px #00c853;animation:gush .5s linear infinite}
.pipe.R.act,.outlet.act{box-shadow:0 0 0 4px #fff,0 0 18px #ff6d00;animation:gush .5s linear infinite}
@keyframes gush{50%{filter:brightness(1.3)}}
.tank{width:120px;height:130px;margin:0 auto;background:linear-gradient(#b0bec5,#78909c);border:4px solid #37474f;border-radius:12px 12px 18px 18px;position:relative;overflow:hidden;box-shadow:inset 0 8px 0 rgba(255,255,255,.25), 6px 8px 0 #455a64}
.tank::before{content:"";position:absolute;left:10%;right:10%;top:8px;height:10px;background:#455a64;border-radius:6px;z-index:2}
.water{position:absolute;bottom:0;left:0;right:0;height:0;background:linear-gradient(#4fc3f7,#0277bd);transition:height .7s}
.water.up{background:linear-gradient(#66bb6a,#1b5e20)}
.water.down{background:linear-gradient(#ffb74d,#e65100)}
.amt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 #000;z-index:2}
.flow{position:absolute;top:40%;font-size:22px;opacity:0;z-index:4}
.flow.L{left:-18px}.flow.R{right:-18px}
@keyframes fin{0%{opacity:0;transform:translateX(-16px)}40%{opacity:1}100%{opacity:0;transform:translateX(12px)}}
@keyframes fout{0%{opacity:0;transform:translateX(16px)}40%{opacity:1}100%{opacity:0;transform:translateX(-12px)}}
.flow.goL{animation:fin .9s ease}
.flow.goR{animation:fout .9s ease}
.pipes{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;font-weight:900}
.pipe{padding:3px 8px;border-radius:8px;opacity:.4}
.pipe.L{background:#c8e6c9;color:#1b5e20}
.pipe.R{background:#ffe0b2;color:#e65100}
.pipe.act{opacity:1;transform:scale(1.08)}
.pool.hit .tank{box-shadow:inset 0 8px 0 rgba(255,255,255,.25), 0 0 0 4px #ffea00, 6px 8px 0 #455a64}
.entry{background:#263238;color:#c8e6c9;border-radius:12px;padding:12px;font-weight:800;min-height:70px}
.entry .cr{color:#ffcc80;padding-left:2em}
.ph{color:#90a4ae}
.bal{margin-top:8px;padding:10px;border-radius:10px;text-align:center;font-weight:900}
.bal.ok{background:#c8e6c9;color:#1b5e20}
.bal.no{background:#ffcdd2;color:#b71c1c}
.quiz{background:#fff8e1;border:4px solid #f9a825;border-radius:12px;padding:12px;margin:8px 0;display:none}
.opt{display:inline-block;margin:6px 8px 0 0;padding:8px 14px;background:#fff;border:3px solid #90a4ae;border-radius:10px;cursor:pointer;font-weight:800}
.opt.right{border-color:#2e7d32;background:#c8e6c9}
.opt.wrong{border-color:#c62828;background:#ffcdd2}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:#0277bd;color:#fff}
button.o{background:#546e7a}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-weight:800;margin:8px 0}
.legend b{display:inline-block;width:36px;height:14px;border-radius:7px;vertical-align:middle;margin-right:6px}
@media(max-width:800px){.pools{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">六个水池　水管怎么流 <small>进水的管子在左边＝借　出水的管子在右边＝贷</small></div>
<div class="wrap">
  <div class="legend">
    <span><b style="background:#2e7d32"></b>左边绿管子进水＝借</span>
    <span><b style="background:#ef6c00"></b>右边橙管子出水＝贷</span>
  </div>
  <div class="biz" id="bizList"></div>
  <div class="quiz" id="quizBox">
    <h4 id="qTitle">先想一想</h4>
    <p id="qText"></p>
    <div id="qOpts"></div>
    <div id="qFb"></div>
  </div>
  <div class="wall">
    <div class="rowlab">上面三个池子：店里现在有什么、欠什么、老板的本钱</div>
    <div class="pools" id="rowA"></div>
    <div class="rowlab">下面三个池子：这个月进了什么、花了什么、剩下什么</div>
    <div class="pools" id="rowB"></div>
  </div>
  <p style="margin:10px 0"><button class="o" type="button" id="btnReplay" disabled>再看一次水流</button>
    <button class="o" type="button" onclick="clearAll()">把水放空</button>
    <label style="margin-left:10px;font-weight:800"><input type="checkbox" id="quizMode"> 先问再放水</label></p>
  <div class="entry" id="entry"><span class="ph">点上面一笔事，这里写出借和贷</span></div>
  <div id="balBox"></div>
  <div id="explain" style="margin-top:8px;font-weight:700;line-height:1.5"></div>
</div>
<div class="why">为什么：水不会凭空出现。从一个池子进、从另一个池子出，两边一样多。这就是有借必有贷。</div>
<div class="now" id="now">现在你：点上面一笔店里的事。看绿管子进、橙管子出。看完能说出：进是借，出是贷。</div>
<script>
const POOLS=[
 {k:'zc',n:'资产',s:'现金、设备、原料',row:'A'},
 {k:'fz',n:'负债',s:'欠银行、欠供货商',row:'A'},
 {k:'qy',n:'所有者权益',s:'老板自己投的',row:'A'},
 {k:'sr',n:'收入',s:'卖东西收到的',row:'B'},
 {k:'fy',n:'费用',s:'花出去的',row:'B'},
 {k:'lr',n:'利润',s:'收入减费用',row:'B'},
];
const BIZ=[
 {t:'老板投入20万开店',d:'钱进了公司账户',
  legs:[{p:'zc',sub:'银行存款',dir:'L',amt:200000},{p:'qy',sub:'实收资本',dir:'R',amt:200000}],
  why:'钱进了资产池，走左边绿管子（借）。这钱是老板的，来路走所有者权益右边橙管子（贷）。',
  q:'老板往公司账户打了20万。资产池的水是多了还是少了？',
  opts:['多了，记借方','少了，记贷方'],ans:0,
  qfb:'对。钱进了池子＝水变多＝走左边那根管＝记借方。'},
 {t:'买奶茶机 8万',d:'从账上直接划走',
  legs:[{p:'zc',sub:'固定资产',dir:'L',amt:80000},{p:'zc',sub:'银行存款',dir:'R',amt:80000}],
  why:'机器多了（进），存款少了（出）。都在资产这个池子里，一进一出，池子总量没变。',
  q:'花8万买机器。这笔业务动了几个池子？',
  opts:['一个池子，进出各一次','两个不同的池子'],ans:0,
  qfb:'对。机器和存款都属于资产，是同一个池子的一进一出。'},
 {t:'向银行借款 10万',d:'钱到账，但要还',
  legs:[{p:'zc',sub:'银行存款',dir:'L',amt:100000},{p:'fz',sub:'短期借款',dir:'R',amt:100000}],
  why:'存款多了，走绿管子。钱从银行来，负债池走橙管子。来路一律在右边。',
  q:'跟银行借10万。负债变多了，记在哪一边？',
  opts:['左边（借）','右边（贷）'],ans:1,
  qfb:'对。负债是钱从哪来的，来路一律记右边。'},
 {t:'赊购原料 3万',d:'货到了，钱下月付',
  legs:[{p:'zc',sub:'原材料',dir:'L',amt:30000},{p:'fz',sub:'应付账款',dir:'R',amt:30000}],
  why:'原料进来了（绿管子）。一分钱没掏，欠供货商（橙管子）。钱没动，账动了。',
  q:'一分钱没掏就把货拉回来了。这笔要不要记账？',
  opts:['不用，没花钱','要记，欠着也是账'],ans:1,
  qfb:'对。货已经进来，债也欠上了。'},
 {t:'归还供货商 1万',d:'从账上付出去',
  legs:[{p:'fz',sub:'应付账款',dir:'L',amt:10000},{p:'zc',sub:'银行存款',dir:'R',amt:10000}],
  why:'欠的债少了，走绿管子。存款少了，走橙管子。',
  q:'还钱给供货商。负债减少了，记哪边？',
  opts:['左边（借）','右边（贷）'],ans:0,
  qfb:'对。增加记右边，减少就记左边。'},
 {t:'卖奶茶收现 5000',d:'当场收到钱',
  legs:[{p:'zc',sub:'库存现金',dir:'L',amt:5000},{p:'sr',sub:'主营业务收入',dir:'R',amt:5000}],
  why:'现金进来（绿）。钱从卖东西来，收入走橙管子。',
  q:'卖奶茶收到5000现金。收入记在哪一边？',
  opts:['左边（借）','右边（贷）'],ans:1,
  qfb:'对。收入是钱的来路，走右边。'},
 {t:'赊销给公司 2000',d:'货送了，钱月底结',
  legs:[{p:'zc',sub:'应收账款',dir:'L',amt:2000},{p:'sr',sub:'主营业务收入',dir:'R',amt:2000}],
  why:'货送了就算这个月的收入。对方欠我们的，也是资产，走绿管子。',
  q:'货送了，钱一分没收。算不算这个月的收入？',
  opts:['不算，钱没到手','算，货已经送了'],ans:1,
  qfb:'对。看货送没送，不看钱收没收。'},
 {t:'付本月电费 800',d:'当场付现',
  legs:[{p:'fy',sub:'销售费用',dir:'L',amt:800},{p:'zc',sub:'银行存款',dir:'R',amt:800}],
  why:'费用增加走绿管子。存款少了走橙管子。',
  q:'付了800电费。费用变多了，记在哪一边？',
  opts:['左边（借）','右边（贷）'],ans:0,
  qfb:'对。费用是钱的去处，去处记左边。'},
 {t:'发工资 2400',d:'月底发放',
  legs:[{p:'fy',sub:'管理费用',dir:'L',amt:2400},{p:'zc',sub:'银行存款',dir:'R',amt:2400}],
  why:'和电费同一套路：费用进、存款出。',
  q:'发工资2400。和上一笔电费，套路一样吗？',
  opts:['一样','不一样'],ans:0,
  qfb:'对。花钱就是费用增加记借、存款减少记贷。'},
 {t:'收回客户欠款 2000',d:'之前赊销的钱到账了',
  legs:[{p:'zc',sub:'银行存款',dir:'L',amt:2000},{p:'zc',sub:'应收账款',dir:'R',amt:2000}],
  why:'存款多了，欠我们的少了。收入在送货那天已经记过，这里不再记收入。',
  q:'收回之前赊销的2000。这笔要不要再记一次收入？',
  opts:['要，钱到手了','不要，赊销时已经记过'],ans:1,
  qfb:'对。收入只记一次，就在货送出去那天。'},
 {t:'老板拿走 5000 自用',d:'不是公司的开销',
  legs:[{p:'qy',sub:'利润分配',dir:'L',amt:5000},{p:'zc',sub:'银行存款',dir:'R',amt:5000}],
  why:'存款少了。这不是店的费用，是老板拿走自己的钱。',
  q:'老板从店里拿5000给自己买鞋。这算店的费用吗？',
  opts:['算，钱从店里出的','不算，是老板拿走自己的钱'],ans:1,
  qfb:'对。店是店，老板是老板。'},
 {t:'结转本月利润',d:'收入减费用',
  legs:[{p:'sr',sub:'主营业务收入',dir:'L',amt:7000},{p:'fy',sub:'费用合计',dir:'R',amt:3200},{p:'lr',sub:'本年利润',dir:'R',amt:3800}],
  why:'收入7000减费用3200，剩下3800倒进利润池。三条腿，两边还是一样多。',
  q:'收入7000，费用3200。利润多少？',
  opts:['3800','10200'],ans:0,
  qfb:'对。7000减3200等于3800。'}
];
let cur=null, done=0, right=0, answered=false;
const $=i=>document.getElementById(i);
const state={}; POOLS.forEach(p=>state[p.k]={v:0});
function buildPools(){
  ['A','B'].forEach(row=>{
    $(row==='A'?'rowA':'rowB').innerHTML=POOLS.filter(p=>p.row===row).map(p=>`
      <div class="pool" id="pool-${p.k}">
        <div class="pname">${p.n}</div>
        <div class="psub">${p.s}</div>
        <div class="rack">
          <div class="inlet" id="pl-${p.k}"></div>
          <div class="tank">
            <div class="water" id="w-${p.k}" style="height:0%"></div>
            <div class="amt" id="a-${p.k}"></div>
            <div class="flow L" id="fl-${p.k}">💧</div>
            <div class="flow R" id="fr-${p.k}">💧</div>
          </div>
          <div class="outlet" id="pr-${p.k}"></div>
        </div>
        <div class="pipes">
          <span class="pipe L" id="labL-${p.k}">借·进</span>
          <span class="pipe R" id="labR-${p.k}">贷·出</span>
        </div>
      </div>`).join('');
  });
}
function buildBiz(){
  $('bizList').innerHTML=BIZ.map((b,i)=>
    `<div class="bz" id="bz-${i}" onclick="pick(${i})"><b>${i+1}. ${b.t}</b><span>${b.d}</span></div>`).join('');
}
function clearAll(){
  POOLS.forEach(p=>{state[p.k].v=0;
    $('w-'+p.k).style.height='0%'; $('a-'+p.k).textContent='';
    $('pool-'+p.k).classList.remove('hit');
    $('pl-'+p.k).classList.remove('act'); $('pr-'+p.k).classList.remove('act');
  });
  $('entry').innerHTML='<span class="ph">点上面一笔事，这里写出借和贷</span>';
  $('balBox').innerHTML=''; $('explain').innerHTML='';
  document.querySelectorAll('.bz').forEach(e=>e.classList.remove('on'));
  cur=null; $('btnReplay').disabled=true;
  $('quizBox').style.display='none';
  $('now').textContent='现在你：点上面一笔店里的事。看绿管子进、橙管子出。';
}
function pick(i){
  cur=i; answered=false;
  document.querySelectorAll('.bz').forEach(e=>e.classList.remove('on'));
  $('bz-'+i).classList.add('on');
  $('btnReplay').disabled=false;
  if($('quizMode').checked){ showQuiz(i); }
  else { $('quizBox').style.display='none'; run(i); }
}
function showQuiz(i){
  const b=BIZ[i];
  $('quizBox').style.display='block';
  $('qTitle').textContent='先想一想（别急着看水）';
  $('qText').textContent=b.q;
  $('qOpts').innerHTML=b.opts.map((o,k)=>
    `<div class="opt" id="opt-${k}" onclick="answer(${i},${k})">${o}</div>`).join('');
  $('qFb').innerHTML='';
  POOLS.forEach(p=>{state[p.k].v=0;$('w-'+p.k).style.height='0%';$('a-'+p.k).textContent='';
    $('pool-'+p.k).classList.remove('hit');
    $('pl-'+p.k).classList.remove('act');$('pr-'+p.k).classList.remove('act');});
  $('entry').innerHTML='<span class="ph">答完上面那题，水才流</span>';
  $('now').textContent='现在你：先点一个答案，再看水管。';
}
function answer(i,k){
  if(answered)return; answered=true;
  const b=BIZ[i], ok=(k===b.ans);
  $('opt-'+k).classList.add(ok?'right':'wrong');
  if(!ok) $('opt-'+b.ans).classList.add('right');
  $('qFb').innerHTML=(ok?'对了。 ':'先看对的那个。 ')+b.qfb;
  setTimeout(()=>run(i),800);
}
function run(i){
  const b=BIZ[i];
  POOLS.forEach(p=>{$('pool-'+p.k).classList.remove('hit');
    $('pl-'+p.k).classList.remove('act');$('pr-'+p.k).classList.remove('act');});
  $('now').textContent='现在你：看绿管子和橙管子。进是借，出是贷。';
  b.legs.forEach((leg,n)=>{
    setTimeout(()=>{
      const k=leg.p, isL=(leg.dir==='L');
      $('pool-'+k).classList.add('hit');
      $(isL?'pl-'+k:'pr-'+k).classList.add('act');
      const f=$(isL?'fl-'+k:'fr-'+k);
      f.classList.remove('goL','goR'); void f.offsetWidth;
      f.classList.add(isL?'goL':'goR');
      state[k].v += isL? leg.amt : -leg.amt;
      const w=$('w-'+k);
      const pct=Math.min(92,Math.max(8,Math.abs(state[k].v)/2500));
      w.style.height=pct+'%';
      w.className='water '+(isL?'up':'down');
      $('a-'+k).textContent=fmt(Math.abs(state[k].v));
    },n*800);
  });
  setTimeout(()=>showEntry(i),b.legs.length*800+200);
}
function fmt(n){ return n>=10000? (n/10000)+'万' : n.toLocaleString(); }
function showEntry(i){
  const b=BIZ[i];
  const dr=b.legs.filter(l=>l.dir==='L'), cr=b.legs.filter(l=>l.dir==='R');
  let h='';
  dr.forEach(l=>h+=`<div>借：${l.sub}　${l.amt.toLocaleString()}</div>`);
  cr.forEach(l=>h+=`<div class="cr">贷：${l.sub}　${l.amt.toLocaleString()}</div>`);
  $('entry').innerHTML=h;
  const sd=dr.reduce((a,l)=>a+l.amt,0), sc=cr.reduce((a,l)=>a+l.amt,0);
  $('balBox').innerHTML=`<div class="bal ${sd===sc?'ok':'no'}">左边进 ${sd.toLocaleString()}　${sd===sc?'=':'≠'}　右边出 ${sc.toLocaleString()}　${sd===sc?'平了':'不平'}</div>`;
  $('explain').innerHTML=b.why;
  $('now').textContent='现在你：能说出进是借、出是贷，就点下一笔。';
}
function replay(){ if(cur!==null){
  POOLS.forEach(p=>{state[p.k].v=0;$('w-'+p.k).style.height='0%';$('a-'+p.k).textContent='';});
  run(cur);
}}
$('btnReplay').onclick=replay;
buildPools(); buildBiz();
</script>
</body>
</html>
