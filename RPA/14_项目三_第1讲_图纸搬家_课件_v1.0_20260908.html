<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图纸搬家 · 项目三第1讲 · 财务机器人应用与开发</title>
<style>
:root{
  --bg:#FFF9F0; --card:#FFFFFF; --text:#2B211B; --muted:#79695e;
  --primary:#E97835; --primary-dark:#C25A1F; --primary-soft:#F5B583; --line:#EADFD0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#241D17;display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;}
#stage{position:relative;width:100vw;height:100vh;background:var(--bg);overflow:hidden}
.slide{position:absolute;inset:0;padding:44px 84px 84px;display:none;flex-direction:column;overflow-y:auto}
.slide::before{content:"";margin-top:auto}
.slide::after{content:"";margin-bottom:auto}
.slide.active{display:flex}
.eyebrow{font-size:22px;letter-spacing:.3em;color:var(--primary);font-weight:700;margin-bottom:14px}
h1{font-size:52px;color:var(--text);line-height:1.25;margin-bottom:20px;font-weight:800}
h1 .accent{color:var(--primary)}
.sub{font-size:24px;color:var(--muted);margin-bottom:20px;line-height:1.55}
ul.items{list-style:none}
ul.items li{font-size:28px;color:var(--text);line-height:1.5;padding:8px 0;
  border-bottom:1px dashed var(--line)}
ul.items li:last-child{border-bottom:none}
ul.items li b{color:var(--primary-dark)}
.cards{display:flex;gap:30px;margin-top:8px}
.card{flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:28px 32px}
.card h2{font-size:29px;margin-bottom:14px;color:var(--primary-dark)}
.card li{font-size:22px;color:var(--text);line-height:1.7;list-style:none;padding:5px 0}
.steps{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.step{display:flex;align-items:center;gap:18px;background:var(--card);border:2px solid var(--line);
  border-radius:16px;padding:14px 24px}
.step .n{flex:0 0 56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;
  font-size:29px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step .t{font-size:26px;color:var(--text);line-height:1.5}
.step .t b{color:var(--primary-dark)}
.flow{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 18px}
.flow span{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 18px;
  font-size:23px;color:var(--text)}
.flow span b{color:var(--primary-dark)}
/* 思维模板 正常→万一→应该 */
.tpl{display:flex;flex-direction:column;gap:10px;margin:10px 0 16px}
.tpl .row{display:flex;align-items:center;gap:16px;font-size:26px;background:var(--card);
  border:2px solid var(--line);border-radius:14px;padding:12px 22px}
.tpl .tag{flex:0 0 90px;text-align:center;font-weight:800;color:#fff;border-radius:10px;padding:6px 0}
.tpl .tag.ok{background:var(--primary-dark)}
.tpl .tag.if{background:var(--primary)}
.tpl .tag.do{background:var(--primary-soft)}
.tpl .t b{color:var(--primary-dark)}
.big{font-size:58px;text-align:center;line-height:1.4;color:var(--text);font-weight:800}
.big .accent{color:var(--primary)}
.emoji-row{text-align:center;font-size:70px;letter-spacing:16px;margin-bottom:28px}
.cover h1{font-size:70px}
.cover .sub{font-size:29px}
.meta{position:absolute;left:96px;bottom:34px;font-size:19px;color:var(--muted)}
/* 暂停点 */
.slide.pause{background:var(--primary);color:#fff}
.pause .eyebrow{color:#FFE8D6}
.pause h1{color:#fff;font-size:54px}
.pause .sub{color:#FFE8D6;font-size:28px}
.pause .where{margin-top:26px;font-size:24px;background:rgba(255,255,255,.18);
  border-radius:14px;padding:12px 24px;display:inline-block;align-self:flex-start}
/* 抽人页不再单独配色（普通页＋角标） */
/* 意外卡 */
.slide.challenge{background:var(--bg)}
.challenge h1{font-size:48px}
.challenge .cardtitle{font-size:25px;font-weight:800;color:#fff;background:var(--primary);
  display:inline-block;padding:9px 26px;border-radius:999px;margin-bottom:16px;align-self:flex-start}
/* 任务卡 */
.task-card{background:var(--card);border:3px solid var(--primary);border-radius:20px;
  padding:30px 40px;max-width:1040px}
.task-card h2{font-size:32px;color:var(--primary-dark);margin-bottom:14px}
.task-card li{font-size:23px;color:var(--text);line-height:1.7;list-style:none}
.task-card li::before{content:"▶ ";color:var(--primary);font-size:18px}
/* 评分表 */
.rubric{display:flex;gap:14px;margin-top:14px}
.rubric .r{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:14px 16px;text-align:center}
.rubric .r .p{font-size:32px;font-weight:800;color:var(--primary-dark)}
.rubric .r .d{font-size:19px;color:var(--text);margin-top:4px;line-height:1.4}
/* 角标：只有两种——橙底=📒暂停点；白底橙字描边=其他所有课堂动作 */
.badges{position:absolute;top:20px;right:28px;display:flex;gap:10px;z-index:5}
.badge{padding:8px 20px;border-radius:999px;font-size:21px;font-weight:700;white-space:nowrap;
  background:#fff;border:2.5px solid var(--primary);color:var(--primary-dark)}
.badge.note,.badge.solid-note,.badge.outline.note{background:var(--primary);color:#fff}
/* 结束页 */
.slide.end{background:#2B211B;color:#FFF9F0;align-items:center;text-align:center}
.end h1{color:#FFF9F0;font-size:60px}
.end .sub{color:#D8CFC2;font-size:28px;line-height:1.7}
/* HUD */
#hud{position:absolute;left:0;right:0;bottom:0;height:56px;background:rgba(43,33,27,.92);
  display:flex;align-items:center;gap:14px;padding:0 22px;color:#FFF9F0;font-size:19px}
#hud button{background:none;border:1.5px solid rgba(255,249,240,.4);color:#FFF9F0;
  font-size:20px;padding:6px 16px;border-radius:10px;cursor:pointer}
#hud button:hover{background:var(--primary);border-color:var(--primary)}
#counter{margin-left:auto}
#bar{position:absolute;left:0;bottom:56px;height:5px;background:var(--primary);width:0;
  transition:width .25s}
#notes{position:absolute;left:0;right:0;bottom:56px;background:rgba(255,249,240,.97);
  border-top:3px solid var(--primary);padding:16px 96px;display:none;font-size:21px;color:var(--text)}
#notes b{color:var(--primary-dark)}
#notes.show{display:block}

/* ===== v2.1 配色对齐基础会计投影 + 大字号 + 全局缩放（A+/A− 或 +/− 键） ===== */
:root{
  --bg:#FFF8E1; --card:#FFFFFF; --text:#212121; --muted:#5D4037;
  --primary:#BF360C; --primary-dark:#BF360C; --primary-soft:#FFCC80;
  --line:#E0D5C3; --green:#2E7D32; --z:1;
}
body{font-family:"微软雅黑","Microsoft YaHei","PingFang SC",sans-serif}
.eyebrow{font-size:calc(20px*var(--z));letter-spacing:.24em;color:var(--primary);font-weight:700;margin-bottom:12px}
h1{font-size:calc(50px*var(--z));line-height:1.22;margin-bottom:16px}
h1 .accent{color:var(--primary)}
.sub{font-size:calc(26px*var(--z));color:var(--muted);margin-bottom:14px;line-height:1.5}
ul.items li{font-size:calc(28px*var(--z));line-height:1.5;padding:8px 0}
ul.items li b{color:var(--primary)}
.card h2{font-size:calc(30px*var(--z));margin-bottom:10px}
.card li{font-size:calc(25px*var(--z));line-height:1.6}
.steps{gap:12px}
.step .t{font-size:calc(27px*var(--z));line-height:1.5}
.step .n{font-size:calc(30px*var(--z))}
.flow span{font-size:calc(25px*var(--z))}
.task-card{border-width:2.5px}
.task-card h2{font-size:calc(32px*var(--z));margin-bottom:12px}
.task-card li{font-size:calc(25px*var(--z));line-height:1.7}
.pause h1{font-size:calc(52px*var(--z))}
.pause .sub{font-size:calc(28px*var(--z));color:#FFE9D2}
.pause .where{font-size:calc(24px*var(--z))}
.end h1{font-size:calc(48px*var(--z))}
.end .sub{font-size:calc(26px*var(--z))}
.cover h1{font-size:calc(62px*var(--z))}
.cover .sub{font-size:calc(27px*var(--z))}
.big{font-size:calc(54px*var(--z))}
.meta{font-size:18px}
.stu{color:var(--green);font-weight:700}
.rawline{font-family:Consolas,"Courier New",monospace;font-size:calc(27px*var(--z));background:#fff;
  border:3px dashed var(--primary);border-radius:12px;padding:14px 18px;text-align:center;color:var(--text)}
.cmdline{font-size:calc(26px*var(--z));background:#fff;border:3px solid var(--primary);border-radius:12px;
  padding:12px 18px;text-align:center;font-weight:700;color:var(--text)}
.pic{display:block;margin:6px auto 2px;max-height:33vh;max-width:86%;border-radius:18px;
  border:3px solid var(--line);box-shadow:0 6px 18px rgba(93,64,55,.12)}
.duo{display:flex;gap:16px;align-items:flex-start;justify-content:center}
.duo .pic{max-height:29vh;max-width:46%;margin:4px 0}
.rv{display:none}
.rvshow{display:block;animation:rvin .3s ease}
@keyframes rvin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anscard{background:#fff;border:3px solid var(--green);border-radius:14px;padding:10px 20px;
  margin-top:10px;font-size:calc(24px*var(--z));line-height:1.65}
.anscard b{color:var(--green)}
</style>
</head>
<body>
<div id="stage">
  <div id="deck"></div>
  <div id="bar"></div>
  <div id="notes"></div>

const deck = document.getElementById("deck");
const notesEl = document.getElementById("notes");
const bar = document.getElementById("bar");
const counter = document.getElementById("counter");
let cur = 0;

SLIDES.forEach((s) => {
  const el = document.createElement("section");
  el.className = "slide " + (s.cls || "");
  el.innerHTML = s.html;
  if (s.badges && s.badges.length) {
    const wrap = document.createElement("div");
    wrap.className = "badges";
    s.badges.forEach((bd) => {
      const b = document.createElement("div");
      b.className = "badge " + bd.type;
      b.textContent = bd.text;
      wrap.appendChild(b);
    });
    el.appendChild(wrap);
  }
  deck.appendChild(el);
});
const slides = deck.querySelectorAll(".slide");

function show(i) {
  cur = (i + SLIDES.length) % SLIDES.length;
  slides.forEach((el, k) => el.classList.toggle("active", k === cur));
  counter.textContent = (cur + 1) + " / " + SLIDES.length;
  bar.style.width = ((cur + 1) / SLIDES.length * 100) + "%";
  notesEl.innerHTML = "<b>📝 教师提示：</b>" + (SLIDES[cur].notes || "");
  if (window.resetRv) resetRv(i); /* 换页后按当前页同步揭晓提示条（必须在 cur 更新之后） */
}
show(0);


document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
document.getElementById("stage").addEventListener("click", (e) => {
  if (e.target.closest("#hud") || e.target.closest("#notes")) return;
  show(cur + 1);
});
document.getElementById("notesBtn").onclick = () => notesEl.classList.toggle("show");
document.getElementById("fsBtn").onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); show(cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(cur - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(SLIDES.length - 1);
  else if (e.key === "n" || e.key === "N") notesEl.classList.toggle("show");
  else if (e.key === "f" || e.key === "F") document.getElementById("fsBtn").click();
});
let tx = 0;
window.addEventListener("touchstart", (e) => tx = e.touches[0].clientX);
window.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 60) show(cur + (dx < 0 ? 1 : -1));
});
</script>
<script>
(function(){
  function base(){ return Math.max(0.55, Math.min(2.4, window.innerWidth/1280)); }
  var uz = 1;
  function set(){ document.documentElement.style.setProperty("--z", (base()*uz).toFixed(3)); }
  var zin = document.getElementById("zin"), zout = document.getElementById("zout");
  if (zin) zin.onclick = function(){ uz = Math.min(2, Math.round((uz+0.1)*10)/10); set(); };
  if (zout) zout.onclick = function(){ uz = Math.max(0.6, Math.round((uz-0.1)*10)/10); set(); };
  window.addEventListener("keydown", function(e){
    if (e.key === "+" || e.key === "="){ if(zin) zin.click(); }
    else if (e.key === "-"){ if(zout) zout.click(); }
  });
  window.addEventListener("resize", set);
  set();
  var lb = document.createElement("div");
  lb.style.cssText = "display:none;position:fixed;inset:0;background:rgba(20,14,8,.9);z-index:999;align-items:center;justify-content:center;cursor:zoom-out";
  var im = document.createElement("img");
  im.style.cssText = "max-width:96vw;max-height:96vh;border-radius:14px";
  lb.appendChild(im);
  lb.onclick = function(){ lb.style.display = "none"; };
  document.body.appendChild(lb);
  window.addEventListener("keydown", function(e){
    if (lb.style.display !== "none" && e.key !== "f" && e.key !== "F") lb.style.display = "none"; /* 灯箱开着：按键先关灯箱（翻页/ Esc 同样生效） */
  }, true);
  Array.prototype.forEach.call(document.querySelectorAll(".pic"), function(p){
    p.style.cursor = "zoom-in";
    p.title = "点击放大，再点关闭";
    p.addEventListener("click", function(ev){
      ev.stopPropagation();
      im.src = p.getAttribute("src");
      lb.style.display = "flex";
    });
  });
  var rvBtn = document.getElementById("rvBtn");
  function curSlide(){ return document.querySelectorAll(".slide")[cur]; }
  function hiddenRv(){ var sl = curSlide(); return sl ? sl.querySelectorAll(".rv:not(.rvshow)") : []; }
  function revealNext(){
    var h = hiddenRv();
    if (!h.length) return;
    h[0].classList.add("rvshow");
    if (h[0].scrollIntoView) h[0].scrollIntoView({behavior:"smooth", block:"nearest"});
    if (!hiddenRv().length && rvBtn) rvBtn.textContent = "✓ 已揭晓";
    syncRvPill();
  }
  if (rvBtn) rvBtn.onclick = revealNext;
  /* ===== 揭晓提示条：有未揭晓内容时常驻提示，写明点哪里 ===== */
  var rvPill = document.createElement("div");
  rvPill.className = "rvpill";
  rvPill.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:64px;background:#BF360C;color:#fff;padding:9px 22px;border-radius:999px;font-size:17px;z-index:60;box-shadow:0 4px 12px rgba(0,0,0,.28);display:none;cursor:pointer;white-space:nowrap";
  document.body.appendChild(rvPill);
  rvPill.onclick = function(e){ e.stopPropagation(); revealNext(); };
  function syncRvPill(){
    var n = hiddenRv().length;
    if (n){ rvPill.style.display = "block"; rvPill.textContent = "👇 本页还有 " + n + " 条内容未揭晓 · 点击页面任意处逐条显示（按 R 键也行）"; }
    else { rvPill.style.display = "none"; }
  }
  syncRvPill();
  window.addEventListener("keydown", function(e){
    if (e.key === "r" || e.key === "R") revealNext();
  });
  document.addEventListener("click", function(e){
    if (!e.target || !e.target.closest) return;
    if (lb.style.display !== "none") return; /* 灯箱开着：这次点击只负责关灯箱，不揭晓不翻页 */
    if (e.target.closest(".pic,button,a,#rvBtn,#hud,#notes,#tocMenu,.rvpill,input,select,textarea")) return;
    if (hiddenRv().length){ revealNext(); e.stopPropagation(); } /* 有未揭晓→任意点击先揭晓；没得揭晓才翻页 */
  }, true);
  window.resetRv = function(i){
    var sl = document.querySelectorAll(".slide")[i];
    if (!sl) return;
    sl.querySelectorAll(".rv").forEach(function(x){ x.classList.remove("rvshow"); });
    if (rvBtn){
      var has = sl.querySelector(".rv");
      rvBtn.style.display = has ? "" : "none";
      rvBtn.textContent = "▶ 揭晓";
    }
    syncRvPill();
  };
})();
</script>
