<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开学第一课 · 财务机器人应用与开发</title>
<style>
:root{
  --bg:#FFF9F0; --card:#FFFFFF; --text:#2B211B; --muted:#79695e;
  --primary:#E97835; --primary-dark:#C25A1F; --blue:#3B6EA5; --line:#EADFD0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#241D17;display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;}
#stage{position:relative;width:1280px;height:720px;background:var(--bg);overflow:hidden;
  transform-origin:center center;box-shadow:0 20px 60px rgba(0,0,0,.5);border-radius:6px}
.slide{position:absolute;inset:0;padding:64px 96px 84px;display:none;flex-direction:column;justify-content:center}
.slide.active{display:flex}
.eyebrow{font-size:22px;letter-spacing:.3em;color:var(--primary);font-weight:700;margin-bottom:14px}
h1{font-size:58px;color:var(--text);line-height:1.25;margin-bottom:22px;font-weight:800}
h1 .accent{color:var(--primary)}
.sub{font-size:26px;color:var(--muted);margin-bottom:26px;line-height:1.5}
ul.items{list-style:none}
ul.items li{font-size:30px;color:var(--text);line-height:1.55;padding:10px 0;
  border-bottom:1px dashed var(--line)}
ul.items li:last-child{border-bottom:none}
ul.items li b{color:var(--primary-dark)}
.cards{display:flex;gap:34px;margin-top:8px}
.card{flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:30px 34px}
.card h2{font-size:30px;margin-bottom:16px;color:var(--primary-dark)}
.card li{font-size:23px;color:var(--text);line-height:1.7;list-style:none;padding:6px 0}
.steps{display:flex;flex-direction:column;gap:18px;margin-top:10px}
.step{display:flex;align-items:center;gap:22px;background:var(--card);border:2px solid var(--line);
  border-radius:16px;padding:20px 28px}
.step .n{flex:0 0 62px;height:62px;border-radius:50%;background:var(--primary);color:#fff;
  font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step .t{font-size:28px;color:var(--text);line-height:1.5}
.step .t b{color:var(--primary-dark)}
.big{font-size:64px;text-align:center;line-height:1.35;color:var(--text);font-weight:800}
.big .accent{color:var(--primary)}
.emoji-row{text-align:center;font-size:76px;letter-spacing:18px;margin-bottom:34px}
.cover h1{font-size:74px}
.cover .sub{font-size:30px}
.meta{position:absolute;left:96px;bottom:34px;font-size:19px;color:var(--muted)}
/* 暂停点 */
.slide.pause{background:var(--primary);color:#fff}
.pause .eyebrow{color:#FFE8D6}
.pause h1{color:#fff;font-size:60px}
.pause .sub{color:#FFE8D6;font-size:30px}
.pause .where{margin-top:34px;font-size:26px;background:rgba(255,255,255,.18);
  border-radius:14px;padding:16px 26px;display:inline-block;align-self:flex-start}
/* 抽人 */
.slide.draw{background:var(--blue);color:#fff}
.draw .eyebrow{color:#D6E6F7}
.draw h1{color:#fff;font-size:60px}
.draw .sub{color:#D6E6F7;font-size:30px}
.draw li{color:#fff;border-bottom:1px dashed rgba(255,255,255,.25)}
.draw li b{color:#FFD9A8}
/* 任务卡 */
.task-card{background:var(--card);border:3px solid var(--primary);border-radius:20px;
  padding:36px 42px;max-width:1000px}
.task-card h2{font-size:34px;color:var(--primary-dark);margin-bottom:18px}
.task-card li{font-size:25px;color:var(--text);line-height:1.75;list-style:none}
.task-card li::before{content:"▶ ";color:var(--primary);font-size:20px}
/* 结束页 */
.slide.end{background:#2B211B;color:#FFF9F0;align-items:center;text-align:center}
.end h1{color:#FFF9F0;font-size:66px}
.end .sub{color:#D8CFC2;font-size:30px}
/* HUD */
#hud{position:absolute;left:0;right:0;bottom:0;height:56px;background:rgba(43,33,27,.92);
  display:flex;align-items:center;gap:14px;padding:0 22px;color:#FFF9F0;font-size:19px}
#hud button{background:none;border:1.5px solid rgba(255,249,240,.4);color:#FFF9F0;
  font-size:20px;padding:6px 16px;border-radius:10px;cursor:pointer}
#hud button:hover{background:var(--primary);border-color:var(--primary)}
#counter{margin-left:auto}
#bar{position:absolute;left:0;bottom:56px;height:5px;background:var(--primary);width:0;
  transition:width .25s}
/* 教师提示面板 */
#notes{position:absolute;left:0;right:0;bottom:56px;background:rgba(255,249,240,.97);
  border-top:3px solid var(--primary);padding:18px 96px;display:none;font-size:22px;color:var(--text)}
#notes b{color:var(--primary-dark)}
#notes.show{display:block}
.hint{position:absolute;right:22px;top:16px;font-size:16px;color:var(--muted)}
</style>
</head>
<body>

    <button id="prev" title="上一页">◀</button>
    <button id="next" title="下一页">▶</button>
    <span id="counter">1 / 1</span>
    <button id="notesBtn" title="教师提示">📝 教师提示</button>
    <button id="fsBtn" title="全屏">⛶ 全屏</button>
  </div>
</div>
<div class="hint" style="position:fixed;bottom:8px;right:12px;color:#999;font-size:13px;z-index:99">
  翻页：← → 或空格 ｜ 教师提示：N ｜ 全屏：F</div>

const deck = document.getElementById("deck");
const notesEl = document.getElementById("notes");
const bar = document.getElementById("bar");
const counter = document.getElementById("counter");
let cur = 0;

SLIDES.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide " + s.cls;
  el.innerHTML = s.html;
  deck.appendChild(el);
});
const slides = deck.querySelectorAll(".slide");

function show(i, silent) {
  cur = (i + SLIDES.length) % SLIDES.length;
  slides.forEach((el, k) => el.classList.toggle("active", k === cur));
  counter.textContent = (cur + 1) + " / " + SLIDES.length;
  bar.style.width = ((cur + 1) / SLIDES.length * 100) + "%";
  notesEl.innerHTML = "<b>📝 教师提示：</b>" + (SLIDES[cur].notes || "");
  if (notesEl.classList.contains("show") || silent !== true) {
    // 保留面板状态即可，内容已更新
  }
}
show(0);

function fit() {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  document.getElementById("stage").style.transform = "scale(" + s + ")";
}
window.addEventListener("resize", fit);
fit();

document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
document.getElementById("stage").addEventListener("click", (e) => {
  if (e.target.closest("#hud") || e.target.closest("#notes")) return;
  show(cur + 1);
});
document.getElementById("notesBtn").onclick = () => notesEl.classList.toggle("show");
document.getElementById("fsBtn").onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); show(cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(cur - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(SLIDES.length - 1);
  else if (e.key === "n" || e.key === "N") notesEl.classList.toggle("show");
  else if (e.key === "f" || e.key === "F") document.getElementById("fsBtn").click();
});
let tx = 0;
window.addEventListener("touchstart", (e) => tx = e.touches[0].clientX);
window.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 60) show(cur + (dx < 0 ? 1 : -1));
});
</script>
