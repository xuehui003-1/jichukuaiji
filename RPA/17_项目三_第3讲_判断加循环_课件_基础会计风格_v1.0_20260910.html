function mark(s){
  let out=esc(s);
  out=out.replace(/&lt;br\s*\/?&gt;/gi,"<br>");
  KEYS.forEach(k=>{ out=out.split(esc(k)).join('<mark class="kw">'+esc(k)+'</mark>'); });
  return out;
}
function bodyHtml(blocks){
  let n=0;
  return (blocks||[]).map(b=>{
    const lines=b.split("\n").filter(x=>x.length);
    return lines.map(x=>{ n++; return `<p style="--d:${(0.06+n*0.07).toFixed(2)}s">${mark(x)}</p>`; }).join("");
  }).join("");
}
function renderNav(){
  const q=$("q").value.trim();
  $("nav").innerHTML=SLIDES.map((s,idx)=>{
    const t=s.title||("第"+s.n+"页");
    if(q && !t.includes(q) && !String(s.n).includes(q)) return "";
    const short=t.length>16?t.slice(0,15)+"…":t;
    return `<button class="nav-item ${idx===i?"on":""}" data-i="${idx}"><span class="k">${s.n}</span>${esc(short)}</button>`;
  }).join("");
}
function fitCard(){
  const card=document.getElementById("card"), main=document.getElementById("main");
  if(!card||!main) return;
  main.style.zoom="";
  const cs=getComputedStyle(main);
  const pad=parseFloat(cs.paddingTop||0)+parseFloat(cs.paddingBottom||0);
  const avail=main.clientHeight-pad;
  const h=card.getBoundingClientRect().height;
  if(h>avail && avail>60){ main.style.zoom=Math.max(0.55, avail/h); }
}
window.addEventListener("resize",()=>setTimeout(fitCard,60));
function render(dir){
  const s=SLIDES[i];
  const card=$("card");
  card.className="card kind-"+s.kind+" "+(dir==="prev"?"enter-prev":"enter-next");
  let h=`<span class="stamp">${STAMP[s.kind]||"记"}　${KIND[s.kind]||""}</span>
    <h2>${s.title}</h2>`;
  h+=`<div class="bd">${bodyHtml(s.body)}</div>`;
  if((s.pics||[]).length){
    h+=`<div class="pics">${s.pics.map(p=>`<img src="${esc(p)}" alt="">`).join("")}</div>
        <div class="pic-hint">🔎 点图放大</div>`;
  }
  if(s.reveal){
    h+=`<div class="rv-hint">${esc(s.hint||"答案藏起来了——先说你的，再点开对。")}</div>
        <div class="reveal">${s.reveal.map((r,k)=>`<div class="r" data-r="${k}"><b>${mark(r[0])}</b><span>${mark(r[1])}</span></div>`).join("")}</div>`;
  }
  if(s.recap){
    h+=`<div class="recap">${s.recap.map((r,k)=>`<div class="rc" data-c="${k}"><b>${mark(r[0])}</b><span>${mark(r[1])}</span></div>`).join("")}</div>`;
  }
  card.innerHTML=h;
  $("nowbar").innerHTML="<b>现在你</b>："+esc((s.now||"").replace(/^现在你：?/,""));
  $("pg").textContent=(i+1)+" / "+SLIDES.length;
  $("prog").style.width=((i+1)/SLIDES.length*100)+"%";
  renderNav();
  setTimeout(fitCard,30);
}
function go(d){
  if(lbOpen){ lbClose(); return; }
  const ni=Math.min(SLIDES.length-1,Math.max(0,i+d));
  if(ni===i) return;
  const f=$("flash"); f.style.opacity=.55; setTimeout(()=>f.style.opacity=0,90);
  i=ni; render(d<0?"prev":"next");
  if(location.hash!=="#"+SLIDES[i].n) history.replaceState(null,"","#"+SLIDES[i].n);
}
function lbOpenFn(src,alt){ lbOpen=true; const lb=$("lb"); lb.innerHTML=`<img src="${esc(src)}" alt=""><div class="cap">${esc(alt||"点任意处关闭")}　·　按 Esc 或 ← → 也可关</div>`; lb.classList.add("show"); }
function lbClose(){ lbOpen=false; $("lb").classList.remove("show"); }
$("lb").addEventListener("click",lbClose);
document.addEventListener("keydown",e=>{
  if(lbOpen){ if(["Escape","ArrowLeft","ArrowRight"," ","Enter"].includes(e.key)){ e.preventDefault(); lbClose(); } return; }
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" ") { e.preventDefault(); go(1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(-1); }
  else if(e.key==="Home"){ i=0; render(); }
  else if(e.key==="End"){ i=SLIDES.length-1; render("prev"); }
});
$("card").addEventListener("click",e=>{
  const r=e.target.closest(".r,.rc");
  if(r){ r.classList.toggle("open"); setTimeout(fitCard,30); return; }
  if(e.target.tagName==="IMG"){ lbOpenFn(e.target.src,e.target.alt); }
});
$("prev").addEventListener("click",()=>go(-1));
$("next").addEventListener("click",()=>go(1));
$("nav").addEventListener("click",e=>{
  const b=e.target.closest(".nav-item"); if(!b) return;
  const ni=+b.dataset.i; if(ni===i) return;
  const d=ni>i?1:-1; i=ni; render(d>0?"next":"prev");
});
$("q").addEventListener("input",renderNav);
$("menuBtn").addEventListener("click",()=>{ const s=$("side"); s.style.display=(s.style.display==="none")?"block":"none"; setTimeout(fitCard,30); });

/* ── 字号：步进式增大/缩小，可连点 ── */
let fz=0; const FZ_MIN=-3, FZ_MAX=5;
function applyFont(){
  const k=Math.pow(1.1,fz);
  const r=document.documentElement.style;
  r.setProperty("--title",(3*k).toFixed(2)+"rem");
  r.setProperty("--body",(2*k).toFixed(2)+"rem");
  r.setProperty("--now",(1.55*k).toFixed(2)+"rem");
  $("fzLab").textContent=Math.round(k*100)+"%";
  $("fontInc").disabled = fz>=FZ_MAX;
  $("fontDec").disabled = fz<=FZ_MIN;
  setTimeout(fitCard,30);
}
$("fontInc").addEventListener("click",()=>{ if(fz<FZ_MAX){ fz++; applyFont(); } });
$("fontDec").addEventListener("click",()=>{ if(fz>FZ_MIN){ fz--; applyFont(); } });

/* 启动：支持 #页码 直达 */
(function(){
  const h=parseInt((location.hash||"").replace("#",""),10);
  if(h>=1&&h<=SLIDES.length){ const idx=SLIDES.findIndex(s=>s.n===h); if(idx>=0) i=idx; }
  applyFont(); render();
})();
</script>
</body>
</html>
