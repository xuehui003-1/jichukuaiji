<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#edf2fb"/>
    </linearGradient>
    <linearGradient id="student" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#314a9c"/>
      <stop offset="1" stop-color="#596fe0"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6048a8"/>
      <stop offset="1" stop-color="#8a6bd4"/>
    </linearGradient>
    <linearGradient id="teacher" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b65e2f"/>
      <stop offset="1" stop-color="#e18a45"/>
    </linearGradient>
    <linearGradient id="principle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#233763"/>
      <stop offset=".5" stop-color="#5164ce"/>
      <stop offset="1" stop-color="#278e77"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#273658" flood-opacity=".16"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5269d8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d9a7b"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="230" cy="170" r="180" fill="#6f82e8" opacity=".08" filter="url(#soft)"/>
  <circle cx="1680" cy="260" r="210" fill="#e28b4a" opacity=".08" filter="url(#soft)"/>
  <circle cx="960" cy="930" r="260" fill="#6e57bb" opacity=".07" filter="url(#soft)"/>

  <g id="title">
    <text x="960" y="116" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#586ad4" letter-spacing="4">软件整体结构</text>
    <text x="960" y="184" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="52" font-weight="800" fill="#1f2b45">一个软件 · 两类角色 · 一条教学闭环</text>
    <text x="960" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" fill="#738099">学生学习过程转化为教师可查看、可复核的教学证据</text>
  </g>

  <g id="student-card" filter="url(#shadow)">
    <rect x="120" y="310" width="480" height="460" rx="30" fill="url(#student)"/>
    <circle cx="195" cy="385" r="36" fill="#fff" opacity=".18"/>
    <text x="195" y="397" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="800" fill="#fff">学</text>
    <text x="250" y="392" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="35" font-weight="800" fill="#fff">学生学习端</text>
    <text x="160" y="446" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#dce3ff">完成学习任务，留下过程证据</text>
    <line x1="160" y1="480" x2="560" y2="480" stroke="#fff" opacity=".22"/>

    <g id="student-items" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
      <circle cx="180" cy="535" r="20" fill="#fff" opacity=".2"/>
      <text x="180" y="542" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
      <text x="220" y="543" font-size="25" font-weight="700" fill="#fff">记录生活事项</text>
      <text x="220" y="572" font-size="17" fill="#dbe3ff">真实、模糊、模拟三种模式</text>

      <circle cx="180" cy="625" r="20" fill="#fff" opacity=".2"/>
      <text x="180" y="632" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
      <text x="220" y="633" font-size="25" font-weight="700" fill="#fff">完成首次判断</text>
      <text x="220" y="662" font-size="17" fill="#dbe3ff">AI不在学生思考前抢答</text>

      <circle cx="180" cy="715" r="20" fill="#fff" opacity=".2"/>
      <text x="180" y="722" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
      <text x="220" y="723" font-size="25" font-weight="700" fill="#fff">专项训练与订正</text>
      <text x="220" y="752" font-size="17" fill="#dbe3ff">诊断分流后返回原任务验证</text>
    </g>
  </g>

  <g id="bridge-card" filter="url(#shadow)">
    <rect x="720" y="350" width="480" height="380" rx="30" fill="url(#bridge)"/>
    <circle cx="795" cy="425" r="36" fill="#fff" opacity=".18"/>
    <text x="795" y="437" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="800" fill="#fff">联</text>
    <text x="850" y="432" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="800" fill="#fff">智能与数据桥梁</text>
    <text x="760" y="484" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#eee9ff">连接学习过程与教师决策</text>
    <line x1="760" y1="516" x2="1160" y2="516" stroke="#fff" opacity=".22"/>

    <g id="bridge-items" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
      <rect x="760" y="550" width="400" height="48" rx="12" fill="#fff" opacity=".14"/>
      <text x="790" y="581" font-size="22" font-weight="700" fill="#fff">规则引擎</text>
      <text x="1130" y="581" text-anchor="end" font-size="16" fill="#eee9ff">确定性校验</text>

      <rect x="760" y="612" width="400" height="48" rx="12" fill="#fff" opacity=".14"/>
      <text x="790" y="643" font-size="22" font-weight="700" fill="#fff">DeepSeek辅助</text>
      <text x="1130" y="643" text-anchor="end" font-size="16" fill="#eee9ff">结构化与追问</text>

      <rect x="760" y="674" width="400" height="48" rx="12" fill="#fff" opacity=".14"/>
      <text x="790" y="705" font-size="22" font-weight="700" fill="#fff">SQLite过程数据</text>
      <text x="1130" y="705" text-anchor="end" font-size="16" fill="#eee9ff">本机保存</text>
    </g>
  </g>

  <g id="teacher-card" filter="url(#shadow)">
    <rect x="1320" y="310" width="480" height="460" rx="30" fill="url(#teacher)"/>
    <circle cx="1395" cy="385" r="36" fill="#fff" opacity=".18"/>
    <text x="1395" y="397" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="800" fill="#fff">教</text>
    <text x="1450" y="392" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="35" font-weight="800" fill="#fff">教师决策端</text>
    <text x="1360" y="446" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#fff0e5">查看证据，作出最终教学判断</text>
    <line x1="1360" y1="480" x2="1760" y2="480" stroke="#fff" opacity=".22"/>

    <g id="teacher-items" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
      <circle cx="1380" cy="535" r="20" fill="#fff" opacity=".2"/>
      <text x="1380" y="542" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
      <text x="1420" y="543" font-size="25" font-weight="700" fill="#fff">查看学习轨迹</text>
      <text x="1420" y="572" font-size="17" fill="#fff0e5">首次判断、反馈、订正与迁移</text>

      <circle cx="1380" cy="625" r="20" fill="#fff" opacity=".2"/>
      <text x="1380" y="632" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
      <text x="1420" y="633" font-size="25" font-weight="700" fill="#fff">形成班级诊断</text>
      <text x="1420" y="662" font-size="17" fill="#fff0e5">认知地图与专项训练数据</text>

      <circle cx="1380" cy="715" r="20" fill="#fff" opacity=".2"/>
      <text x="1380" y="722" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
      <text x="1420" y="723" font-size="25" font-weight="700" fill="#fff">教师复核与备课</text>
      <text x="1420" y="752" font-size="17" fill="#fff0e5">保留最终评价权</text>
    </g>
  </g>

  <g id="arrows">
    <path d="M 610 492 C 650 455, 672 455, 710 492" fill="none" stroke="#5269d8" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
    <text x="660" y="438" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#5269d8">学习过程</text>
    <path d="M 1210 492 C 1250 455, 1272 455, 1310 492" fill="none" stroke="#5269d8" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
    <text x="1260" y="438" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#5269d8">教学证据</text>

    <path d="M 1310 636 C 1270 680, 1250 680, 1210 636" fill="none" stroke="#2d9a7b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
    <path d="M 710 636 C 670 680, 650 680, 610 636" fill="none" stroke="#2d9a7b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
    <text x="960" y="776" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#278d72">教师意见返回学生订正</text>
  </g>

  <g id="principle">
    <rect x="300" y="860" width="1320" height="112" rx="28" fill="url(#principle)" filter="url(#shadow)"/>
    <text x="520" y="930" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="800" fill="#fff">学生先判断</text>
    <text x="735" y="930" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" fill="#b9c8ff">→</text>
    <text x="960" y="930" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="800" fill="#fff">AI后反馈</text>
    <text x="1185" y="930" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" fill="#b9e5d7">→</text>
    <text x="1400" y="930" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="800" fill="#fff">教师终审</text>
  </g>
</svg>
