&lt;section class=&quot;section&quot;&gt;&lt;h2 class=&quot;section-title&quot;&gt;第一部分　学习情况&lt;/h2&gt;&lt;div class=&quot;card&quot;&gt;

&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;label&quot;&gt;2. 你觉得自己数学怎么样？ &lt;span class=&quot;required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;choices&quot; data-required=&quot;q2&quot;&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;q2&quot; value=&quot;还不错&quot;&gt;&lt;span&gt;还不错&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;q2&quot; value=&quot;一般&quot;&gt;&lt;span&gt;一般&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;q2&quot; value=&quot;比较吃力&quot;&gt;&lt;span&gt;比较吃力&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;q2&quot; value=&quot;看到数字就头大&quot;&gt;&lt;span&gt;看到数字就头大&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;label&quot;&gt;3. 你希望这门课怎么上？ &lt;span class=&quot;required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;choices&quot; data-required=&quot;q3&quot;&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q3&quot; value=&quot;多做游戏比赛&quot;&gt;&lt;span&gt;多做游戏比赛&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q3&quot; value=&quot;多讲实际案例&quot;&gt;&lt;span&gt;多讲实际案例&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q3&quot; value=&quot;多动手实训&quot;&gt;&lt;span&gt;多动手实训&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q3&quot; value=&quot;讲慢一点细一点&quot;&gt;&lt;span&gt;讲慢一点细一点&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q3&quot; value=&quot;多用视频动画&quot;&gt;&lt;span&gt;多用视频动画&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q3&quot; value=&quot;多小组讨论&quot;&gt;&lt;span&gt;多小组讨论&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;field&quot;&gt;&lt;label class=&quot;label&quot; for=&quot;q8&quot;&gt;8. 你的外号是什么？谁起的？ &lt;span class=&quot;required&quot;&gt;必填&lt;/span&gt;&lt;/label&gt;&lt;p class=&quot;hint&quot;&gt;没有就写「没有」。&lt;/p&gt;&lt;textarea class=&quot;textarea&quot; id=&quot;q8&quot; name=&quot;q8&quot; required&gt;&lt;/textarea&gt;&lt;/div&gt;

&lt;div class=&quot;field&quot;&gt;&lt;label class=&quot;label&quot; for=&quot;q10&quot;&gt;10. 你上课有什么小动作或小习惯？ &lt;span class=&quot;required&quot;&gt;必填&lt;/span&gt;&lt;/label&gt;&lt;p class=&quot;hint&quot;&gt;比如转笔、翘椅子、挠头。&lt;/p&gt;&lt;textarea class=&quot;textarea&quot; id=&quot;q10&quot; name=&quot;q10&quot; required&gt;&lt;/textarea&gt;&lt;/div&gt;

&lt;section class=&quot;section&quot;&gt;&lt;h2 class=&quot;section-title&quot;&gt;第四部分　免费卡通形象邀请&lt;/h2&gt;&lt;div class=&quot;card&quot;&gt;&lt;p class=&quot;hint&quot;&gt;老师会免费帮愿意参加的同学制作可爱的卡通形象，可能会参考你喜欢的动画、你的特点和你填写的想法。参加完全自愿，不影响课上抽人。&lt;/p&gt;
&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;label&quot;&gt;16. 老师想免费帮同学画一个可爱的卡通形象，你愿意参加吗？ &lt;span class=&quot;required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;hint&quot;&gt;不用准备，也不收费；如果你有点害羞，也可以先参加一次试试看。&lt;/p&gt;&lt;div class=&quot;choices&quot; data-required=&quot;q16&quot;&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;q16&quot; value=&quot;愿意参加，期待我的卡通形象&quot;&gt;&lt;span&gt;愿意参加，期待我的卡通形象&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;q16&quot; value=&quot;愿意参加，但想先看看示例&quot;&gt;&lt;span&gt;愿意参加，但想先看看示例&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;q16&quot; value=&quot;有点害羞，先参加一次试试看&quot;&gt;&lt;span&gt;有点害羞，先参加一次试试看&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;q16&quot; value=&quot;这次先不参加，照片只用于课上抽人&quot;&gt;&lt;span&gt;这次先不参加，照片只用于课上抽人&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;p class=&quot;hint&quot;&gt;不参加也完全可以，不扣分，也不影响老师课上点名、提问和抽人。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;label&quot;&gt;17. 如果参加免费卡通形象，你最希望它怎么画？ &lt;span class=&quot;required&quot;&gt;选填，可多选&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;hint&quot;&gt;可以选你喜欢的方向；没有特别想法也没关系，老师会结合你的填写帮你设计。&lt;/p&gt;&lt;div class=&quot;choices&quot;&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q17&quot; value=&quot;保留我平时的样子和几个小特点&quot;&gt;&lt;span&gt;保留我平时的样子和几个小特点&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q17&quot; value=&quot;和我喜欢的动画人物一起出现&quot;&gt;&lt;span&gt;和我喜欢的动画人物一起出现&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q17&quot; value=&quot;做成适合当头像或表情包的样子&quot;&gt;&lt;span&gt;做成适合当头像或表情包的样子&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q17&quot; value=&quot;画成有趣的上课场景&quot;&gt;&lt;span&gt;画成有趣的上课场景&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q17&quot; value=&quot;请老师根据我的回答自由发挥&quot;&gt;&lt;span&gt;请老师根据我的回答自由发挥&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;

&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot;&gt;&lt;h2 class=&quot;section-title&quot;&gt;第五部分　奖励和「惩罚」&lt;/h2&gt;&lt;div class=&quot;card&quot;&gt;&lt;p class=&quot;hint&quot;&gt;勾得最多的几项，会写进贴在墙上的班规。&lt;/p&gt;
&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;label&quot;&gt;19. 什么奖励对你最有用？ &lt;span class=&quot;required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;choices&quot; data-required=&quot;q19&quot;&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q19&quot; value=&quot;画进上课漫画&quot;&gt;&lt;span&gt;画进上课漫画&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q19&quot; value=&quot;卡通形象升级&quot;&gt;&lt;span&gt;卡通形象升级&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q19&quot; value=&quot;加平时分&quot;&gt;&lt;span&gt;加平时分&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q19&quot; value=&quot;免一次作业&quot;&gt;&lt;span&gt;免一次作业&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q19&quot; value=&quot;全班表扬&quot;&gt;&lt;span&gt;全班表扬&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q19&quot; value=&quot;小零食&quot;&gt;&lt;span&gt;小零食&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;field&quot;&gt;&lt;div class=&quot;label&quot;&gt;20. 哪种「惩罚」你能接受、还觉得挺好玩？ &lt;span class=&quot;required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;hint&quot;&gt;执行前一定先给你本人看。&lt;/p&gt;&lt;div class=&quot;choices&quot; data-required=&quot;q20&quot;&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q20&quot; value=&quot;做成搞笑表情包&quot;&gt;&lt;span&gt;做成搞笑表情包&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q20&quot; value=&quot;上台讲一道题&quot;&gt;&lt;span&gt;上台讲一道题&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q20&quot; value=&quot;帮同学讲懂一道题&quot;&gt;&lt;span&gt;帮同学讲懂一道题&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q20&quot; value=&quot;表演才艺30秒&quot;&gt;&lt;span&gt;表演才艺30秒&lt;/span&gt;&lt;/label&gt;&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;q20&quot; value=&quot;罚做一道题&quot;&gt;&lt;span&gt;罚做一道题&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot;&gt;&lt;h2 class=&quot;section-title&quot;&gt;第六部分　随便写&lt;/h2&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;field&quot;&gt;&lt;label class=&quot;label&quot; for=&quot;q21&quot;&gt;21. 关于这门课，想对老师说什么？ &lt;span class=&quot;required&quot;&gt;选填&lt;/span&gt;&lt;/label&gt;&lt;p class=&quot;hint&quot;&gt;吐槽、要求、建议都行。不当众念。&lt;/p&gt;&lt;textarea class=&quot;textarea&quot; id=&quot;q21&quot; name=&quot;q21&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;div class=&quot;submit-area&quot;&gt;&lt;button class=&quot;submit&quot; id=&quot;submitBtn&quot; type=&quot;submit&quot;&gt;提交&lt;/button&gt;&lt;div class=&quot;small-note&quot;&gt;没交照片不能提交。提交成功写：交过了。学号填错或照片要换的，自己再打开改一次。&lt;/div&gt;&lt;/div&gt;

&lt;/main&gt;
&lt;script&gt;
(function(){
const form=document.getElementById('survey'),statusEl=document.getElementById('status'),btn=document.getElementById('submitBtn'),photoInput=document.getElementById('photo'),preview=document.getElementById('photoPreview'),previewImg=document.getElementById('previewImg'),previewCaption=document.getElementById('previewCaption'),existing=document.getElementById('existingPhoto'),progress=document.getElementById('progressBar');
const keyName='basic_accounting_participant_key'; const savedKey=localStorage.getItem(keyName); const participantKey=savedKey||((crypto&amp;&amp;crypto.randomUUID)?crypto.randomUUID():'p_'+Date.now()+'_'+Math.random().toString(36).slice(2)); if(!savedKey)localStorage.setItem(keyName,participantKey);
let ownLatest=null, ownRecords=[];
function show(msg,type){statusEl.textContent=msg;statusEl.className='status show '+(type||'error');statusEl.scrollIntoView({behavior:'smooth',block:'center'});}
function clearStatus(){statusEl.className='status';statusEl.textContent='';}
function value(name){const el=form.elements[name];return el?el.value.trim():''}
function answers(){const o={};for(let i=1;i&lt;=21;i++){const n='q'+i;const els=[...form.querySelectorAll('[name=&quot;'+n+'&quot;]')];if(!els.length)continue;if(els[0].type==='checkbox')o[n]=els.filter(x=&gt;x.checked).map(x=&gt;x.value);else{const checked=els.find(x=&gt;x.checked);o[n]=checked?checked.value:value(n)}}return o}
function setField(n,v){const els=[...form.querySelectorAll('[name=&quot;'+n+'&quot;]')];if(!els.length)return;if(els[0].type==='checkbox'){els.forEach(x=&gt;x.checked=Array.isArray(v)&amp;&amp;v.includes(x.value))}else if(els[0].type==='radio'){els.forEach(x=&gt;x.checked=x.value===v)}else els[0].value=v||''}
function updateProgress(){const all=[...form.querySelectorAll('input:not([type=file]),textarea')];const done=all.filter(x=&gt;x.type==='radio'||x.type==='checkbox'?false:x.value.trim()).length;const groups=[...new Set([...form.querySelectorAll('[data-required]')].map(x=&gt;x.dataset.required))];const groupDone=groups.filter(n=&gt;{const es=[...form.querySelectorAll('[name=&quot;'+n+'&quot;]')];return es.some(x=&gt;x.checked)}).length;const total=all.filter(x=&gt;!['radio','checkbox'].includes(x.type)).length+groups.length;progress.style.width=Math.min(100,Math.round((done+groupDone)/Math.max(1,total)*100))+'%'}
form.addEventListener('input',updateProgress);form.addEventListener('change',updateProgress);
photoInput.addEventListener('change',()=&gt;{clearStatus();const f=photoInput.files[0];if(!f){preview.style.display='none';return}if(!/^image\/(jpeg|png|heic)$/i.test(f.type)&amp;&amp;!/\.(jpe?g|png|heic)$/i.test(f.name)){photoInput.value='';show('照片只允许 jpg、png 或 heic。','error');return}previewImg.src=URL.createObjectURL(f);previewCaption.textContent='已选择：'+f.name;preview.style.display='block'});
async function sdk(){return await window.MuskCollectLoader.getInstance()}
async function loadOwn(){try{const s=await sdk();const all=await s.query('submissions');ownRecords=all.filter(x=&gt;x.data&amp;&amp;x.data.participantKey===participantKey);ownLatest=ownRecords.sort((a,b)=&gt;Number(b.updatedAt||b.createdAt)-Number(a.updatedAt||a.createdAt))[0]||null;if(ownLatest){const d=ownLatest.data||{};document.getElementById('name').value=d.name||'';document.getElementById('studentId').value=d.studentId||'';document.getElementById('dorm').value=d.dorm||'';const a=d.answers||{};Object.keys(a).forEach(n=&gt;setField(n,a[n]));if(d.photoUrl){existing.innerHTML='';const im=document.createElement('img');im.src=d.photoUrl;im.alt='已保存的照片';existing.appendChild(im);const t=document.createElement('span');t.textContent='已保存一张照片；如需更换，请重新选择文件。';existing.appendChild(t);existing.style.display='block'}show('已载入你上次提交的内容。可以检查后再交一次；最多允许改一次。','ok')}updateProgress()}catch(e){show(e.message||'数据加载失败，请重试。','error')}}
function validate(){if(!value('name'))return'请填写姓名。';if(!value('studentId'))return'请填写学号。学号一定要填对。';for(const n of ['q1','q2','q5','q16'])if(!form.querySelector('[name=&quot;'+n+'&quot;]:checked'))return'请完成必填选择题。';for(const n of ['q3','q19','q20'])if(!form.querySelector('[name=&quot;'+n+'&quot;]:checked'))return'请至少勾选一项必填内容。';for(const n of ['q8','q9','q10','q11','q12','q13','q14'])if(!value(n))return'请完成第三部分的必填简答。';if(!photoInput.files[0]&amp;&amp;!ownLatest?.data?.photoUrl)return'照片必交，请上传一张 jpg、png 或 heic 图片。';if(ownLatest&amp;&amp;Number(ownLatest.data?.editCount||0)&gt;=1)return'这份内容已经改过一次，不能再交了。';return''}
async function normalizeImage(file){const isHeic=/heic/i.test(file.type)||/\.heic$/i.test(file.name);if(!isHeic)return{blob:file,name:file.name||'photo.jpg'};if(typeof window.heic2any!=='function')throw new Error('HEIC 转 JPG 组件加载失败，请把照片改存为 JPG 或 PNG 后再上传。');const out=await window.heic2any({blob:file,toType:'image/jpeg',quality:.92});const blob=Array.isArray(out)?out[0]:out;return{blob,name:(file.name||'photo').replace(/\.heic$/i,'')+'.jpg'} }
form.addEventListener('submit',async ev=&gt;{ev.preventDefault();clearStatus();const err=validate();if(err){show(err,'error');return}btn.disabled=true;btn.textContent='正在提交&hellip;';const previous=ownLatest;const oldDocId=previous?.docId||'';const previousEditCount=previous?1:0;try{const s=await sdk();let photoUrl=previous?.data?.photoUrl||'',photoName=previous?.data?.photoName||'';if(photoInput.files[0]){const p=await normalizeImage(photoInput.files[0]);const uploaded=await s.upload(p.blob,p.name);photoUrl=uploaded.url;photoName=uploaded.fileName||p.name}if(!photoUrl)throw new Error('照片上传失败，请重试。');const d={participantKey,name:value('name'),studentId:value('studentId'),dorm:value('dorm'),answers:answers(),photoUrl,photoName,photoMime:'image/jpeg',editCount:previousEditCount,submittedAt:new Date().toISOString()};await s.save('submissions',d);if(oldDocId)await s.delete('submissions',oldDocId);localStorage.setItem('basic_accounting_submitted','1');show('交过了。学号填错或照片要换的，自己再打开改一次。','ok');btn.textContent='已提交';btn.disabled=true}catch(e){show(e.message||'提交失败，请重试。','error');btn.disabled=false;btn.textContent='提交'}finally{updateProgress()}});
loadOwn();
})();
&lt;/script&gt;
