  &lt;script&gt;
(function(){
const DEFAULT_PASSWORD='KJ2026-开学';const passKey='basic_accounting_teacher_password';let records=[];let sortOn=true;const $=id=&gt;document.getElementById(id);const loginView=$('loginView'),appView=$('appView'),loginStatus=$('loginStatus'),status=$('status'),tbody=$('tbody'),empty=$('empty'),count=$('count');
function msg(el,text,kind){el.textContent=text;el.className='status '+(kind||'')}
function currentPassword(){return localStorage.getItem(passKey)||DEFAULT_PASSWORD}
function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');loadData()}
$('loginBtn').addEventListener('click',()=&gt;{if($('password').value===currentPassword()){sessionStorage.setItem('basic_accounting_teacher_auth','1');showApp();}else msg(loginStatus,'访问口令不正确。','error')});$('password').addEventListener('keydown',e=&gt;{if(e.key==='Enter')$('loginBtn').click()});$('logoutBtn').addEventListener('click',()=&gt;{sessionStorage.removeItem('basic_accounting_teacher_auth');location.reload()});
$('passwordBtn').addEventListener('click',()=&gt;{const old=prompt('请输入当前访问口令');if(old!==currentPassword())return alert('当前访问口令不正确。');const next=prompt('请输入新的访问口令（至少6位）');if(!next||next.length&lt;6)return alert('新的访问口令至少需要6位。');localStorage.setItem(passKey,next);alert('访问口令已修改；仅保存在当前浏览器。')});
function latestByStudent(list){const map=new Map();list.forEach(item=&gt;{const d=item.data||{};const key=d.participantKey||((d.studentId||'')+'|'+(d.name||''));const prev=map.get(key);if(!prev||Number(item.updatedAt||item.createdAt)&gt;Number(prev.updatedAt||prev.createdAt))map.set(key,item)});return [...map.values()]}
function escText(v){return v==null?'':String(v)}
function fmtTime(v){const n=Number(v);return Number.isFinite(n)?new Date(n).toLocaleString('zh-CN',{hour12:false}):escText(v)}
function render(){records.sort((a,b)=&gt;{const da=a.data||{},db=b.data||{};return sortOn?escText(da.studentId).localeCompare(escText(db.studentId),'zh-Hans',{numeric:true}):Number(b.updatedAt||b.createdAt)-Number(a.updatedAt||a.createdAt)});tbody.textContent='';count.textContent='共 '+records.length+' 人';empty.classList.toggle('hidden',records.length&gt;0);records.forEach((item,i)=&gt;{const d=item.data||{},tr=document.createElement('tr');const cells=[];for(let j=0;j&lt;7;j++)cells.push(document.createElement('td'));cells[0].textContent=String(i+1);cells[1].textContent=escText(d.studentId);cells[1].className='id';cells[2].textContent=escText(d.name);cells[3].textContent=escText(d.dorm);if(d.photoUrl){const im=document.createElement('img');im.src=d.photoUrl;im.alt='';im.className='photo';im.loading='lazy';im.addEventListener('click',()=&gt;window.open(d.photoUrl,'_blank','noopener'));const a=document.createElement('a');a.href=d.photoUrl;a.target='_blank';a.rel='noopener';a.download=d.photoName||'photo.jpg';a.textContent='打开/下载';a.className='photo-link';cells[4].append(im,a)}else cells[4].textContent='无照片';cells[5].textContent=escText(d.submittedAt)?new Date(d.submittedAt).toLocaleString('zh-CN',{hour12:false}):fmtTime(item.updatedAt||item.createdAt);const box=document.createElement('div');box.className='answers';const labels={q1:'1. 以前接触过会计',q2:'2. 数学',q3:'3. 希望怎么上课',q4:'4. 最担心什么',q5:'5. 想看到的动画人物',q6:'6. 特别喜欢的动画',q7:'7. 喜欢的明星、主播、虚拟偶像',q8:'8. 外号及谁起的',q9:'9. 口头禅',q10:'10. 小动作或小习惯',q11:'11. 最怕被问到什么',q12:'12. 平时最爱做什么',q13:'13. 三个词形容自己',q14:'14. 同桌形容的三个词',q15:'15. 舍友觉得最搞笑的事',q16:'16. 是否参加免费卡通形象',q17:'17. 希望卡通形象怎么画',q19:'19. 最有用的奖励',q20:'20. 能接受的&ldquo;惩罚&rdquo;',q21:'21. 想对老师说什么'};const ans=d.answers||{};Object.keys(labels).forEach((k)=&gt;{const det=document.createElement('details');const sum=document.createElement('summary');sum.textContent=labels[k];det.appendChild(sum);const line=document.createElement('div');line.className='answer-line';line.textContent=Array.isArray(ans[k])?ans[k].join('、'):escText(ans[k]);det.appendChild(line);box.appendChild(det)});cells[6].appendChild(box);cells.forEach(c=&gt;tr.appendChild(c));tbody.appendChild(tr)})}
async function getSdk(){return await window.MuskCollectLoader.getInstance()}
async function loadData(){msg(status,'正在加载提交&hellip;');try{const s=await getSdk();records=latestByStudent(await s.query('submissions'));render();msg(status,'已更新。','ok')}catch(e){msg(status,e.message||'数据加载失败，请重试。','error')}}
$('refreshBtn').addEventListener('click',loadData);$('sortBtn').addEventListener('click',()=&gt;{sortOn=!sortOn;$('sortBtn').textContent='按学号排序：'+(sortOn?'开':'关');render()});
function rowsForExcel(){const labels={q1:'1. 你以前接触过会计吗？',q2:'2. 你觉得自己数学怎么样？',q3:'3. 你希望这门课怎么上？',q4:'4. 你最担心这门课的什么？',q5:'5. 投影上举例时，你最想看到哪个动画片里的人物？',q6:'6. 除了上面那个，你还特别喜欢哪个动画？',q7:'7. 你喜欢的明星、主播、虚拟偶像？',q8:'8. 你的外号是什么？谁起的？',q9:'9. 你的口头禅是什么？',q10:'10. 你上课有什么小动作或小习惯？',q11:'11. 你最怕上课被问到什么？',q12:'12. 你平时最爱做什么？',q13:'13. 用三个词形容你自己。',q14:'14. 同桌用三个词形容你。',q15:'15. 舍友觉得你最搞笑的一件事？',q16:'16. 老师免费帮你画卡通，你愿意参加吗？',q17:'17. 如果参加，希望卡通形象怎么画？',q19:'19. 什么奖励最有用？',q20:'20. 哪种&ldquo;惩罚&rdquo;能接受？',q21:'21. 关于这门课，想对老师说什么？'};return records.map((item,i)=&gt;{const d=item.data||{},a=d.answers||{},o={序号:i+1,学号:d.studentId||'',姓名:d.name||'',宿舍:d.dorm||'',照片文件名:d.photoName||'',提交时间:d.submittedAt?new Date(d.submittedAt).toLocaleString('zh-CN',{hour12:false}):fmtTime(item.updatedAt||item.createdAt)};Object.keys(labels).forEach(k=&gt;o[labels[k]]=Array.isArray(a[k])?a[k].join('、'):(a[k]||''));return o})}
$('excelBtn').addEventListener('click',()=&gt;{if(!records.length)return alert('暂无提交可导出。');if(!window.XLSX)return alert('Excel 组件加载失败，请刷新后重试。');const ws=XLSX.utils.json_to_sheet(rowsForExcel());const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'文字列');XLSX.writeFile(wb,'基础会计-开学点单-文字.xlsx')});
$('zipBtn').addEventListener('click',async()=&gt;{if(!records.length)return alert('暂无照片可下载。');if(!window.JSZip)return alert('照片打包组件加载失败，请刷新后重试。');const zip=new JSZip();let n=0;const failed=[];msg(status,'正在打包照片，请稍候&hellip;');for(const item of records){const d=item.data||{};if(!d.photoUrl)continue;const safe=(d.studentId||('学生'+(n+failed.length+1))).replace(/[\\/:*?&quot;&lt;&gt;|]/g,'_');const fileName=safe+'-'+(d.photoName||'photo.jpg');try{const r=await fetch(d.photoUrl,{mode:'cors',credentials:'include',cache:'no-store'});if(!r.ok)throw new Error('读取失败（HTTP '+r.status+'）');const b=await r.blob();if(!b.size)throw new Error('读取到空文件');zip.file(fileName,b);n++}catch(e){failed.push({name:fileName,url:d.photoUrl,reason:e&amp;&amp;e.message?e.message:'浏览器无法读取该照片'})}}if(n){const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='基础会计-开学点单-照片.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=&gt;URL.revokeObjectURL(a.href),1000);msg(status,failed.length?'已打包 '+n+' 张照片；另有 '+failed.length+' 张未能读取，请点击对应照片下方的&ldquo;打开/下载&rdquo;单独保存。':'照片打包完成，共 '+n+' 张。',failed.length?'error':'ok');return}if(failed.length){const names=failed.map(x=&gt;x.name).join('、');msg(status,'照片可预览，但浏览器无法读取文件合并压缩包：'+names+'。请使用每张照片下方的&ldquo;打开/下载&rdquo;单独保存；若需压缩包，请在允许跨域下载后重试。','error');return}msg(status,'没有找到可打包的照片。','error')});
if(sessionStorage.getItem('basic_accounting_teacher_auth')==='1')showApp();
})();
