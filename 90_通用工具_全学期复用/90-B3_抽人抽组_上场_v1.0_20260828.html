<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上场　抽人抽组 v1.0</title>
<style>
:root{
  --gold:#f6d36b; --gold2:#c9a227; --ink:#07060c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05040a;color:#f7f1df;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;}
#bg{position:fixed;inset:0;z-index:0}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.72) 100%)}
.ui{position:relative;z-index:3;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{font-size:15px;letter-spacing:.4em;color:var(--gold);font-weight:800}
.top button,.panel button,.actions button{
  border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:999px;
}
.ghost{background:rgba(255,255,255,.08);color:#f7f1df;padding:8px 14px}
.gold{background:linear-gradient(180deg,#ffe9a8,#d7b14a);color:#3a2a00;padding:8px 16px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.ring-wrap{position:relative;width:min(560px,86vw);height:min(560px,86vw)}
canvas#wheel{width:100%;height:100%;filter:drop-shadow(0 0 28px rgba(246,211,107,.25))}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;z-index:4;
  border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid #ffe9a8;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.hub{position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3428,#120e08 70%);
  border:3px solid #f6d36b;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px}
.hub b{font-size:clamp(16px,2.4vw,22px);color:#ffe9a8;letter-spacing:.2em}
.flash-name{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-size:clamp(28px,5vw,54px);font-weight:900;color:#fff;text-shadow:0 0 24px #f6d36b;opacity:.18}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:8px 16px 18px}
.actions .big{font-size:22px;padding:14px 28px}
.hint{text-align:center;color:#b8a57a;font-size:13px;padding-bottom:10px}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(380px,94vw);background:rgba(10,8,16,.94);
  border-left:1px solid rgba(246,211,107,.25);z-index:6;transform:translateX(105%);transition:.35s;padding:18px;overflow:auto}
.panel.on{transform:none}
.panel h2{color:var(--gold);font-size:18px;margin:8px 0 10px}
.panel textarea{width:100%;min-height:140px;background:#120f18;color:#f7f1df;border:1px solid #4a3d22;
  border-radius:10px;padding:10px;font:inherit;font-size:15px;margin-bottom:10px}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.result{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55)}
.result.on{display:flex}
.card{text-align:center;padding:28px 36px;border-radius:24px;
  background:radial-gradient(circle at 50% 0%,#3a2f18,#0b0906 70%);
  border:2px solid #f6d36b;box-shadow:0 0 80px rgba(246,211,107,.35), inset 0 0 40px rgba(246,211,107,.08);
  min-width:min(640px,92vw);animation:slam .55s cubic-bezier(.2,1.6,.3,1)}
@keyframes slam{0%{transform:scale(.2) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.card .tag{letter-spacing:.5em;color:#f6d36b;font-weight:800;margin-bottom:8px}
.card .nm{font-size:clamp(48px,8vw,96px);font-weight:900;line-height:1.15;
  background:linear-gradient(180deg,#fff8d6,#f6d36b 45%,#b88920);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 6px 0 #3a2a00)}
.card .more{margin-top:12px;font-size:28px;font-weight:800;color:#ffe9a8;line-height:1.5}
.card .sub{margin-top:10px;color:#cbb98a}
.boom{position:fixed;inset:0;z-index:7;pointer-events:none}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="vignette"></div>
<canvas class="boom" id="boom"></canvas>
<div class="ui">
  <div class="top">
    <div class="brand">上场</div>
    <button class="ghost" type="button" id="btnList">名单 / 组名</button>
    <button class="ghost" type="button" id="btnMute">音效开</button>
    <span style="margin-left:auto;font-size:12px;color:#b8a57a">全学期抽人抽组都能用　名单只留在这台电脑</span>
  </div>
  <div class="stage">
    <div class="ring-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="720" height="720"></canvas>
      <div class="hub"><b id="hubTxt">谁<br>上台</b></div>
      <div class="flash-name" id="flash"></div>
    </div>
  </div>
  <div class="actions">
    <button class="gold big" type="button" id="draw1">抽一个人</button>
    <button class="gold big" type="button" id="drawG">抽一个组</button>
    <button class="ghost big" type="button" id="draw3">抽三个人</button>
  </div>
  <div class="hint">转盘会越转越慢。点「名单 / 组名」先贴名单。F11 全屏更有上场感。</div>
</div>
<aside class="panel" id="panel">
  <h2>人名单　一行一个</h2>
  <textarea id="people" placeholder="张三&#10;李四&#10;王五"></textarea>
  <div class="row">
    <button class="gold" type="button" id="saveP">保存人名单</button>
    <span id="pCount" style="color:#b8a57a;font-size:13px"></span>
  </div>
  <h2>组名单　一行一个</h2>
  <textarea id="groups" placeholder="资金组&#10;采购组&#10;销售组&#10;费用组&#10;生产组"></textarea>
  <div class="row">
    <button class="gold" type="button" id="saveG">保存组名单</button>
    <span id="gCount" style="color:#b8a57a;font-size:13px"></span>
  </div>
  <p style="font-size:13px;line-height:1.7;color:#b8a57a">抽人用上面名单，抽组用下面名单。人数多时转盘上只画格子，中间会闪过名字。这是试用页，先看效果，再决定后面活动要不要都接到这一页。</p>
  <button class="ghost" type="button" id="closeP">关闭</button>
</aside>
<div class="result" id="result">
  <div class="card">
    <div class="tag" id="rtag">上台</div>
    <div class="nm" id="rname"></div>
    <div class="more" id="rmore"></div>
    <div class="sub">点空白处关掉，再抽下一次</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const PAL = ["#f6d36b","#e8b84a","#8b1e2d","#1d4e89","#0f7a5a","#c45c26","#5b2c6f","#2e86ab"];
let items = [];
let rot = -Math.PI/2;
let spinning = false;
let muted = false;
let audio;

function load(){
  $("people").value = localStorage.getItem("draw-people") || "";
  $("groups").value = localStorage.getItem("draw-groups") || "资金组\n采购组\n销售组\n费用组\n生产组";
  count();
}
function lines(el){ return el.value.split(/\n+/).map(s=>s.trim()).filter(Boolean); }
function count(){
  $("pCount").textContent = lines($("people")).length + " 人";
  $("gCount").textContent = lines($("groups")).length + " 组";
}
$("saveP").onclick = ()=>{ localStorage.setItem("draw-people", $("people").value); count(); };
$("saveG").onclick = ()=>{ localStorage.setItem("draw-groups", $("groups").value); count(); };
$("btnList").onclick = ()=> $("panel").classList.add("on");
$("closeP").onclick = ()=> $("panel").classList.remove("on");
$("people").oninput = $("groups").oninput = count;

/* particles */
const bg = $("bg"), btx = bg.getContext("2d");
const boom = $("boom"), otx = boom.getContext("2d");
let stars=[], sparks=[];
function resize(){
  bg.width = boom.width = innerWidth;
  bg.height = boom.height = innerHeight;
}
addEventListener("resize", resize); resize();
for(let i=0;i<140;i++){
  stars.push({x:Math.random(), y:Math.random(), r:Math.random()*1.8+.2, s:Math.random()*0.4+.1, a:Math.random()});
}
function tickStars(t){
  btx.clearRect(0,0,bg.width,bg.height);
  const g = btx.createRadialGradient(bg.width/2,bg.height/2,20,bg.width/2,bg.height/2,bg.width*.7);
  g.addColorStop(0,"#1a140c"); g.addColorStop(1,"#05040a");
  btx.fillStyle=g; btx.fillRect(0,0,bg.width,bg.height);
  stars.forEach(p=>{
    p.a += p.s*0.02;
    btx.beginPath();
    btx.fillStyle = `rgba(255,230,160,${.25+.75*(.5+.5*Math.sin(p.a+t/400))})`;
    btx.arc(p.x*bg.width, p.y*bg.height, p.r, 0, 6.28);
    btx.fill();
  });
  otx.clearRect(0,0,boom.width,boom.height);
  sparks = sparks.filter(s=>s.life>0);
  sparks.forEach(s=>{
    s.life-=1; s.x+=s.vx; s.y+=s.vy; s.vy+=0.04;
    otx.fillStyle=`rgba(255,220,120,${s.life/60})`;
    otx.beginPath(); otx.arc(s.x,s.y,s.r,0,6.28); otx.fill();
  });
  requestAnimationFrame(tickStars);
}
requestAnimationFrame(tickStars);

function burst(){
  const cx=innerWidth/2, cy=innerHeight/2;
  for(let i=0;i<90;i++){
    const a=Math.random()*6.28, sp=2+Math.random()*7;
    sparks.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,r:1+Math.random()*3,life:40+Math.random()*30});
  }
}

function ac(){
  if(!audio) audio = new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended") audio.resume();
  return audio;
}
function beep(freq, dur, type="square", vol=.05){
  if(muted) return;
  const ctx=ac(), o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.value=vol; o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime+dur);
}

const wc = $("wheel"), wtx = wc.getContext("2d");
function drawWheel(list, angle, highlight){
  const n = Math.max(list.length, 1);
  const cx=360, cy=360, R=340;
  wtx.clearRect(0,0,720,720);
  wtx.save();
  wtx.translate(cx,cy);
  wtx.rotate(angle);
  const arc = Math.PI*2/n;
  for(let i=0;i<n;i++){
    wtx.beginPath();
    wtx.moveTo(0,0);
    wtx.arc(0,0,R, i*arc, (i+1)*arc);
    wtx.closePath();
    wtx.fillStyle = PAL[i%PAL.length];
    wtx.globalAlpha = (highlight===i)?1:.92;
    wtx.fill();
    wtx.strokeStyle="rgba(0,0,0,.35)";
    wtx.lineWidth=2; wtx.stroke();
    if(n<=14){
      wtx.save();
      wtx.rotate(i*arc+arc/2);
      wtx.fillStyle="#fff8e1";
      wtx.font="bold 22px Microsoft YaHei,sans-serif";
      wtx.textAlign="right";
      wtx.fillText(list[i], R-18, 8);
      wtx.restore();
    }
  }
  wtx.beginPath(); wtx.arc(0,0,R,0,6.28);
  wtx.strokeStyle="#f6d36b"; wtx.lineWidth=10; wtx.stroke();
  wtx.restore();
}

function pointerIndex(list, angle){
  const n=list.length;
  const arc=Math.PI*2/n;
  // pointer is at top = -PI/2 in screen space. wheel drawn with extra `angle`
  let a = (-Math.PI/2 - angle) % (Math.PI*2);
  if(a<0) a+=Math.PI*2;
  return Math.floor(a/arc) % n;
}

function spin(list, k=1){
  if(spinning) return;
  if(!list.length){ $("panel").classList.add("on"); return; }
  spinning=true;
  $("result").classList.remove("on");
  items=list.slice();
  const n=items.length;
  const extra = 6 + Math.floor(Math.random()*4);
  const target = Math.floor(Math.random()*n);
  const picks = [];
  const used = new Set();
  while(picks.length<k){
    let x = Math.floor(Math.random()*n);
    if(k===1){ picks.push(target); break; }
    if(!used.has(x)){ used.add(x); picks.push(x); }
  }
  const win = picks[0];
  const arc=Math.PI*2/n;
  const final = -Math.PI/2 - (win+0.5)*arc - extra*Math.PI*2;
  const start = rot;
  const dist = final - start;
  const dur = 5200 + Math.random()*800;
  const t0 = performance.now();
  let lastTick = -1;
  $("hubTxt").innerHTML = "就要<br>停了";
  function frame(now){
    const p = Math.min(1,(now-t0)/dur);
    const e = 1-Math.pow(1-p, 5);
    rot = start + dist*e;
    const idx = pointerIndex(items, rot);
    drawWheel(items, rot, idx);
    $("flash").textContent = items[idx];
    $("flash").style.opacity = p<.7 ? .15 : .35;
    if(idx!==lastTick){
      lastTick=idx;
      beep(420+p*180, p>.75?.07:.03, "square", p>.8?.07:.03);
    }
    if(p<1) requestAnimationFrame(frame);
    else {
      spinning=false;
      burst();
      beep(880,.18,"sine",.08);
      setTimeout(()=>beep(1320,.28,"sine",.08),120);
      reveal(picks.map(i=>items[i]), k);
    }
  }
  requestAnimationFrame(frame);
}

function reveal(names, k){
  $("rtag").textContent = k===1 ? (groupsMode?"上场的组":"上台") : "上台三人";
  $("rname").textContent = names[0];
  $("rmore").textContent = names.length>1 ? names.slice(1).join("　") : "";
  $("hubTxt").innerHTML = names[0].length>5 ? names[0].slice(0,4)+"<br>…" : names[0];
  $("result").classList.add("on");
}
let groupsMode=false;
$("draw1").onclick = ()=>{ groupsMode=false; spin(lines($("people")),1); };
$("drawG").onclick = ()=>{ groupsMode=true; spin(lines($("groups")),1); };
$("draw3").onclick = ()=>{ groupsMode=false; spin(lines($("people")),3); };
$("result").onclick = ()=> $("result").classList.remove("on");
$("btnMute").onclick = ()=>{
  muted=!muted;
  $("btnMute").textContent = muted?"音效关":"音效开";
  if(!muted) ac();
};
load();
drawWheel(["？"], rot, 0);
</script>
</body>
</html>
