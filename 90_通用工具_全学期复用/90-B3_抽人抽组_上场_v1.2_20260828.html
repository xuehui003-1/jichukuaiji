<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上场　抽人抽组 v1.2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#070b14;color:#eef4ff;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;}
#bg{position:fixed;inset:0;z-index:0}
.ui{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;z-index:5}
.brand{font-size:16px;letter-spacing:.45em;color:#ffd36a;font-weight:900}
.top button,.panel button,.actions button{
  border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:999px}
.ghost{background:rgba(255,255,255,.1);color:#eef4ff;padding:8px 14px}
.gold{background:linear-gradient(180deg,#ffe9a8,#e0b13a);color:#2a1c00;padding:8px 16px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.ring-wrap{position:relative;width:min(620px,88vw);height:min(620px,88vw)}
#wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 0 24px rgba(80,140,255,.25))}
.needle{position:absolute;left:50%;top:50%;width:22px;height:42%;
  transform:translate(-50%,-100%);transform-origin:50% 100%;z-index:4;pointer-events:none;
  background:linear-gradient(#ffffff,#ff1744 40%,#9b0000);
  clip-path:polygon(50% 0,100% 92%,68% 100%,32% 100%,0 92%);
  filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 3px #000)}
.hub{position:absolute;left:50%;top:50%;width:28%;height:28%;transform:translate(-50%,-50%);
  border-radius:50%;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 32% 28%,#3b4a6a,#0c1220 68%);
  border:4px solid #ff1744;box-shadow:0 0 0 6px #0c1220}
.hub b{font-size:clamp(18px,2.6vw,28px);color:#fff;letter-spacing:.12em;line-height:1.2}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:10px 16px 8px}
.actions .big{font-size:20px;padding:12px 24px}
.uses{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px 6px}
.uses button{padding:6px 12px;font-size:13px;background:#1a2744;color:#c9d6f0}
.uses button.on{background:#ff1744;color:#fff}
.hint{text-align:center;color:#8ea0c3;font-size:13px;padding:0 16px 12px}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.dim.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);z-index:21;
  background:#10182a;border-left:1px solid #3d4d72;padding:16px 16px 24px;overflow:auto;
  transform:translateX(100%);transition:transform .4s ease}
.panel.on{transform:translateX(0)}
.panel h2{color:#ffd36a;font-size:17px;margin:6px 0 8px}
.panel textarea{width:100%;min-height:90px;background:#0b1220;color:#eef4ff;border:1px solid #3d4d72;
  border-radius:10px;padding:10px;font:inherit;font-size:15px}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 10px}
.rule{font-size:13px;line-height:1.7;color:#c9d6f0;background:#0b1220;border:1px dashed #3d4d72;border-radius:10px;padding:10px;margin:8px 0}
.rule b{color:#ffd36a}
.log{font-size:13px;line-height:1.6;color:#9effc1;min-height:1.6em;margin:4px 0 10px;white-space:pre-wrap}
.plist{display:grid;gap:8px;margin:8px 0 16px}
.prow{display:flex;align-items:center;gap:8px;background:#0b1220;border:1px solid #2a3754;border-radius:10px;padding:6px}
.prow img,.face{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#1c2740;border:2px solid #ffd36a}
.prow span{flex:1;font-weight:700}
.prow label{font-size:12px;background:#243152;padding:6px 8px;border-radius:999px;cursor:pointer}
.result{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
.result.on{display:flex}
.card{text-align:center;padding:24px;border-radius:22px;min-width:min(720px,94vw);
  background:radial-gradient(circle at 50% 0%,#243156,#0b1220 70%);
  border:2px solid #ffd36a;box-shadow:0 0 70px rgba(255,211,106,.28);animation:slam .5s cubic-bezier(.2,1.5,.3,1)}
@keyframes slam{0%{transform:scale(.35);opacity:0}100%{transform:scale(1);opacity:1}}
.card .tag{letter-spacing:.35em;color:#ffd36a;font-weight:800;margin-bottom:12px}
.trio{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.one{width:min(200px,30vw);display:flex;flex-direction:column;align-items:center;gap:8px}
.one img,.one .face{width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid #ffd36a;background:#1c2740}
.nm{font-size:36px;font-weight:900;color:#ffe9a8;line-height:1.2;text-align:center}
.card .sub{margin-top:12px;color:#8ea0c3;font-size:14px}
.boom{position:fixed;inset:0;z-index:25;pointer-events:none}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas class="boom" id="boom"></canvas>
<div class="ui">
  <div class="top">
    <div class="brand">上场</div>
    <button class="ghost" type="button" id="btnList">名单 / 组名</button>
    <button class="ghost" type="button" id="btnMute">音效开</button>
    <span style="margin-left:auto;font-size:12px;color:#8ea0c3">v1.2　批量配图 + 盘上头像</span>
  </div>
  <div class="stage">
    <div class="ring-wrap">
      <canvas id="wheel" width="800" height="800"></canvas>
      <div class="needle"></div>
      <div class="hub"><b id="hubTxt">开始</b></div>
    </div>
  </div>
  <div class="uses" id="uses">
    <button type="button" data-u="抽中" class="on">抽中</button>
    <button type="button" data-u="上台">上台</button>
    <button type="button" data-u="答题">答题</button>
    <button type="button" data-u="演示">演示</button>
  </div>
  <div class="actions">
    <button class="gold big" type="button" id="draw1">抽一个人</button>
    <button class="gold big" type="button" id="drawG">抽一个组</button>
    <button class="ghost big" type="button" id="draw3">抽三个人</button>
  </div>
  <div class="hint">红针从圆心指向上方。抽中后弹窗标题可在上面改成「抽中 / 上台 / 答题 / 演示」。</div>
</div>
<div class="dim" id="dim"></div>
<aside class="panel" id="panel">
  <h2>人名单　一行一个</h2>
  <textarea id="people" placeholder="张三&#10;李四&#10;王五"></textarea>
  <div class="row">
    <button class="gold" type="button" id="saveP">保存人名单</button>
    <label class="ghost" style="display:inline-block">批量配卡通图
      <input id="bulk" type="file" accept="image/png,image/jpeg,image/jpg,image/webp" multiple hidden>
    </label>
    <span id="pCount" style="color:#8ea0c3;font-size:13px"></span>
  </div>
  <div class="rule">
    <b>批量配图规则（任选一种）：</b><br>
    ① 文件名里带上姓名：张三.png、01-张三.jpg、张三-小新.webp<br>
    ② 文件名对不上也没关系：一次选的张数＝名单人数，就按名单从上到下顺序配。
  </div>
  <div class="log" id="bulkLog"></div>
  <div class="plist" id="plist"></div>
  <h2>组名单　一行一个</h2>
  <textarea id="groups" placeholder="资金组&#10;采购组&#10;销售组&#10;费用组&#10;生产组"></textarea>
  <div class="row">
    <button class="gold" type="button" id="saveG">保存组名单</button>
    <span id="gCount" style="color:#8ea0c3;font-size:13px"></span>
  </div>
  <button class="ghost" type="button" id="closeP">收起</button>
</aside>
<div class="result" id="result">
  <div class="card" id="card"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const DARK="#12315a", LIGHT="#fff1c2", INK="#0e1a2f", CREAM="#fff8e4";
let items=[], rot=0, spinning=false, muted=false, groupsMode=false, photos={}, imgObj={}, useWord="抽中";

function lines(el){ return el.value.split(/\n+/).map(s=>s.trim()).filter(Boolean); }
function photoCount(){ return lines($("people")).filter(n=>photos[n]).length; }
function count(){
  $("pCount").textContent = lines($("people")).length + " 人，配图 " + photoCount() + " 张";
  $("gCount").textContent = lines($("groups")).length + " 组";
}
function openPanel(on){
  $("panel").classList.toggle("on", on);
  $("dim").classList.toggle("on", on);
}
$("btnList").onclick = ()=> openPanel(!$("panel").classList.contains("on"));
$("closeP").onclick = $("dim").onclick = ()=> openPanel(false);
$("uses").onclick = e=>{
  const b=e.target.closest("button"); if(!b) return;
  useWord=b.dataset.u;
  [...$("uses").children].forEach(x=>x.classList.toggle("on", x===b));
};

function dbp(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("draw-avatars",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("img");
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function putPhoto(name, blob){
  if(photos[name]) URL.revokeObjectURL(photos[name]);
  photos[name]=URL.createObjectURL(blob);
  delete imgObj[name];
  return dbp().then(db=>new Promise(res=>{
    const tx=db.transaction("img","readwrite");
    tx.objectStore("img").put(blob, name);
    tx.oncomplete=()=>res();
    tx.onerror=()=>res();
  })).catch(()=>{});
}
async function loadPhotos(){
  try{
    const db=await dbp();
    const store=db.transaction("img").objectStore("img");
    await new Promise(res=>{
      const req=store.openCursor();
      req.onsuccess=e=>{
        const c=e.target.result;
        if(!c){ res(); return; }
        photos[c.key]=URL.createObjectURL(c.value);
        c.continue();
      };
    });
  }catch(e){}
}
function getImg(name){
  const url=photos[name]; if(!url) return null;
  if(imgObj[name] && imgObj[name]._url===url) return imgObj[name];
  const im=new Image();
  im._url=url;
  im.onload=()=>{ if(!spinning) drawWheel(items, rot, -1); };
  im.src=url;
  imgObj[name]=im;
  return im;
}

function renderList(){
  const ps=lines($("people"));
  $("plist").innerHTML = ps.map(n=>`
    <div class="prow">
      ${photos[n]?`<img src="${photos[n]}" alt="">`:`<div class="face"></div>`}
      <span>${n}</span>
      <label>选图<input type="file" accept="image/*" data-name="${n}" hidden></label>
    </div>`).join("");
}
$("plist").onchange = async e=>{
  const f=e.target.files && e.target.files[0];
  const name=e.target.dataset.name;
  if(!f||!name) return;
  await putPhoto(name, f);
  renderList(); count(); drawWheel(items.length?items:lines($("people")), rot, -1);
};

$("saveP").onclick = ()=>{
  localStorage.setItem("draw-people", $("people").value);
  count(); renderList(); paintIdle();
};
$("saveG").onclick = ()=>{
  localStorage.setItem("draw-groups", $("groups").value);
  count();
};

function norm(s){ return String(s).replace(/\s+/g,"").replace(/[_\-—–.．]/g,"").toLowerCase(); }
function matchStem(stem, names){
  const ns=norm(stem);
  for(const name of names) if(norm(name)===ns) return name;
  const sorted=[...names].sort((a,b)=>b.length-a.length);
  for(const name of sorted){
    const nn=norm(name);
    if(nn && (ns.includes(nn) || nn.includes(ns))) return name;
  }
  return null;
}
$("bulk").onchange = async e=>{
  const files=[...e.target.files];
  const names=lines($("people"));
  if(!names.length){ $("bulkLog").textContent="请先保存人名单，再批量选图。"; return; }
  const leftoverFiles=[];
  const taken=new Set();
  const log=[];
  for(const f of files){
    const stem=f.name.replace(/\.[^.]+$/,"");
    const hit=matchStem(stem, names);
    if(hit && !taken.has(hit)){
      await putPhoto(hit, f);
      taken.add(hit);
      log.push("✓ "+hit+" ← "+f.name);
    }else leftoverFiles.push(f);
  }
  const leftoverNames=names.filter(n=>!taken.has(n));
  const pair=Math.min(leftoverFiles.length, leftoverNames.length);
  for(let i=0;i<pair;i++){
    await putPhoto(leftoverNames[i], leftoverFiles[i]);
    taken.add(leftoverNames[i]);
    log.push("✓ "+leftoverNames[i]+" ← "+leftoverFiles[i].name+"（按名单顺序）");
  }
  const unused=leftoverFiles.slice(pair);
  if(unused.length) log.push("未用上："+unused.map(f=>f.name).join("、"));
  $("bulkLog").textContent = "配上 "+taken.size+" 张\n"+log.join("\n");
  count(); renderList(); paintIdle();
  e.target.value="";
};

const bg=$("bg"), btx=bg.getContext("2d");
const boom=$("boom"), otx=boom.getContext("2d");
let stars=[], sparks=[];
function resize(){ bg.width=boom.width=innerWidth; bg.height=boom.height=innerHeight; }
addEventListener("resize", resize); resize();
for(let i=0;i<120;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.2,s:Math.random()*.4+.08,a:Math.random()});
(function loop(t){
  btx.fillStyle="#070b14"; btx.fillRect(0,0,bg.width,bg.height);
  const g=btx.createRadialGradient(bg.width/2,bg.height*.45,10,bg.width/2,bg.height*.45,bg.width*.65);
  g.addColorStop(0,"#12203a"); g.addColorStop(1,"#070b14");
  btx.fillStyle=g; btx.fillRect(0,0,bg.width,bg.height);
  stars.forEach(p=>{
    btx.beginPath();
    btx.fillStyle=`rgba(200,220,255,${.2+.8*(.5+.5*Math.sin(p.a+t/500))})`;
    btx.arc(p.x*bg.width,p.y*bg.height,p.r,0,6.28); btx.fill();
    p.a+=p.s*.02;
  });
  otx.clearRect(0,0,boom.width,boom.height);
  sparks=sparks.filter(s=>s.life>0);
  sparks.forEach(s=>{
    s.life--; s.x+=s.vx; s.y+=s.vy; s.vy+=.05;
    otx.fillStyle=`rgba(255,211,106,${s.life/50})`;
    otx.beginPath(); otx.arc(s.x,s.y,s.r,0,6.28); otx.fill();
  });
  requestAnimationFrame(loop);
})(0);
function burst(){
  const cx=innerWidth/2, cy=innerHeight/2;
  for(let i=0;i<80;i++){
    const a=Math.random()*6.28, sp=2+Math.random()*6;
    sparks.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,r:1+Math.random()*2.5,life:36+Math.random()*24});
  }
}

let audio;
function ac(){ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==="suspended") audio.resume(); return audio; }
function tone(freq, dur, vol=.04){
  if(muted) return;
  const ctx=ac(), o=ctx.createOscillator(), f=ctx.createBiquadFilter(), g=ctx.createGain();
  o.type="sine"; o.frequency.value=freq;
  f.type="lowpass"; f.frequency.value=900;
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+dur);
  o.connect(f); f.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime+dur);
}
function tickSound(){ tone(240,.05,.03); }
function winSound(){ tone(523,.25,.05); setTimeout(()=>tone(659,.28,.05),90); setTimeout(()=>tone(784,.4,.05),180); }

const wc=$("wheel"), wtx=wc.getContext("2d");
function drawWheel(list, angle, hi){
  const n=Math.max(list.length,1);
  const cx=400, cy=400, R=378, inner=118;
  wtx.clearRect(0,0,800,800);
  wtx.save(); wtx.translate(cx,cy); wtx.rotate(angle);
  const arc=Math.PI*2/n;
  const fs=Math.max(11, Math.min(20, 380/n));
  const pr=Math.max(12, Math.min(34, 640/n));
  for(let i=0;i<n;i++){
    const dark=i%2===0;
    wtx.beginPath(); wtx.moveTo(0,0);
    wtx.arc(0,0,R,i*arc,(i+1)*arc); wtx.closePath();
    wtx.fillStyle= dark?DARK:LIGHT;
    wtx.fill();
    if(hi===i){ wtx.strokeStyle="#ff1744"; wtx.lineWidth=7; wtx.stroke(); }
    const label=list[i]||"";
    wtx.save();
    wtx.rotate(i*arc+arc/2);
    const im=getImg(label);
    let textX=R-14;
    if(im && im.complete && im.naturalWidth){
      const cxp=R-pr-10;
      wtx.save();
      wtx.beginPath(); wtx.arc(cxp,0,pr,0,6.28); wtx.clip();
      wtx.drawImage(im, cxp-pr, -pr, pr*2, pr*2);
      wtx.restore();
      wtx.beginPath(); wtx.arc(cxp,0,pr,0,6.28);
      wtx.strokeStyle="#fff"; wtx.lineWidth=3; wtx.stroke();
      textX=cxp-pr-10;
    }
    wtx.fillStyle= dark?CREAM:INK;
    wtx.font=`bold ${fs}px Microsoft YaHei, PingFang SC, sans-serif`;
    wtx.textAlign="right";
    wtx.textBaseline="middle";
    const text=label.length>6?label.slice(0,6)+"…":label;
    wtx.fillText(text, textX, 0);
    wtx.restore();
  }
  wtx.beginPath(); wtx.arc(0,0,R,0,6.28);
  wtx.strokeStyle="#ffd36a"; wtx.lineWidth=8; wtx.stroke();
  wtx.beginPath(); wtx.arc(0,0,inner,0,6.28);
  wtx.fillStyle="#0c1220"; wtx.fill();
  wtx.restore();
}
function pointerIndex(list, angle){
  const n=list.length; if(!n) return 0;
  const arc=Math.PI*2/n;
  let a=(-Math.PI/2 - angle)%(Math.PI*2);
  if(a<0) a+=Math.PI*2;
  return Math.floor(a/arc)%n;
}
function paintIdle(){
  const list=lines($("people"));
  items=list.length?list:["先贴名单"];
  rot=0;
  drawWheel(items, rot, -1);
  $("hubTxt").textContent="开始";
}

function spin(list, k){
  if(spinning) return;
  if(!list.length){ openPanel(true); return; }
  spinning=true;
  $("result").classList.remove("on");
  $("hubTxt").textContent="开始";
  items=list.slice();
  const n=items.length;
  const extra=5+Math.floor(Math.random()*4);
  const picks=[];
  const used=new Set();
  while(picks.length<Math.min(k,n)){
    const x=Math.floor(Math.random()*n);
    if(!used.has(x)){ used.add(x); picks.push(x); }
  }
  const win=picks[0];
  const arc=Math.PI*2/n;
  const final= -Math.PI/2 - (win+0.5)*arc - extra*Math.PI*2;
  const start=rot, dist=final-start, dur=4800;
  const t0=performance.now();
  let last=-1;
  function frame(now){
    const p=Math.min(1,(now-t0)/dur);
    const e=1-Math.pow(1-p,5);
    rot=start+dist*e;
    const idx=pointerIndex(items,rot);
    drawWheel(items,rot,idx);
    if(idx!==last){ last=idx; tickSound(); }
    if(p<1) requestAnimationFrame(frame);
    else{
      spinning=false;
      burst(); winSound();
      $("hubTxt").textContent = items[win].length>5 ? items[win].slice(0,5) : items[win];
      reveal(picks.map(i=>items[i]), k);
    }
  }
  requestAnimationFrame(frame);
}

function reveal(names, k){
  const tag = k>1 ? useWord+" · "+k+"人" : (groupsMode ? useWord+"的组" : useWord);
  const cells = names.map(n=>`
    <div class="one">
      ${photos[n]?`<img src="${photos[n]}" alt="">`:`<div class="face"></div>`}
      <div class="nm">${n}</div>
    </div>`).join("");
  $("card").innerHTML = `<div class="tag">${tag}</div><div class="trio">${cells}</div><div class="sub">点空白处关掉，再抽下一次</div>`;
  $("result").classList.add("on");
}
$("result").onclick = e=>{ if(e.target.id==="result") $("result").classList.remove("on"); };
$("draw1").onclick = ()=>{ groupsMode=false; spin(lines($("people")),1); };
$("drawG").onclick = ()=>{ groupsMode=true; spin(lines($("groups")),1); };
$("draw3").onclick = ()=>{ groupsMode=false; spin(lines($("people")),3); };
$("btnMute").onclick = ()=>{
  muted=!muted;
  $("btnMute").textContent = muted?"音效关":"音效开";
  if(!muted) ac();
};

(async function init(){
  $("people").value = localStorage.getItem("draw-people")||"";
  $("groups").value = localStorage.getItem("draw-groups")||"资金组\n采购组\n销售组\n费用组\n生产组";
  count();
  await loadPhotos();
  count();
  renderList();
  paintIdle();
})();
</script>
</body>
</html>
