<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目七　对账和结账　上课投影 v1.0</title>
<style>

:root{
  --orange:#bf360c; --green:#2e7d32; --ink:#22170f;
  --gold:#f9a825; --brown:#3e2723; --paper:#fffdf8; --line:#ead9c6;
  --title:3rem; --body:2rem; --now:1.55rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#efe4d6;color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;}
body{display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--brown);color:#fff;flex-shrink:0}
.top h1{font-size:14px;font-weight:700}
.top small{opacity:.75;font-size:11px;margin-left:6px}
.top .hint{margin-left:auto;font-size:11px;opacity:.85}
.top button{border:0;background:#efebe9;color:var(--brown);font:inherit;font-weight:800;padding:6px 10px;border-radius:8px;cursor:pointer}
.top button.on{background:#ffcc80;color:var(--brown)}
.layout{display:grid;grid-template-columns:148px 1fr;flex:1;min-height:0}
body.wide .layout{grid-template-columns:1fr}
body.wide .side{display:none}
.side{background:#f7efe4;border-right:1px solid var(--line);overflow:auto;padding:6px 0}
.side input{width:calc(100% - 12px);margin:4px 6px 6px;padding:5px 7px;border:1px solid #e6d5c3;border-radius:6px;font:inherit;font-size:11px}
.nav-item{display:block;width:100%;text-align:left;padding:5px 8px;border:0;background:transparent;font:inherit;cursor:pointer;color:#5a4638;font-size:11px;line-height:1.25}
.nav-item:hover{background:#f8e8d8}
.nav-item.on{background:#bf360c;color:#fff}
.nav-item .k{display:inline-block;min-width:22px;opacity:.7;font-variant-numeric:tabular-nums}
.main{min-height:0;overflow-y:scroll;padding:8px 14px 8px;display:flex;justify-content:center;align-items:flex-start;scrollbar-gutter:stable}
.main::-webkit-scrollbar{width:14px}
.main::-webkit-scrollbar-track{background:#e8dccf;border-radius:8px}
.main::-webkit-scrollbar-thumb{background:#bf360c;border-radius:8px}
.card{width:min(1100px,100%);background:var(--paper);border-radius:14px;box-shadow:0 8px 28px rgba(62,39,35,.08);border:1px solid var(--line)}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.k-cover{background:#3e2723;color:#ffcc80}
.k-pause{background:#fff3e0;color:#bf360c;border:1px solid #ffcc80}
.k-pic{background:#e8f5e9;color:#2e7d32}
.k-setup{background:#eceff1;color:#455a64}
.k-homework{background:#fff8e1;color:#f57f17;border:1px solid #ffe082}
.k-teacher{background:#efebe9;color:#5d4037}
.k-game{background:#e3f2fd;color:#1565c0}
.k-thumbs{background:#fce4ec;color:#ad1457}
.k-text{background:#f5f5f5;color:#616161}
.k-spare{background:#eeeeee;color:#757575}
.k-drag{background:#e8f5e9;color:#1b5e20}
.go-draw{display:block;margin:10px 22px 14px;background:#bf360c;color:#fff;text-align:center;text-decoration:none;font-size:1.25rem;font-weight:800;padding:14px 16px;border-radius:12px}
.go-draw:hover{filter:brightness(1.08)}
.drag-board{padding:4px 22px 16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px;min-height:52px}
.chip{background:#bf360c;color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;cursor:grab;user-select:none;font-size:clamp(16px,2.2vw,22px);touch-action:none}
.chip.lock{background:#2e7d32;cursor:default}
.chip.hold{opacity:.35}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bin{min-height:110px;border:2px dashed #c4a882;border-radius:14px;padding:8px;background:#faf6f0}
.bin h4{font-size:clamp(16px,2vw,20px);margin:0 0 8px;color:#3e2723;text-align:center}
.bin.ok{border-color:#2e7d32;background:#e8f5e9;border-style:solid}
.bin.bad{border-color:#c62828;background:#ffebee}
.bin .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.drag-msg{text-align:center;font-weight:800;color:#2e7d32;font-size:1.1rem;min-height:1.4em;margin-top:8px}
.link-board{position:relative;margin:6px 12px 12px}
.link-who{text-align:center;font-weight:900;color:#bf360c;font-size:1.3rem;margin:4px 0 8px}
.lian-hud{display:flex;justify-content:center;align-items:center;gap:12px;margin:6px 0}
.lian-timer{width:96px;height:96px;border-radius:50%;border:8px solid #bf360c;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;background:#fff}
.lian-timer.low{border-color:#c62828;color:#c62828;background:#ffebee;animation:pulse .45s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.lian-cut{position:fixed;inset:0;background:rgba(28,8,6,.9);color:#fff;display:none;align-items:center;justify-content:center;z-index:40;font-size:clamp(32px,6vw,64px);font-weight:900;text-align:center}
.lian-cut.on{display:flex}
.link-grid{display:grid;grid-template-columns:minmax(120px,22%) 1fr minmax(120px,22%);gap:8px;align-items:stretch;min-height:300px}
.link-svg{width:100%;height:100%;min-height:300px}
.link-col{display:flex;flex-direction:column;gap:6px;justify-content:center}
.link-item{border:2px solid #d7c4b0;background:#fff;border-radius:10px;padding:6px 8px;font-weight:800;font-size:14px;text-align:center;cursor:pointer;color:#3e2723;line-height:1.25}
.link-item.on{border-color:#bf360c;background:#fff3e0;box-shadow:0 0 0 3px #ffcc80}
.link-item.lock{border-color:#2e7d32;background:#e8f5e9;color:#1b5e20;cursor:default}
.link-item.tied{border-color:#ef6c00;background:#fff8e1}
.link-item.bad{border-color:#c62828;background:#ffebee}
.link-col.right .link-item{background:#faf6f0}
.ghost-chip{position:fixed;z-index:40;pointer-events:none;background:#bf360c;color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.head{padding:12px 22px 4px}
.head h2{font-size:var(--title);line-height:1.25;color:var(--brown);cursor:zoom-in}
.body{padding:6px 22px 10px;font-size:var(--body);line-height:1.45;font-weight:650}
.body p{margin:0 0 10px;cursor:zoom-in}
.body .why{background:#fff8e1;border-left:6px solid var(--gold);padding:12px 14px;border-radius:0 8px 8px 0}
mark.kw{background:#fff176;color:#22170f;padding:0 .12em;border-radius:4px;font-weight:900}
.pics{padding:0 22px 4px;display:grid;gap:8px}
.pics.one{grid-template-columns:1fr}
.pics.many{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.pics img{width:auto;max-width:100%;max-height:34vh;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#faf6f0;cursor:zoom-in;display:block;margin:0 auto}
.pics.many img{max-height:18vh;width:100%}
.pic-hint{text-align:center;font-size:13px;color:#8d6e63;padding:0 22px 8px}
.lab{display:block;margin:8px 22px 12px;background:var(--orange);color:#fff;text-align:center;text-decoration:none;font-size:1.2rem;font-weight:800;padding:12px;border-radius:12px}
.dock{flex-shrink:0}
.now{background:var(--green);color:#fff;padding:8px 18px;font-size:var(--now);font-weight:800;line-height:1.35;cursor:zoom-in}
.bar{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#fff;border-top:1px solid var(--line)}
.bar button{border:0;background:var(--orange);color:#fff;font:inherit;font-weight:700;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.2}
.bar button.ghost{background:#efebe9;color:var(--brown)}
.bar .pg{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;color:#6d5648;font-size:13px}
.lb{position:fixed;inset:0;background:rgba(20,12,8,.9);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
.lb.show{display:flex}
.lb img{max-width:96vw;max-height:92vh;border-radius:8px}
.zoom-text{color:#fff;font-size:clamp(36px,6.5vw,84px);font-weight:900;line-height:1.35;text-align:center;max-width:92vw;text-shadow:0 2px 0 #000}
@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:block;position:fixed;inset:48px 0 100px 0;z-index:5;background:#fff8f0}
}


.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(1200px 600px at 10% -10%,#ffcc80 0%,transparent 55%),radial-gradient(900px 500px at 110% 110%,#81c784 0%,transparent 50%),#ead7c0}
.ambient .blob{position:absolute;border-radius:50%;filter:blur(28px);opacity:.7;animation:float 10s ease-in-out infinite}
.ambient .b1{width:50vw;height:50vw;left:-12vw;top:-18vh;background:#ff6d00}
.ambient .b2{width:44vw;height:44vw;right:-14vw;bottom:-12vh;background:#00c853;animation-delay:-4s}
.ambient .b3{width:32vw;height:32vw;left:38vw;top:38vh;background:#ff1744;opacity:.45;animation-delay:-7s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8%,-10%) scale(1.18)}}
.progress{position:fixed;top:0;left:0;right:0;height:10px;z-index:12;background:#3e2723}
.progress i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#ff1744 0 18px,#ffea00 18px 36px);box-shadow:0 0 16px #ff1744;transition:width .8s cubic-bezier(.16,1,.3,1)}
.page-flash{position:fixed;inset:0;z-index:11;pointer-events:none;background:#fff;opacity:0}
.page-flash.go{animation:flash .55s ease}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
.layout,.dock,.top{position:relative;z-index:2}
.card{overflow:visible;transform-origin:50% 50%;position:relative}
.card.enter-next{animation:inNext 1.05s cubic-bezier(.16,1,.3,1) both}
.card.enter-prev{animation:inPrev 1.05s cubic-bezier(.16,1,.3,1) both}
@keyframes inNext{0%{opacity:0;transform:translateX(22vw) rotate(2.5deg) scale(.9)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes inPrev{0%{opacity:0;transform:translateX(-22vw) rotate(-2.5deg) scale(.9)}60%{opacity:1}100%{opacity:1;transform:none}}
.card .head h2,.card .body p,.card .pics img,.card .go-draw,.card .why{
  animation:rise .85s cubic-bezier(.16,1,.3,1) both;
}
.card .head h2{animation-delay:.08s}
.card .body p{animation-delay:var(--d,.2s)}
.card .pics img{animation-delay:.28s}
.card .go-draw{animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(42px) scale(.96)}to{opacity:1;transform:none}}
.card.kind-cover{background:linear-gradient(165deg,#fff3e0,#fffdf8 40%,#ffe0b2);box-shadow:0 20px 60px rgba(191,54,12,.22)}
.card.kind-cover h2{letter-spacing:.06em;animation:coverSlam 1s cubic-bezier(.16,1,.3,1) both}
@keyframes coverSlam{0%{opacity:0;transform:scale(.6) rotate(-6deg)}70%{transform:scale(1.06) rotate(1deg)}100%{opacity:1;transform:none}}
.card.kind-cover .body p{font-size:1.08em}
.card.kind-pause{background:#fff8e1;border:8px solid #ff1744!important;box-shadow:0 0 0 8px #fffde7, 0 0 40px #ff1744}
.card.kind-pause::before{content:"";position:absolute;inset:-16px;border-radius:22px;border:8px solid #ff1744;animation:ring 1s ease-out infinite;pointer-events:none}
.stamp{position:absolute;right:16px;top:16px;z-index:3;font-weight:900;font-size:26px;padding:8px 14px;border-radius:12px;transform:rotate(12deg);box-shadow:4px 4px 0 #3e2723;animation:stamp 1s cubic-bezier(.16,1,.3,1) both;pointer-events:none;letter-spacing:.08em}
.stamp.st-cover{background:#3e2723;color:#ffcc80}
.stamp.st-setup{background:#1565c0;color:#fff}
.stamp.st-pic{background:#2e7d32;color:#fff}
.stamp.st-pause{background:#ff1744;color:#fff;font-size:30px}
.stamp.st-text{background:#5d4037;color:#ffe0b2}
.stamp.st-game{background:#6a1b9a;color:#fff}
.stamp.st-homework{background:#ef6c00;color:#fff}
.stamp.st-thumbs{background:#ad1457;color:#fff}
.stamp.st-spare{background:#607d8b;color:#fff}
.stamp.st-drag{background:#1b5e20;color:#fff}
.stamp.st-teacher{background:#4e342e;color:#fff}
.comic{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:8px 22px 16px}
.comic .panel{background:#fff;border:4px solid #22170f;border-radius:8px;min-height:140px;padding:10px;position:relative;animation:rise .7s both;animation-delay:var(--d,.2s);box-shadow:6px 6px 0 rgba(0,0,0,.12)}
.comic .panel i{position:absolute;left:8px;top:6px;font-style:normal;font-weight:900;font-size:18px;color:#bf360c}
.comic .panel p{margin:28px 4px 8px;font-size:clamp(15px,2vw,20px);font-weight:800;line-height:1.35}
.comic .bubble{background:#fffde7;border:2px solid #3e2723;border-radius:18px;padding:8px 10px}
@media(max-width:800px){.comic{grid-template-columns:1fr 1fr}}
@keyframes ring{0%{transform:scale(.96);opacity:1}100%{transform:scale(1.08);opacity:0}}
@keyframes stamp{0%{opacity:0;transform:scale(1.8) rotate(-20deg)}100%{opacity:1;transform:rotate(12deg)}}
.card.kind-pause .badge{background:#ff1744;color:#fff;font-size:16px;padding:6px 14px;animation:pulse .7s ease-in-out infinite}
.card.kind-pic .pics.one{overflow:hidden;border-radius:16px;margin:0 22px 8px;border:6px solid #3e2723;box-shadow:12px 12px 0 #bf360c}
.card.kind-pic .pics.one img{max-height:42vh;animation:rise .8s both, ken 8s ease-in-out .8s infinite alternate;border:0}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.12)}}
.card.kind-setup .body p:last-child{background:#fff176;border-left:10px solid #ff1744;padding:12px 14px;border-radius:0 12px 12px 0;font-size:1.05em}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);transform:translateX(-130%);animation:shine 1.6s ease .3s 1}
@keyframes shine{to{transform:translateX(130%)}}
.now{animation:nowIn .7s cubic-bezier(.16,1,.3,1) both;box-shadow:0 -8px 24px rgba(46,125,50,.35)}
@keyframes nowIn{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.step{position:relative;padding-left:.15em}
.go-draw{transition:transform .2s ease, filter .2s;box-shadow:0 8px 0 #7f0000}
.go-draw:hover{transform:translateY(-3px) scale(1.04)}
.go-draw .ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.35em}
.lian-legend{text-align:center;font-weight:800;color:#5d4037;background:#fff8e1;border:3px dashed #bf360c;border-radius:12px;padding:10px;margin:8px 22px;font-size:1.05rem}
.houses{display:flex;justify-content:space-around;gap:10px;margin:8px 16px 4px;flex-wrap:wrap}
.houses .h{flex:1;min-width:180px;padding:10px 12px;border-radius:14px;text-align:center;font-weight:900;font-size:1.05rem}
.houses .L{background:#c8e6c9;color:#1b5e20;border:3px solid #2e7d32}
.houses .R{background:#ffe0b2;color:#e65100;border:3px solid #ef6c00}
@media (prefers-reduced-motion: reduce){
  .ambient .blob,.card,.card .head h2,.card .body p,.card .pics img,.card .go-draw,.now,.progress i,.page-flash,.card.kind-pause::before,.card.kind-pause::after{animation:none!important;transition:none!important}
}


/* ── 新卡片类型 ───────────────────────────── */
.k-hands{background:#e1f5fe;color:#01579b}
.k-warn{background:#ffebee;color:#b71c1c;border:1px solid #ef9a9a}
.k-collect{background:#f3e5f5;color:#6a1b9a}
.k-wall{background:#fff3e0;color:#e65100}
.k-ledger{background:#e8eaf6;color:#283593}
.k-shout{background:#fce4ec;color:#ad1457}
.k-key{background:#3e2723;color:#ffcc80}
.k-step{background:#e0f2f1;color:#00695c}
.k-dispute{background:#fffde7;color:#f57f17;border:1px solid #ffe082}
.k-drill{background:#e8f5e9;color:#1b5e20}
.k-vote{background:#ede7f6;color:#4527a0}
.k-recap{background:#fce4ec;color:#880e4f}
.k-name{background:#3e2723;color:#ffcc80}
.k-end{background:#3e2723;color:#ffcc80}
.stamp.st-hands{background:#0277bd;color:#fff}
.stamp.st-warn{background:#c62828;color:#fff}
.stamp.st-collect{background:#6a1b9a;color:#fff}
.stamp.st-wall{background:#e65100;color:#fff}
.stamp.st-ledger{background:#283593;color:#fff}
.stamp.st-shout{background:#ad1457;color:#fff}
.stamp.st-key{background:#ffc400;color:#3e2723}
.stamp.st-step{background:#00695c;color:#fff}
.stamp.st-dispute{background:#f9a825;color:#3e2723}
.stamp.st-drill{background:#2e7d32;color:#fff}
.stamp.st-vote{background:#4527a0;color:#fff}
.stamp.st-recap{background:#880e4f;color:#fff}
.stamp.st-name{background:#ffc400;color:#3e2723}
.stamp.st-end{background:#ffc400;color:#3e2723}

/* 金句页：超大字独占一屏 */
.card.kind-key,.card.kind-name,.card.kind-end{
  background:linear-gradient(160deg,#2d1b12,#3e2723 55%,#4e342e);
  border:0!important;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.card.kind-key .head h2,.card.kind-name .head h2,.card.kind-end .head h2{
  color:#ffd54f;font-size:clamp(38px,7.2vw,104px);line-height:1.15;
  text-align:center;letter-spacing:.02em;padding:18px 0 6px}
.card.kind-key .body,.card.kind-name .body,.card.kind-end .body{text-align:center}
.card.kind-key .body p,.card.kind-name .body p,.card.kind-end .body p{
  color:#ffe0b2;font-size:clamp(17px,2.3vw,30px);font-weight:650}
.card.kind-key .badge,.card.kind-name .badge,.card.kind-end .badge{margin-left:22px}

/* 警告页 */
.card.kind-warn{background:#fff5f5;border:6px solid #c62828!important}
.card.kind-warn .head h2{color:#b71c1c;text-align:center;font-size:clamp(30px,5vw,62px)}
.card.kind-warn .body p{text-align:center;font-size:clamp(20px,3vw,40px);font-weight:900;color:#c62828}

/* 三次举手 */
.hands{padding:6px 22px 18px;display:grid;gap:12px}
.hand-item{border:3px solid #b3e5fc;background:#fff;border-radius:14px;padding:14px 18px;cursor:pointer;transition:.25s}
.hand-item:hover{border-color:#0288d1}
.hand-item .hq{font-size:clamp(19px,2.6vw,30px);font-weight:800;color:#01579b}
.hand-item .hh{margin-top:8px;font-size:clamp(15px,1.9vw,21px);color:#0277bd;font-weight:700;
  max-height:0;overflow:hidden;opacity:0;transition:.35s}
.hand-item.on{border-color:#0288d1;background:#e1f5fe}
.hand-item.on .hh{max-height:80px;opacity:1}
.hand-item .num{display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;
  border-radius:50%;background:#0288d1;color:#fff;font-weight:900;margin-right:10px}

/* 收集答案 */
.collect{padding:6px 22px 16px}
.collect .cin{display:flex;gap:8px;margin-bottom:10px}
.collect input{flex:1;font:inherit;font-size:clamp(18px,2.4vw,26px);font-weight:800;
  padding:10px 14px;border:3px solid #ce93d8;border-radius:12px}
.collect button{border:0;background:#6a1b9a;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(16px,2vw,22px);padding:10px 22px;border-radius:12px;cursor:pointer}
.collect .chips2{display:flex;flex-wrap:wrap;gap:10px;min-height:60px}
.collect .c2{background:#6a1b9a;color:#fff;padding:10px 20px;border-radius:999px;
  font-weight:900;font-size:clamp(18px,2.6vw,30px);animation:pop .35s cubic-bezier(.16,1,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.collect .tip{margin-top:10px;color:#6a1b9a;font-weight:700;font-size:15px}

/* 错误答案墙 */
.wall{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:10px 22px 18px}
.wall span{background:#fff;border:4px solid #ff9800;color:#e65100;border-radius:16px;
  padding:14px 30px;font-size:clamp(30px,5.5vw,68px);font-weight:900;
  animation:pop .45s cubic-bezier(.16,1,.3,1) both}
.wall span:nth-child(2){animation-delay:.09s}.wall span:nth-child(3){animation-delay:.18s}
.wall span:nth-child(4){animation-delay:.27s}.wall span:nth-child(5){animation-delay:.36s}
.wall span:nth-child(6){animation-delay:.45s}

/* 逐笔账 */
.ledger{padding:4px 22px 16px}
.ledger table{width:100%;border-collapse:collapse;font-size:clamp(17px,2.3vw,28px)}
.ledger td{padding:12px 14px;border-bottom:2px solid #e8eaf6}
.ledger td:last-child{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger tr{opacity:0;transform:translateX(-18px);transition:.4s}
.ledger tr.on{opacity:1;transform:none}
.ledger tr.sum{background:#1a237e;color:#fff}
.ledger tr.sum td{border:0;font-size:clamp(20px,3vw,36px);font-weight:900;padding:16px 14px}
.ledger .lbtn{margin-top:12px;display:flex;gap:10px;justify-content:center}
.ledger .lbtn button{border:0;background:#283593;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(16px,2vw,22px);padding:12px 26px;border-radius:12px;cursor:pointer}

/* 分步 */
.card.kind-step .body p{font-size:clamp(19px,2.6vw,34px)}

/* 加练 */
.drill{padding:6px 22px 18px;text-align:center}
.drill button{border:0;background:#2e7d32;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(18px,2.4vw,28px);padding:14px 34px;border-radius:14px;cursor:pointer}
.drill .ans{margin-top:16px;font-size:clamp(28px,5vw,60px);font-weight:900;color:#1b5e20;
  max-height:0;overflow:hidden;opacity:0;transition:.4s}
.drill .ans.on{max-height:220px;opacity:1}
.drill .ans small{display:block;font-size:clamp(15px,1.9vw,22px);color:#558b2f;margin-top:6px;font-weight:700}

/* 投票 */
.vote{padding:6px 22px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.vote button{border:4px solid #b39ddb;background:#fff;color:#4527a0;font:inherit;font-weight:900;
  font-size:clamp(19px,2.8vw,34px);padding:20px 12px;border-radius:16px;cursor:pointer;transition:.2s}
.vote button:hover{border-color:#7e57c2;background:#ede7f6}
.vote button.picked{border-color:#4527a0;background:#4527a0;color:#fff;transform:scale(1.04)}
.vote-after{padding:0 22px 16px;font-size:clamp(17px,2.2vw,26px);font-weight:800;color:#4527a0;
  max-height:0;overflow:hidden;opacity:0;transition:.4s}
.vote-after.on{max-height:240px;opacity:1}

/* 回看四题 */
.recap{padding:2px 18px 8px;display:grid;gap:5px}
.recap .r{border:3px solid #f8bbd0;background:#fff;border-radius:11px;padding:6px 14px;cursor:pointer;
  display:flex;align-items:center;gap:14px;transition:.25s}
.recap .r:hover{border-color:#ec407a}
.recap .r b{font-size:clamp(18px,2.4vw,30px);color:#880e4f;white-space:nowrap}
.recap .r span{font-size:clamp(16px,2.1vw,27px);color:#ad1457;font-weight:700;
  max-height:0;overflow:hidden;opacity:0;transition:.35s}
.recap .r.on{border-color:#ec407a;background:#fce4ec}
.recap .r.on span{max-height:90px;opacity:1}

/* ── 举手计数 ─────────────────────────── */
.handbox{padding:6px 22px 18px}
.handq{font-size:clamp(20px,2.8vw,34px);font-weight:900;color:#01579b;
  background:#e1f5fe;border:3px solid #4fc3f7;border-radius:14px;padding:16px 20px;margin-bottom:14px}
.counter{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.counter button{border:0;width:64px;height:64px;border-radius:50%;font-size:34px;font-weight:900;
  cursor:pointer;background:#0277bd;color:#fff;line-height:1}
.counter button.minus{background:#90a4ae}
.counter .num{font-size:clamp(52px,10vw,110px);font-weight:900;color:#01579b;
  min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
.counter .unit{font-size:clamp(16px,2vw,24px);color:#0277bd;font-weight:800}
.expect{text-align:center;color:#0288d1;font-weight:800;font-size:clamp(14px,1.8vw,20px);margin-bottom:12px}
.probe{background:#fff8e1;border-left:6px solid #f9a825;border-radius:0 10px 10px 0;padding:14px 16px;margin-top:10px}
.probe b{display:block;font-size:clamp(17px,2.3vw,27px);color:#e65100;margin-bottom:6px}
.probe .pn{font-size:clamp(14px,1.8vw,20px);color:#8d6e63;font-weight:700;
  max-height:0;overflow:hidden;opacity:0;transition:.35s}
.probe.on .pn{max-height:120px;opacity:1;margin-top:6px}
.probe .pbtn{border:0;background:#ef6c00;color:#fff;font:inherit;font-weight:800;
  padding:8px 18px;border-radius:10px;cursor:pointer;font-size:14px;margin-top:8px}

/* ── 三根柱子 ─────────────────────────── */
.tally{padding:10px 22px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;min-height:300px}
.tbar{text-align:center}
.tbar .bar{background:linear-gradient(180deg,#4fc3f7,#0277bd);border-radius:10px 10px 0 0;
  transition:height .8s cubic-bezier(.16,1,.3,1);min-height:6px;position:relative}
.tbar .bn{position:absolute;top:-40px;left:0;right:0;font-size:clamp(26px,4.5vw,54px);
  font-weight:900;color:#01579b}
.tbar .cap{margin-top:10px;font-size:clamp(14px,1.9vw,21px);font-weight:800;color:#3e2723;line-height:1.35}
.tally-note{padding:0 22px 14px;font-size:clamp(15px,2vw,23px);font-weight:800;color:#bf360c;text-align:center}

/* ── 规则四条 ─────────────────────────── */
.rules{padding:6px 22px 18px;display:grid;gap:10px}
.rules .r{display:flex;gap:14px;align-items:flex-start;background:#fff;border:3px solid #ffcc80;
  border-radius:14px;padding:14px 18px}
.rules .r i{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:#bf360c;color:#fff;
  font-style:normal;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
.rules .r b{font-size:clamp(17px,2.3vw,28px);color:#3e2723;display:block}
.rules .r span{font-size:clamp(14px,1.8vw,21px);color:#7a5c4a;font-weight:700}

/* ── 故事流程图 ───────────────────────── */
.story{padding:4px 18px 14px}
.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.actor{border:4px solid #d7c4b0;background:#fff;border-radius:16px;padding:14px 8px;text-align:center;
  font-size:clamp(16px,2.3vw,28px);font-weight:900;color:#3e2723;transition:.35s;position:relative}
.actor.act{border-color:#bf360c;background:#fff3e0;transform:translateY(-6px);
  box-shadow:0 10px 24px rgba(191,54,12,.25)}
.actor.gone{opacity:.3;filter:grayscale(1)}
.flowline{text-align:center;font-size:clamp(17px,2.4vw,30px);font-weight:900;color:#bf360c;
  min-height:2.4em;padding:8px;background:#fff8e1;border-radius:12px;margin-bottom:10px}
.flowline .tok{display:inline-block;background:#2e7d32;color:#fff;border-radius:999px;
  padding:4px 16px;margin:0 8px}
.flowline .tok.fake{background:#c62828;text-decoration:line-through}
.slist{display:grid;gap:6px;margin-bottom:10px}
.slist .s{display:flex;gap:10px;align-items:center;font-size:clamp(14px,1.85vw,21px);
  padding:8px 12px;border-radius:10px;background:#faf6f0;color:#8d6e63;font-weight:700;
  opacity:.35;transition:.3s}
.slist .s.on{opacity:1;background:#fff3e0;color:#3e2723}
.slist .s i{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#bf360c;color:#fff;
  font-style:normal;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.sbtn{display:flex;gap:10px;justify-content:center;margin-top:6px}
.sbtn button{border:0;background:#bf360c;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(15px,2vw,22px);padding:12px 26px;border-radius:12px;cursor:pointer}
.sbtn button.ghost{background:#efebe9;color:#5d4037}

/* ── 两条路 ───────────────────────────── */
.twopath{padding:6px 22px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pathc{border:4px solid #b39ddb;background:#fff;border-radius:16px;padding:18px;text-align:center}
.pathc h4{font-size:clamp(22px,3.4vw,40px);color:#4527a0;margin-bottom:12px}
.pathc .g{font-size:clamp(26px,4.4vw,52px);font-weight:900;color:#2e7d32}
.pathc .c{font-size:clamp(15px,2vw,23px);color:#5d4037;font-weight:800;margin-top:8px}
.pathc .n{font-size:clamp(13px,1.7vw,19px);color:#c62828;font-weight:800;margin-top:10px;
  background:#ffebee;border-radius:10px;padding:8px}

/* ── 作业四格 ─────────────────────────── */
.hw{padding:2px 18px 8px;display:grid;gap:6px}
.hw .f{background:#fff;border:3px solid #a5d6a7;border-radius:11px;padding:6px 15px}
.hw .f b{font-size:clamp(15px,1.95vw,22px);color:#1b5e20;display:block;margin-bottom:1px}
.hw .f span{font-size:clamp(12px,1.55vw,18px);color:#558b2f;font-weight:700}
.hw .chk{background:#e8f5e9;border-left:6px solid #2e7d32;border-radius:0 10px 10px 0;
  padding:14px 16px;font-size:clamp(15px,2vw,23px);font-weight:800;color:#1b5e20}
.hw .why{background:#fff8e1;border-left:6px solid #f9a825;border-radius:0 10px 10px 0;
  padding:12px 16px;font-size:clamp(13px,1.7vw,19px);color:#8d6e63;font-weight:700;margin-top:4px}

.k-guess{background:#fff3e0;color:#e65100}
.k-seven{background:#e3f2fd;color:#0d47a1}
.k-fillinv,.k-fillvou,.k-fillvou2{background:#e8f5e9;color:#1b5e20}
.k-bigmoney{background:#fce4ec;color:#880e4f}
.k-reveal{background:#f3e5f5;color:#4a148c}
.k-match{background:#e0f7fa;color:#006064}
.k-recap{background:#fce4ec;color:#880e4f}
.k-key,.k-end{background:#3e2723;color:#ffcc80}
.stamp.st-guess{background:#e65100;color:#fff}.stamp.st-seven{background:#0d47a1;color:#fff}
.stamp.st-fillinv,.stamp.st-fillvou,.stamp.st-fillvou2{background:#1b5e20;color:#fff}
.stamp.st-bigmoney{background:#880e4f;color:#fff}.stamp.st-reveal{background:#4a148c;color:#fff}
.stamp.st-match{background:#006064;color:#fff}.stamp.st-recap{background:#880e4f;color:#fff}
.stamp.st-key,.stamp.st-end{background:#ffc400;color:#3e2723}

.card.kind-key,.card.kind-end{background:linear-gradient(160deg,#2d1b12,#3e2723 55%,#4e342e);
  border:0!important;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.card.kind-key .head h2,.card.kind-end .head h2{color:#ffd54f;
  font-size:clamp(34px,6.4vw,92px);line-height:1.18;text-align:center;padding:18px 0 6px}
.card.kind-key .body,.card.kind-end .body{text-align:center}
.card.kind-key .body p,.card.kind-end .body p{color:#ffe0b2;font-size:clamp(16px,2.2vw,29px);font-weight:650}

/* 猜猜看 */
.guess{padding:4px 22px 16px}
.guess img{width:100%;max-height:36vh;object-fit:contain;border-radius:12px;border:1px solid #ead9c6;background:#faf6f0}
.guess .gs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.guess .g{border:3px solid #ffcc80;background:#fff;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:.25s}
.guess .g b{display:block;font-size:clamp(15px,2vw,22px);color:#e65100}
.guess .g span{display:block;font-size:clamp(15px,2.1vw,25px);font-weight:900;color:#1b5e20;
  max-height:0;overflow:hidden;opacity:0;transition:.3s;margin-top:6px}
.guess .g.on{border-color:#2e7d32;background:#e8f5e9}
.guess .g.on span{max-height:60px;opacity:1}
.guess .gn{margin-top:10px;background:#fff8e1;border-left:6px solid #f9a825;border-radius:0 10px 10px 0;
  padding:12px 14px;font-size:clamp(14px,1.85vw,21px);color:#8d6e63;font-weight:700}
.gbtn{border:0;background:#e65100;color:#fff;font:inherit;font-weight:900;padding:10px 24px;
  border-radius:12px;cursor:pointer;font-size:clamp(15px,2vw,21px);margin-top:10px}

/* 七要素 */
.seven{padding:6px 22px 16px;display:grid;gap:8px}
.seven .s{display:flex;align-items:center;gap:12px;border:3px solid #bbdefb;background:#fff;
  border-radius:12px;padding:12px 16px;cursor:pointer;transition:.25s}
.seven .s b{flex:0 0 auto;min-width:8.5em;font-size:clamp(15px,2vw,24px);color:#0d47a1}
.seven .s span{font-size:clamp(14px,1.85vw,21px);font-weight:800;
  max-height:0;overflow:hidden;opacity:0;transition:.3s}
.seven .s.on{border-color:#c62828;background:#ffebee}
.seven .s.on span{max-height:60px;opacity:1;color:#c62828}
.seven .s.on.half{border-color:#ef6c00;background:#fff3e0}
.seven .s.on.half span{color:#e65100}
.seven-sum{margin-top:10px;text-align:center;font-size:clamp(17px,2.4vw,30px);font-weight:900;color:#c62828;
  max-height:0;overflow:hidden;opacity:0;transition:.4s}
.seven-sum.on{max-height:80px;opacity:1}

/* 填单表格 */
.fillbox{padding:4px 18px 16px}
.fillbox .biz{background:#e8f5e9;border-left:6px solid #2e7d32;border-radius:0 10px 10px 0;
  padding:7px 16px;font-size:clamp(15px,2vw,23px);font-weight:800;color:#1b5e20;margin-bottom:12px}
.ftab{width:100%;border-collapse:collapse;font-size:clamp(13px,1.5vw,18px)}
.ftab th,.ftab td{border:2px solid #c8b8a6;padding:3px 8px}
.ftab th{background:#efe4d6;color:#3e2723;font-weight:800;white-space:nowrap;width:9em}
.ftab input,.ftab select{width:100%;font:inherit;font-size:inherit;font-weight:800;padding:4px 8px;
  border:2px solid #d7c4b0;border-radius:8px;background:#fffdf8;color:#22170f}
.ftab input.ok,.ftab select.ok{border-color:#2e7d32;background:#e8f5e9}
.ftab input.no,.ftab select.no{border-color:#c62828;background:#ffebee}
.ftab .hintline{font-size:.78em;color:#8d6e63;font-weight:700;margin-top:1px;display:none}
.ftab .no ~ .hintline{display:block}
.fbtn{display:flex;gap:10px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.fbtn button{border:0;background:#2e7d32;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(15px,2vw,22px);padding:12px 28px;border-radius:12px;cursor:pointer}
.fbtn button.ghost{background:#efebe9;color:#5d4037}
.fmsg{margin-top:12px;text-align:center;font-size:clamp(16px,2.3vw,28px);font-weight:900;min-height:1.5em}
.fmsg.good{color:#1b5e20}.fmsg.bad{color:#c62828}
.balance{margin-top:10px;text-align:center;font-size:clamp(15px,2vw,24px);font-weight:900;
  padding:6px;border-radius:10px;background:#efe4d6;color:#5d4037}
.balance.ok{background:#e8f5e9;color:#1b5e20}
.balance.no{background:#ffebee;color:#c62828}

/* 大写金额 */
.bigm{padding:6px 22px 16px;display:grid;gap:10px}
.bigm .b{border:3px solid #f8bbd0;background:#fff;border-radius:14px;padding:14px 18px}
.bigm .b .sm{font-size:clamp(20px,3vw,38px);font-weight:900;color:#880e4f;font-variant-numeric:tabular-nums}
.bigm .b .bg{font-size:clamp(17px,2.4vw,30px);font-weight:900;color:#1b5e20;margin-top:8px;
  max-height:0;overflow:hidden;opacity:0;transition:.35s}
.bigm .b.on .bg{max-height:80px;opacity:1}
.bigm .b button{border:0;background:#ad1457;color:#fff;font:inherit;font-weight:800;
  padding:8px 20px;border-radius:10px;cursor:pointer;font-size:14px;margin-top:8px}

/* 揭示答案 */
.reveal{padding:6px 22px 16px;display:grid;gap:10px}
.reveal .r{border:3px solid #ce93d8;background:#fff;border-radius:14px;padding:14px 18px;cursor:pointer;transition:.25s}
.reveal .r b{font-size:clamp(17px,2.4vw,29px);color:#4a148c;display:block}
.reveal .r span{font-size:clamp(14px,1.85vw,21px);color:#6a1b9a;font-weight:700;
  max-height:0;overflow:hidden;opacity:0;transition:.35s;display:block}
.reveal .r.on{border-color:#7b1fa2;background:#f3e5f5}
.reveal .r.on span{max-height:90px;opacity:1;margin-top:6px}

/* 连线 */
.match{padding:6px 22px 16px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:10px}
.mleft{border:3px solid #80deea;background:#fff;border-radius:12px;padding:14px 18px;
  font-size:clamp(15px,2.1vw,25px);font-weight:800;color:#006064}
.mpick{display:flex;gap:8px;flex-wrap:wrap}
.mpick button{border:3px solid #b2ebf2;background:#fff;color:#006064;font:inherit;font-weight:800;
  font-size:clamp(13px,1.7vw,19px);padding:10px 16px;border-radius:10px;cursor:pointer}
.mpick button.ok{border-color:#2e7d32;background:#2e7d32;color:#fff}
.mpick button.no{border-color:#c62828;background:#ffebee;color:#c62828}

/* 回看 */
.recap{padding:2px 18px 8px;display:grid;gap:5px}
.recap .r{border:3px solid #f8bbd0;background:#fff;border-radius:11px;padding:6px 14px;cursor:pointer;transition:.25s}
.recap .r b{font-size:clamp(17px,2.3vw,28px);color:#880e4f;display:block}
.recap .r span{font-size:clamp(14px,1.9vw,22px);color:#ad1457;font-weight:700;
  max-height:0;overflow:hidden;opacity:0;transition:.35s;display:block}
.recap .r.on{border-color:#ec407a;background:#fce4ec}
.recap .r.on span{max-height:90px;opacity:1;margin-top:6px}


/* ── 项目五专用 ───────────────────────── */
.k-sect{background:#3e2723;color:#ffcc80}.stamp.st-sect{background:#ffc400;color:#3e2723}
.k-entry{background:#e8eaf6;color:#283593}.stamp.st-entry{background:#283593;color:#fff}
.k-buckets{background:#e0f2f1;color:#00695c}.stamp.st-buckets{background:#00695c;color:#fff}
.k-sortbin{background:#fff3e0;color:#e65100}.stamp.st-sortbin{background:#e65100;color:#fff}
.k-calc{background:#ede7f6;color:#4527a0}.stamp.st-calc{background:#4527a0;color:#fff}
.k-drill2{background:#e8f5e9;color:#1b5e20}.stamp.st-drill2{background:#1b5e20;color:#fff}
.k-errfind{background:#ffebee;color:#b71c1c}.stamp.st-errfind{background:#c62828;color:#fff}
.k-teacher{background:#efebe9;color:#5d4037}.stamp.st-teacher{background:#5d4037;color:#fff}
.card.kind-sect{background:linear-gradient(160deg,#2d1b12,#3e2723 55%,#4e342e);border:0!important}
.card.kind-sect .head h2{color:#ffd54f;font-size:clamp(30px,5.2vw,70px);text-align:center;padding:14px 0 4px}
.card.kind-sect .body{text-align:center}
.card.kind-sect .body p{color:#ffe0b2;font-size:clamp(16px,2.1vw,27px);font-weight:650}
.card.kind-sect .badge{margin-left:22px}

/* 分录卡 */
.entrybox{padding:2px 18px 10px}
.entrybox .biz{background:#e8eaf6;border-left:6px solid #283593;border-radius:0 10px 10px 0;
  padding:7px 14px;font-size:clamp(15px,1.95vw,23px);font-weight:800;color:#1a237e;margin-bottom:8px}
.jtab{width:100%;border-collapse:collapse;font-size:clamp(15px,2vw,25px);margin-bottom:6px}
.jtab td{padding:5px 10px;border-bottom:1px dashed #c5cae9}
.jtab td.dc{width:3.2em;font-weight:900;color:#283593}
.jtab td.sub{width:3.2em}
.jtab td.amt{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.jtab tr.cr td.acc{padding-left:2.6em}
.jtab tr{opacity:0;transform:translateX(-14px);transition:.38s}
.jtab tr.on{opacity:1;transform:none}
.entrybox .note{background:#fff8e1;border-left:5px solid #f9a825;border-radius:0 8px 8px 0;
  padding:6px 12px;font-size:clamp(13px,1.65vw,19px);color:#8d6e63;font-weight:700;
  max-height:0;overflow:hidden;opacity:0;transition:.35s;padding-top:0;padding-bottom:0}
.entrybox .note.on{max-height:90px;opacity:1;padding-top:6px;padding-bottom:6px}
.ebtn{display:flex;gap:9px;justify-content:center;margin-top:6px}
.ebtn button{border:0;background:#283593;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(14px,1.8vw,20px);padding:9px 22px;border-radius:11px;cursor:pointer}
.ebtn button.ghost{background:#efebe9;color:#3e2723}

/* 三个桶 */
.buckets{padding:2px 18px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bk{border:4px solid #b2dfdb;background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;transition:.25s}
.bk:hover{border-color:#00897b}
.bk b{display:block;font-size:clamp(16px,2.1vw,26px);color:#00695c;text-align:center;margin-bottom:4px}
.bk .d{font-size:clamp(12px,1.5vw,17px);color:#00695c;font-weight:700;
  max-height:0;overflow:hidden;opacity:0;transition:.35s}
.bk .t{font-size:clamp(12px,1.45vw,16px);color:#00838f;font-weight:800;margin-top:5px;
  max-height:0;overflow:hidden;opacity:0;transition:.35s}
.bk.on{border-color:#00897b;background:#e0f2f1}
.bk.on .d,.bk.on .t{max-height:200px;opacity:1}

/* 分桶练习 */
.sortbin{padding:2px 18px 10px}
.sbitems{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px;min-height:44px}
.sbi{background:#e65100;color:#fff;padding:7px 14px;border-radius:999px;font-weight:800;
  font-size:clamp(13px,1.65vw,19px);cursor:pointer;transition:.2s}
.sbi.sel{background:#3e2723;transform:scale(1.05)}
.sbi.done{opacity:.32;cursor:default}
.sbbins{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.sbb{min-height:96px;border:3px dashed #ffb74d;border-radius:13px;padding:7px;background:#fffdf8;cursor:pointer}
.sbb h4{font-size:clamp(14px,1.8vw,21px);text-align:center;color:#e65100;margin-bottom:5px}
.sbb .in{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.sbb .in span{background:#ffe0b2;color:#5d4037;border-radius:999px;padding:4px 11px;
  font-size:clamp(11px,1.35vw,15px);font-weight:800}
.sbb .in span.no{background:#ffcdd2;color:#b71c1c;text-decoration:line-through}
.sbmsg{text-align:center;font-weight:900;margin-top:8px;font-size:clamp(15px,1.95vw,23px);color:#e65100;min-height:1.3em}

/* 算一算 */
.calc{padding:2px 18px 10px}
.calc table{width:100%;border-collapse:collapse;font-size:clamp(15px,2vw,25px)}
.calc td{padding:7px 12px;border-bottom:2px solid #ede7f6}
.calc td:last-child{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;color:#4527a0}
.calc tr{opacity:0;transform:translateX(-14px);transition:.38s}
.calc tr.on{opacity:1;transform:none}
.calc tr:last-child{background:#4527a0}
.calc tr:last-child td{color:#fff;font-weight:900;border:0}
.cbtn{display:flex;gap:9px;justify-content:center;margin-top:8px}
.cbtn button{border:0;background:#4527a0;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(14px,1.8vw,20px);padding:9px 22px;border-radius:11px;cursor:pointer}
.cbtn button.ghost{background:#efebe9;color:#3e2723}

/* 自己写一笔 */
.drill2{padding:2px 18px 10px;text-align:center}
.drill2 button{border:0;background:#2e7d32;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(16px,2.1vw,24px);padding:11px 30px;border-radius:13px;cursor:pointer}
.drill2 .ans{margin-top:10px;max-height:0;overflow:hidden;opacity:0;transition:.4s}
.drill2 .ans.on{max-height:420px;opacity:1}
.drill2 .ans table{width:100%;border-collapse:collapse;font-size:clamp(15px,2vw,24px)}
.drill2 .ans td{padding:5px 10px;border-bottom:1px dashed #a5d6a7}
.drill2 .ans td.dc{width:3.2em;font-weight:900;color:#1b5e20}
.drill2 .ans td.amt{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.drill2 .ans tr.cr td.acc{padding-left:2.6em}
.drill2 .tip{margin-top:7px;background:#fff8e1;border-left:5px solid #f9a825;border-radius:0 8px 8px 0;
  padding:7px 12px;font-size:clamp(13px,1.65vw,19px);color:#8d6e63;font-weight:700;text-align:left}

/* 找茬 */
.errfind{padding:2px 18px 6px;display:grid;gap:6px}
.ef{border:3px solid #ffcdd2;background:#fff;border-radius:11px;padding:5px 11px}
.ef .biz{font-size:clamp(14px,1.8vw,21px);font-weight:800;color:#b71c1c;margin-bottom:5px}
.ef table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.7vw,20px)}
.ef td{padding:2px 9px;border-bottom:1px dashed #ffcdd2;cursor:pointer}
.ef td.dc{width:3.2em;font-weight:900}
.ef td.amt{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.ef tr.cr td.acc{padding-left:2.4em}
.ef tr.hit{background:#ffebee}
.ef tr.right{background:#e8f5e9}
.ef .why{margin-top:5px;background:#fff8e1;border-left:5px solid #f9a825;border-radius:0 8px 8px 0;
  padding:6px 11px;font-size:clamp(12px,1.55vw,18px);color:#8d6e63;font-weight:700;
  max-height:0;overflow:hidden;opacity:0;transition:.35s;padding-top:0;padding-bottom:0}
.ef .why.on{max-height:120px;opacity:1;padding-top:6px;padding-bottom:6px}
.ef .miss{text-align:center;font-size:clamp(13px,1.7vw,20px);font-weight:800;color:#c62828;
  padding:5px;cursor:pointer;border:2px dashed #ef9a9a;border-radius:9px;margin-top:4px}


/* 自己填分录 */
.k-fillentry{background:#e8f5e9;color:#1b5e20}.stamp.st-fillentry{background:#1b5e20;color:#fff}
.fe2{padding:2px 18px 8px}
.fe2 .biz{background:#e8f5e9;border-left:6px solid #2e7d32;border-radius:0 10px 10px 0;
  padding:4px 13px;font-size:clamp(14px,1.85vw,21px);font-weight:800;color:#1b5e20;margin-bottom:7px}
.fe2 table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.7vw,20px)}
.fe2 td{padding:2px 6px;border-bottom:1px dashed #c8e6c9}
.fe2 td.dc{width:4.6em}
.fe2 select,.fe2 input{width:100%;font:inherit;font-size:inherit;font-weight:800;
  padding:4px 8px;border:2px solid #c8b8a6;border-radius:8px;background:#fffdf8;color:#3e2723}
.fe2 td.amt{width:9em}
.fe2 td.amt input{text-align:right}
.fe2 select.ok,.fe2 input.ok{border-color:#2e7d32;background:#e8f5e9}
.fe2 select.no,.fe2 input.no{border-color:#c62828;background:#ffebee}
.fe2 .bal{text-align:center;font-weight:900;margin-top:6px;padding:5px;border-radius:9px;
  font-size:clamp(14px,1.8vw,21px);background:#eceff1;color:#546e7a}
.fe2 .bal.ok{background:#e8f5e9;color:#1b5e20}
.fe2 .bal.no{background:#ffebee;color:#b71c1c}
.fe2 .fbtn2{display:flex;gap:9px;justify-content:center;margin-top:7px}
.fe2 .fbtn2 button{border:0;background:#2e7d32;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(14px,1.8vw,20px);padding:9px 24px;border-radius:11px;cursor:pointer}
.fe2 .fbtn2 button.ghost{background:#efebe9;color:#3e2723}
.fe2 .msg{text-align:center;font-weight:900;margin-top:6px;min-height:1.3em;
  font-size:clamp(14px,1.8vw,21px);color:#1b5e20}
.fe2 .tip{margin-top:6px;background:#fff8e1;border-left:5px solid #f9a825;border-radius:0 8px 8px 0;
  padding:6px 11px;font-size:clamp(12px,1.55vw,18px);color:#8d6e63;font-weight:700;
  max-height:0;overflow:hidden;opacity:0;transition:.35s;padding-top:0;padding-bottom:0}
.fe2 .tip.on{max-height:120px;opacity:1;padding-top:6px;padding-bottom:6px}


/* ── 项目六专用 ───────────────────────── */
.k-dialog{background:#e3f2fd;color:#0d47a1}.stamp.st-dialog{background:#0d47a1;color:#fff}
.k-reveal2{background:#fff3e0;color:#e65100}.stamp.st-reveal2{background:#e65100;color:#fff}
.k-findlist{background:#fce4ec;color:#880e4f}.stamp.st-findlist{background:#880e4f;color:#fff}
.k-tool{background:#e8f5e9;color:#1b5e20}.stamp.st-tool{background:#1b5e20;color:#fff}
.k-compare{background:#ede7f6;color:#4527a0}.stamp.st-compare{background:#4527a0;color:#fff}
.k-fillentry2{background:#e8f5e9;color:#1b5e20}.stamp.st-fillentry2{background:#1b5e20;color:#fff}
.k-twopic{background:#e0f7fa;color:#006064}.stamp.st-twopic{background:#006064;color:#fff}

/* 台词逐句 */
.dialog{padding:2px 18px 8px;display:grid;gap:5px}
.dl{display:flex;gap:10px;align-items:flex-start;padding:7px 12px;border-radius:11px;
  background:#f5f5f5;opacity:0;transform:translateX(-14px);transition:.38s}
.dl.on{opacity:1;transform:none}
.dl b{flex:0 0 auto;min-width:4.2em;font-size:clamp(13px,1.7vw,20px);font-weight:900}
.dl p{font-size:clamp(14px,1.85vw,22px);font-weight:700;line-height:1.4;margin:0}
.dl.who0{background:#eceff1}.dl.who0 b{color:#546e7a}
.dl.who1{background:#fff3e0}.dl.who1 b{color:#e65100}
.dl.who2{background:#e3f2fd}.dl.who2 b{color:#0d47a1}
.dl.who3{background:#f3e5f5}.dl.who3 b{color:#6a1b9a}
.dl.star{box-shadow:inset 4px 0 0 #ffc400}
.dbtn{display:flex;gap:9px;justify-content:center;margin-top:7px}
.dbtn button{border:0;background:#0d47a1;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(14px,1.8vw,20px);padding:9px 24px;border-radius:11px;cursor:pointer}
.dbtn button.ghost{background:#efebe9;color:#3e2723}

/* 公布答案 */
.reveal2{padding:4px 18px 10px;text-align:center}
.reveal2 button{border:0;background:#e65100;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(16px,2.2vw,26px);padding:13px 34px;border-radius:14px;cursor:pointer}
.reveal2 .rv{margin-top:12px;max-height:0;overflow:hidden;opacity:0;transition:.42s;
  font-size:clamp(16px,2.15vw,27px);font-weight:800;color:#3e2723;line-height:1.5;
  background:#fff8e1;border-radius:12px;padding:0 16px}
.reveal2 .rv.on{max-height:340px;opacity:1;padding:14px 16px}

/* 逐条列表 */
.findlist{padding:2px 18px 8px;display:grid;gap:6px}
.fl{border:3px solid #f8bbd0;background:#fff;border-radius:12px;padding:7px 14px;
  opacity:0;transform:translateY(10px);transition:.38s}
.fl.on{opacity:1;transform:none}
.fl b{display:block;font-size:clamp(15px,2vw,24px);color:#880e4f}
.fl span{font-size:clamp(13px,1.65vw,19px);color:#ad1457;font-weight:700}
.flbtn{display:flex;gap:9px;justify-content:center;margin-top:7px}
.flbtn button{border:0;background:#880e4f;color:#fff;font:inherit;font-weight:900;
  font-size:clamp(14px,1.8vw,20px);padding:9px 24px;border-radius:11px;cursor:pointer}
.flbtn button.ghost{background:#efebe9;color:#3e2723}

/* 打开工具 */
.tool{padding:6px 18px 12px;text-align:center}
.tool a{display:inline-block;background:#1b5e20;color:#fff;text-decoration:none;
  font-size:clamp(17px,2.3vw,28px);font-weight:900;padding:15px 40px;border-radius:14px;
  box-shadow:0 6px 18px rgba(27,94,32,.3)}
.tool a:hover{filter:brightness(1.1)}

/* 两栏对比 */
.compare{padding:2px 18px 10px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp{border:4px solid #b39ddb;background:#fff;border-radius:14px;padding:12px;text-align:center}
.cmp h4{font-size:clamp(16px,2.1vw,26px);color:#4527a0;margin-bottom:6px}
.cmp .big{font-size:clamp(22px,3.4vw,44px);font-weight:900;color:#2e7d32;margin-bottom:6px}
.cmp p{font-size:clamp(13px,1.7vw,20px);color:#5d4037;font-weight:700;line-height:1.4;margin:0}

/* 并排两图 */
.twopic{padding:2px 18px 10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twopic img{width:100%;max-height:46vh;object-fit:contain;border-radius:10px;
  border:1px solid #ead9c6;background:#faf6f0;cursor:zoom-in}


/* ── 项目七：银行余额调节表 ─────────────── */
.k-adjust{background:#e1f5fe;color:#01579b}.stamp.st-adjust{background:#0277bd;color:#fff}
.adj{padding:2px 16px 8px}
.adjhead{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:7px}
.adjhead div{background:#e1f5fe;border-radius:10px;padding:6px 10px;text-align:center;
  font-size:clamp(13px,1.7vw,20px);font-weight:900;color:#01579b}
.adjhead div b{display:block;font-size:clamp(17px,2.3vw,28px);color:#0d47a1}
.adjrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  border-bottom:1px dashed #b3e5fc;padding:4px 0}
.adjrow .t{font-size:clamp(12px,1.55vw,18px);font-weight:700;color:#37474f;line-height:1.35}
.adjbtns{display:flex;gap:4px;flex-shrink:0}
.adjbtns button{border:2px solid #b3e5fc;background:#fff;color:#0277bd;font:inherit;
  font-weight:900;font-size:clamp(11px,1.35vw,15px);padding:4px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
.adjbtns button:hover{border-color:#0288d1;background:#e1f5fe}
.adjbtns button.picked{background:#0277bd;color:#fff;border-color:#0277bd}
.adjbtns button.good{background:#2e7d32;color:#fff;border-color:#2e7d32}
.adjbtns button.bad{background:#c62828;color:#fff;border-color:#c62828}
.adjwhy{font-size:clamp(11px,1.4vw,16px);color:#8d6e63;font-weight:700;
  background:#fff8e1;border-left:4px solid #f9a825;border-radius:0 7px 7px 0;
  max-height:0;overflow:hidden;opacity:0;transition:.3s;padding:0 9px;margin-top:3px}
.adjwhy.on{max-height:70px;opacity:1;padding:5px 9px}
.adjsum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.adjsum div{border-radius:10px;padding:7px;text-align:center;font-weight:900;
  font-size:clamp(14px,1.85vw,22px);background:#eceff1;color:#546e7a}
.adjsum div.ok{background:#e8f5e9;color:#1b5e20}
.adjmsg{text-align:center;font-weight:900;margin-top:7px;min-height:1.3em;
  font-size:clamp(14px,1.8vw,21px);color:#0277bd}


/* 投影自适应：内容超出一屏时整体缩放，保证一眼看全 */
#card{transform-origin:top center}
.main{scrollbar-width:none}
.main::-webkit-scrollbar{width:0}

function fitCard(){
  const card=document.getElementById("card"), main=document.getElementById("main");
  if(!card||!main) return;
  main.style.zoom="";
  const cs=getComputedStyle(main);
  const pad=parseFloat(cs.paddingTop||0)+parseFloat(cs.paddingBottom||0);
  const avail=main.clientHeight-pad;
  const h=card.getBoundingClientRect().height;
  if(h>avail && avail>60){
    main.style.zoom=Math.max(0.55, avail/h);
  }
}

        const good=ok(el.value||""); el.classList.toggle("ok",good); el.classList.toggle("no",!good); if(!good)bad++;});
      const m=$("vMsg"); m.className="fmsg "+(bad?"bad":"good");
      m.textContent=bad?`还有 ${bad} 处不对——红框下面有提示`:"七项全对，借贷也平。这张凭证可以入账了。";
      bal();
    };
    $("vClr").onclick=()=>{["v1","v2","v3","v4","v5","v6","v7"].forEach(id=>{
      const e=$(id); if(e){e.value=e.tagName==="SELECT"?"":"";e.className="";}});
      $("vMsg").textContent=""; bal();};
    bal();
  }

  // 举手计数（存到 sessionStorage，供「数一数」页汇总）
  const hNum=$("hNum");
  if(hNum && s.hand){
    const key="hand"+s.hand.idx;
    let v=+(sessionStorage.getItem(key)||0); hNum.textContent=v;
    const set=n=>{v=Math.max(0,n); hNum.textContent=v; sessionStorage.setItem(key,v);};
    $("hPlus").onclick=()=>set(v+1);
    $("hMinus").onclick=()=>set(v-1);
    const pb=$("pBtn");
    if(pb) pb.onclick=()=>{ $("probe").classList.add("on"); pb.style.display="none"; };
  }
  // 三根柱子
  const tw=$("tally");
  if(tw){
    const caps=["上个月花了多少<br>说得出数","AA 时<br>自己算过账","AA 算完<br>被人说过「不对吧」"];
    const vals=[0,1,2].map(k=>+(sessionStorage.getItem("hand"+k)||0));
    const mx=Math.max(...vals,1);
    tw.innerHTML=vals.map((v,k)=>
      `<div class="tbar"><div class="bar" style="height:0"><span class="bn">${v}</span></div>
       <div class="cap">${caps[k]}</div></div>`).join("");
    requestAnimationFrame(()=>{
      [...tw.querySelectorAll(".bar")].forEach((b,k)=>{ b.style.height=Math.round(vals[k]/mx*230+6)+"px"; });
    });
    const tn=$("tnote");
    if(tn) tn.innerHTML = vals.every(v=>v===0)
      ? "（还没数。回到前三页点＋号记录人数，这里会自动出图。）"
      : "第一根最矮，第二根最高——花自己的钱不上心，算别人的钱特别认真。";
  }
  // 故事流程
  const sNext=$("sNext");
  if(sNext && s.story){
    const st=s.story; let k=0;
    const acts=[...card.querySelectorAll(".actor")], rows=[...card.querySelectorAll(".slist .s")];
    const fl=$("fline");
    const draw=()=>{
      acts.forEach(a=>a.classList.remove("act","gone"));
      rows.forEach((r,j)=>r.classList.toggle("on",j<k));
      if(k===0){ fl.textContent="点「下一步」开始"; return; }
      const x=st.steps[k-1];
      acts[x.from]?.classList.add("act"); acts[x.to]?.classList.add("act");
      fl.innerHTML=`${esc(st.actors[x.from])} <span class="tok${x.fake?" fake":""}">${esc(x.what)}</span> → ${esc(st.actors[x.to])}`;
    };
    sNext.onclick=()=>{ if(k<st.steps.length){k++;draw();} else {
      acts.forEach((a,j)=>{ if(j===2) a.classList.add("gone"); });
      fl.innerHTML='<span style="color:#2e7d32">隔壁一进一出正好抵消——可以整个划掉</span>'; } };
    const sr=$("sReset"); if(sr) sr.onclick=()=>{k=0;draw();};
    draw();
  }

  card.querySelectorAll(".hand-item").forEach(el=>el.onclick=()=>el.classList.toggle("on"));
  card.querySelectorAll(".recap .r").forEach(el=>el.onclick=()=>el.classList.toggle("on"));
  const cAdd=$("cAdd"), cIn=$("cIn"), cWrap=$("cWrap");
  if(cAdd&&cIn&&cWrap){
    const push=()=>{const v=cIn.value.trim(); if(!v)return;
      const d=document.createElement("span"); d.className="c2"; d.textContent=v; cWrap.appendChild(d);
      cIn.value=""; cIn.focus();};
    cAdd.onclick=push; cIn.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();push();}};
  }
  const lNext=$("lNext"), lAll=$("lAll");
  if(lNext){
    const rows=[...card.querySelectorAll(".ledger tr")]; let shown=0;
    const step=()=>{ if(shown<rows.length){rows[shown].classList.add("on");shown++;} };
    lNext.onclick=step;
    if(lAll) lAll.onclick=()=>{rows.forEach(r=>r.classList.add("on"));shown=rows.length;};
    step();
  }
  const dShow=$("dShow");
  if(dShow) dShow.onclick=()=>{const a=$("dAns"); if(a){a.classList.add("on"); dShow.style.display="none";}};
  card.querySelectorAll(".vote button").forEach(b=>b.onclick=()=>{
    card.querySelectorAll(".vote button").forEach(x=>x.classList.remove("picked"));
    b.classList.add("picked");
    const af=$("vAfter"); if(af) af.classList.add("on");
  });
  // 分录逐笔
  const eNext=$("eNext");
  if(eNext){
    const rows=[...card.querySelectorAll(".jtab tr")];
    const notes=[...card.querySelectorAll(".entrybox .note")];
    let k=0;
    const step=()=>{ if(k<rows.length){ rows[k].classList.add("on"); k++;
        const box=rows[k-1].closest(".entrybox");
        const left=[...box.querySelectorAll(".jtab tr")].filter(r=>!r.classList.contains("on")).length;
        if(!left) box.querySelector(".note").classList.add("on");
      }};
    eNext.onclick=step;
    const eAll=$("eAll");
    if(eAll) eAll.onclick=()=>{rows.forEach(r=>r.classList.add("on"));notes.forEach(n=>n.classList.add("on"));k=rows.length;};
    step();
  }
  // 三个桶
  card.querySelectorAll(".bk").forEach(el=>el.onclick=()=>el.classList.toggle("on"));
  // 分桶练习
  if(s.sortbin){
    const sb=s.sortbin; let sel=null, done=0;
    const msg=$("sbMsg");
    card.querySelectorAll(".sbi").forEach(el=>el.onclick=()=>{
      if(el.classList.contains("done"))return;
      card.querySelectorAll(".sbi").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel"); sel=+el.dataset.i;
      msg.textContent="再点一个桶";
    });
    card.querySelectorAll(".sbb").forEach(bin=>bin.onclick=()=>{
      if(sel===null){ msg.textContent="先点一笔支出"; return; }
      const b=+bin.dataset.b, it=sb.items[sel], ok=(it[1]===b);
      const chip=document.createElement("span");
      chip.textContent=it[0]; if(!ok) chip.classList.add("no");
      bin.querySelector(".in").appendChild(chip);
      const src2=card.querySelector(`.sbi[data-i="${sel}"]`);
      src2.classList.add("done"); src2.classList.remove("sel");
      done++; sel=null;
      msg.textContent = ok ? "对了。继续。" : `不对——「${it[0]}」应该进「${sb.bins[it[1]]}」`;
      if(done===sb.items.length) msg.textContent="六笔都分完了。红色划掉的是分错的。";
    });
  }
  // 算一算
  const cNext=$("cNext");
  if(cNext){
    const rows=[...card.querySelectorAll(".calc tr")]; let k=0;
    const step=()=>{ if(k<rows.length){rows[k].classList.add("on");k++;} };
    cNext.onclick=step;
    const cAll=$("cAll"); if(cAll) cAll.onclick=()=>{rows.forEach(r=>r.classList.add("on"));k=rows.length;};
    step();
  }
  // 自己写一笔
  const aShow=$("aShow");
  if(aShow) aShow.onclick=()=>{const a=$("aAns"); if(a){a.classList.add("on"); aShow.style.display="none";}};
  // 找茬
  if(s.errfind){
    card.querySelectorAll(".ef").forEach((box,fi)=>{
      const e=s.errfind[fi];
      const reveal=()=>box.querySelector(".why").classList.add("on");
      box.querySelectorAll("tbody tr, table tr").forEach(tr=>{
        tr.onclick=()=>{
          const ri=+tr.dataset.r;
          if(e.bad===ri){ tr.classList.add("hit"); reveal(); }
          else { tr.classList.add("right"); }
        };
      });
      const miss=box.querySelector(".miss");
      if(miss) miss.onclick=()=>{ miss.style.background="#ffebee"; reveal(); };
    });
  }
  // 自己填分录
  if(s.fillentry){
    const fe=s.fillentry, N=fe.rows.length;
    const num=v=>+String(v||"").replace(/[,，\s元]/g,"");
    const bal=()=>{
      let dr=0,cr=0;
      for(let k=0;k<N;k++){
        const dc=$("d"+k).value, m=num($("m"+k).value);
        if(dc==="借") dr+=m; else if(dc==="贷") cr+=m;
      }
      const b=$("feBal");
      if(!dr&&!cr){ b.className="bal"; b.textContent="借贷还没填"; return; }
      const ok=dr===cr&&dr>0;
      b.className="bal "+(ok?"ok":"no");
      b.textContent=ok?`借 ${dr} ＝ 贷 ${cr}　平了`:`借 ${dr}　贷 ${cr}　不平`;
    };
    for(let k=0;k<N;k++){
      ["d","s","m"].forEach(p=>{const e=$(p+k); if(e) e.oninput=bal;});
    }
    $("feChk").onclick=()=>{
      let wrong=0;
      for(let k=0;k<N;k++){
        const [wd,ws,wm]=fe.rows[k];
        const ed=$("d"+k), es=$("s"+k), em=$("m"+k);
        [[ed,ed.value===wd],[es,es.value===ws],[em,num(em.value)===num(wm)]].forEach(([el,good])=>{
          el.classList.remove("ok","no"); el.classList.add(good?"ok":"no"); if(!good) wrong++;
        });
      }
      const msg=$("feMsg");
      if(wrong===0){ msg.style.color="#1b5e20"; msg.textContent="全对。这笔分录可以入账了。"; }
      else { msg.style.color="#c62828"; msg.textContent=`还有 ${wrong} 处不对——红框的地方再想想`; }
      $("feTip").classList.add("on");
    };
    $("feClr").onclick=()=>{
      for(let k=0;k<N;k++) ["d","s","m"].forEach(p=>{
        const e=$(p+k); if(e){ e.value=""; e.classList.remove("ok","no"); }});
      $("feMsg").textContent=""; $("feTip").classList.remove("on"); bal();
    };
  }
  // 台词逐句
  const dNext=$("dNext");
  if(dNext){
    const ls=[...card.querySelectorAll(".dl")]; let k=0;
    const step=()=>{ if(k<ls.length){ls[k].classList.add("on");k++;} };
    dNext.onclick=step;
    const dAll=$("dAll"); if(dAll) dAll.onclick=()=>{ls.forEach(x=>x.classList.add("on"));k=ls.length;};
    step();
  }
  // 公布答案
  const r2=$("r2Btn");
  if(r2) r2.onclick=()=>{const bx=$("r2Box"); if(bx){bx.classList.add("on"); r2.style.display="none";}};
  // 逐条列表
  const flNext=$("flNext");
  if(flNext){
    const ls=[...card.querySelectorAll(".fl")]; let k=0;
    const step=()=>{ if(k<ls.length){ls[k].classList.add("on");k++;} };
    flNext.onclick=step;
    const flAll=$("flAll"); if(flAll) flAll.onclick=()=>{ls.forEach(x=>x.classList.add("on"));k=ls.length;};
    step();
  }
  // 自己填（项目六版）
  if(s.fillentry2){
    const fe=s.fillentry2, N=fe.rows.length;
    const num=v=>+String(v||"").replace(/[,，\s元]/g,"");
    const bal=()=>{ let dr=0,cr=0;
      for(let k=0;k<N;k++){const dc=$("d"+k).value,m=num($("m"+k).value);
        if(dc==="借")dr+=m; else if(dc==="贷")cr+=m;}
      const b2=$("feBal");
      if(!dr&&!cr){b2.className="bal";b2.textContent="借贷还没填";return;}
      const ok=dr===cr&&dr>0; b2.className="bal "+(ok?"ok":"no");
      b2.textContent=ok?`借 ${dr} ＝ 贷 ${cr}　平了`:`借 ${dr}　贷 ${cr}　不平`;
    };
    for(let k=0;k<N;k++) ["d","s","m"].forEach(p=>{const e=$(p+k); if(e) e.oninput=bal;});
    $("feChk").onclick=()=>{
      let wrong=0;
      for(let k=0;k<N;k++){
        const [wd,ws,wm]=fe.rows[k];
        [[$("d"+k),$("d"+k).value===wd],[$("s"+k),$("s"+k).value===ws],
         [$("m"+k),num($("m"+k).value)===num(wm)]].forEach(([el,g])=>{
          el.classList.remove("ok","no"); el.classList.add(g?"ok":"no"); if(!g) wrong++;});
      }
      const msg=$("feMsg");
      if(!wrong){msg.style.color="#1b5e20";msg.textContent="全对。这一笔补登对了。";}
      else{msg.style.color="#c62828";msg.textContent=`还有 ${wrong} 处不对——红框的地方再想想`;}
      $("feTip").classList.add("on");
    };
    $("feClr").onclick=()=>{
      for(let k=0;k<N;k++) ["d","s","m"].forEach(p=>{const e=$(p+k); if(e){e.value="";e.classList.remove("ok","no");}});
      $("feMsg").textContent=""; $("feTip").classList.remove("on"); bal();
    };
  }
  // 银行余额调节表
  if(s.adjust){
    const aj=s.adjust, N=aj.items.length;
    let f=+aj.base[2], bk=+aj.base[3], done=0;
    const fmt=n=>n.toLocaleString("en-US");
    const upd=()=>{
      $("ajFS").textContent="企业调节后 "+fmt(f);
      $("ajBS").textContent="银行调节后 "+fmt(bk);
      const hit=(f===+aj.target&&bk===+aj.target);
      $("ajFS").className=hit?"ok":""; $("ajBS").className=hit?"ok":"";
      if(done===N){
        $("ajMsg").textContent = hit
          ? `两边都是 ${fmt(+aj.target)}　对上了。注意：调节表不改账。`
          : `四笔都判完了，但两边没碰头——看看红色那几笔`;
      }
    };
    card.querySelectorAll(".adjrow").forEach(row=>{
      const k=+row.dataset.a, it=aj.items[k], amt=+(it.t.match(/(\d+)(?!.*\d)/)||[0])[0];
      row.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
        if(row.dataset.locked) return;
        row.dataset.locked="1"; done++;
        const ok=(btn.dataset.s===it.side && btn.dataset.g===it.sign);
        btn.classList.add(ok?"good":"bad");
        // 按正确答案调整数字（无论选对错，表都走正确路径）
        const d=(it.sign==="+"?amt:-amt);
        if(it.side==="firm") f+=d; else bk+=d;
        card.querySelector(`.adjwhy[data-w="${k}"]`).classList.add("on");
        if(!ok) $("ajMsg").textContent="这一笔判错了——看下面那行小字";
        upd();
      });
    });
    upd();
  }
  renderNav(); history.replaceState(null,"","#"+s.n); $("main").scrollTop=0;
  setTimeout(fitCard,30); setTimeout(fitCard,420);
}
function go(n){ const next=Math.max(0,Math.min(SLIDES.length-1,n)); const dir=next>i?"next":next<i?"prev":"next"; i=next; render(dir); }
function zoomText(html){ $("lb").innerHTML=`<div class="zoom-text">${html}</div>`; $("lb").classList.add("show"); }
$("prev").onclick=()=>go(i-1);
$("next").onclick=()=>go(i+1);
$("nav").onclick=e=>{ const b=e.target.closest("[data-i]"); if(b) go(+b.dataset.i); };
$("q").oninput=renderNav;
$("menuBtn").onclick=()=>{ if(window.innerWidth<=860) $("side").classList.toggle("open"); else document.body.classList.toggle("wide"); };
$("fontBig").onclick=()=>setFont(true);
$("fontSmall").onclick=()=>setFont(false);
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); go(i+1); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(i-1); }
  if(e.key==="Escape") $("lb").classList.remove("show");
});
$("card").addEventListener("click", e=>{
  if(e.target.closest(".go-draw")) return;
  if(e.target.tagName==="IMG"){ $("lb").innerHTML=`<img src="${e.target.src}" alt="">`; $("lb").classList.add("show"); return; }
  const p=e.target.closest("p,h2"); if(p) zoomText(p.innerHTML);
});
$("nowbar").addEventListener("click", e=>{ if(e.currentTarget.innerHTML) zoomText(e.currentTarget.innerHTML); });
$("lb").onclick=()=>$("lb").classList.remove("show");
document.body.classList.add("wide"); setFont(true);
const hash=parseInt(location.hash.replace("#",""),10);
if(hash>=1 && hash<=SLIDES.length) i=hash-1;
render();
</script>
</body>
</html>
